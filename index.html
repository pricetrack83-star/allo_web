<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <script>
        if (window.location.hostname !== 'allochat.site') {
            window.location.replace("https://allochat.site" + window.location.pathname + window.location.search);
        }
    </script>

    <meta http-equiv="refresh" content="0; url=https://allochat.site">
    <link rel="canonical" href="https://allochat.site">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>در حال انتقال به ALLO...</title> 

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a;
            color: white;
            font-family: 'Vazirmatn', sans-serif;
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a { color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div>
        <div class="loader" style="margin: 0 auto 20px auto;"></div>
        <h2>در حال انتقال به آدرس جدید ALLO...</h2>
        <p>اگر خودکار منتقل نشدید، <a href="https://allochat.site">اینجا کلیک کنید</a>.</p>
    </div>

</body>
</html>
