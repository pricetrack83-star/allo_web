<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLO | Next-Gen Cyber Terminal</title> 

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;500;800;900&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root {
    --primary: #00ffcc;
    --primary-glow: rgba(0, 255, 204, 0.4);
    --secondary: #ff0055;
    --accent: #bc13fe;
    --dark-bg: #020202;
    --glass: rgba(255, 255, 255, 0.03);
    --border: rgba(255, 255, 255, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }

body { 
    font-family: 'Vazirmatn', sans-serif; background: var(--dark-bg); color: white;
    height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center;
}

/* --- پس‌زمینه --- */
.bg-canvas { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 50%, #0a0f1a 0%, #000 100%); }
.particle { position: absolute; border-radius: 50%; background: var(--primary); filter: blur(80px); opacity: 0.1; animation: float 20s infinite alternate; }
@keyframes float { from { transform: translate(0, 0) scale(1); } to { transform: translate(100px, 100px) scale(1.5); } }

/* --- لاگین --- */
#loginScreen { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(25px); }
.login-card { width: 420px; padding: 60px 40px; border-radius: 50px; background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)); border: 1px solid var(--border); text-align: center; }
.brand-title { font-family: 'Orbitron', sans-serif; font-size: 80px; color: var(--primary); margin-bottom: 30px; text-shadow: 0 0 30px var(--primary-glow); }
.auth-mode-switch { display: flex; background: rgba(0,0,0,0.5); border-radius: 20px; margin-bottom: 25px; padding: 5px; border: 1px solid var(--border); }
.mode-btn { flex: 1; padding: 12px; border-radius: 15px; cursor: pointer; color: #666; border: none; background: none; font-weight: 800; }
.mode-btn.active { background: var(--primary); color: #000; }
.input-container input { width: 100%; padding: 18px; border-radius: 15px; background: rgba(0,0,0,0.6); border: 1px solid var(--border); color: #fff; margin-bottom: 15px; text-align: center; outline: none; }
.action-btn { width: 100%; padding: 18px; border-radius: 15px; background: var(--primary); color: #000; font-weight: 900; cursor: pointer; border: none; }

/* --- اپلیکیشن --- */
.app-frame { width: 96vw; height: 94vh; display: flex; background: rgba(10, 10, 10, 0.4); border: 1px solid var(--border); border-radius: 40px; backdrop-filter: blur(60px); overflow: hidden; position: relative; }
.sidebar { width: 320px; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
.user-item { padding: 15px 25px; margin: 5px 15px; border-radius: 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
.user-item.active { background: rgba(0, 255, 204, 0.1); border: 1px solid rgba(0, 255, 204, 0.2); }
.avatar-hex { width: 45px; height: 45px; background: #111; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-family: 'Orbitron'; position: relative; }
.is-online .avatar-hex::after { content: ''; position: absolute; top: -2px; right: -2px; width: 12px; height: 12px; background: var(--primary); border-radius: 50%; border: 2px solid #000; }

.chat-window { flex: 1; display: flex; flex-direction: column; }
.chat-header { padding: 20px 40px; background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; }
#messages { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
.bubble { padding: 14px 22px; border-radius: 20px; max-width: 70%; font-size: 14px; }
.bubble.me { align-self: flex-end; background: var(--primary); color: #000; font-weight: 600; }
.bubble.other { align-self: flex-start; background: #1a1a1a; border: 1px solid var(--border); }
.bubble.system { align-self: center; background: none; border: 1px dashed var(--border); opacity: 0.6; font-size: 11px; }

/* --- سیستم تماس شناور (تغییر یافته) --- */
#callUI {
    position: absolute; top: 20px; left: 20px; width: 280px; 
    background: rgba(5, 5, 5, 0.95); border: 1px solid var(--primary);
    border-radius: 30px; padding: 25px; z-index: 5000;
    display: none; flex-direction: column; align-items: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8); backdrop-filter: blur(20px);
}
.call-avatar-small { width: 70px; height: 70px; border-radius: 20px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 30px; color: #000; margin-bottom: 15px; }
.call-btns { display: flex; gap: 15px; margin-top: 20px; }
.c-btn { width: 50px; height: 50px; border-radius: 15px; border: none; cursor: pointer; font-size: 20px; }
</style>
</head>
<body>

<div class="bg-canvas">
    <div class="particle" style="width:400px; height:400px; top:10%; left:10%;"></div>
    <div class="particle" style="width:500px; height:500px; bottom:10%; right:10%; background:var(--accent);"></div>
</div>

<div id="loginScreen">
    <div class="brand-title">ALLO</div>
    <div class="login-card">
        <div class="auth-mode-switch">
            <button id="btnL" class="mode-btn active" onclick="setAuthMode('login')">ورود</button>
            <button id="btnR" class="mode-btn" onclick="setAuthMode('register')">ثبت‌نام</button>
        </div>
        <div class="input-container"><input id="uID" placeholder="USERNAME ID"></div>
        <div class="input-container"><input id="uPass" type="password" placeholder="ACCESS KEY"></div>
        <button class="action-btn" onclick="handleAuth()">INITIALIZE</button>
    </div>
</div>

<div class="app-frame">
    <div class="sidebar">
        <div style="padding:30px; border-bottom:1px solid var(--border);"><h2 style="font-family:'Orbitron'; color:var(--primary);">ALLO</h2></div>
        <div id="userList" style="flex:1; overflow-y:auto; padding-top:10px;"></div>
        <div style="padding:20px; border-top:1px solid var(--border);">
            <div id="myIDDisplay" style="font-size:10px; color:var(--primary); margin-bottom:5px;">OFFLINE</div>
            <button onclick="logout()" style="color:var(--secondary); background:none; border:none; cursor:pointer; font-size:11px;">TERMINATE ✕</button>
        </div>
    </div>

    <div class="chat-window">
        <div class="chat-header">
            <div style="display:flex; align-items:center; gap:15px;">
                <div id="hAvatar" style="width:40px; height:40px; background:var(--glass); border-radius:10px; display:flex; align-items:center; justify-content:center;">?</div>
                <h4 id="targetName">Terminal</h4>
            </div>
            <button onclick="startCall()" style="background:var(--primary); color:#000; border:none; padding:10px 20px; border-radius:12px; font-weight:900; cursor:pointer;">CALL</button>
        </div>
        <div id="messages"></div>
        <div style="padding:20px 30px; display:flex; gap:15px;">
            <input id="msgInput" style="flex:1; padding:18px; border-radius:15px; border:1px solid var(--border); background:rgba(0,0,0,0.4); color:#fff; outline:none;" placeholder="Encrypted message..." onkeypress="if(event.key=='Enter') sendMsg()">
            <button id="vBtn" onclick="toggleVoice()" style="width:55px; height:55px; border-radius:15px; border:1px solid var(--secondary); color:var(--secondary); background:none; cursor:pointer;">🎤</button>
            <button onclick="sendMsg()" style="width:55px; height:55px; border-radius:15px; background:var(--primary); color:#000; border:none; cursor:pointer;">✈</button>
        </div>
    </div>

    <div id="callUI">
        <div class="call-avatar-small" id="cAvatar">👤</div>
        <h4 id="cName">USER</h4>
        <p id="cStatus" style="font-size:10px; color:var(--primary); margin-top:5px;">CONNECTING...</p>
        <div class="call-btns">
            <button id="acceptBtn" onclick="answerCall()" class="c-btn" style="background:#2ecc71;">✅</button>
            <button id="muteBtn" onclick="toggleMute()" class="c-btn" style="background:rgba(255,255,255,0.1); display:none;">🎙️</button>
            <button onclick="hangup()" class="c-btn" style="background:var(--secondary);">❌</button>
        </div>
    </div>
</div>

<audio id="ring" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_ringtones.ogg" loop></audio>
<audio id="remoteAudio" autoplay></audio>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
    authDomain: "alloo-web.firebaseapp.com",
    projectId: "alloo-web",
    storageBucket: "alloo-web.appspot.com",
    messagingSenderId: "132232824762",
    appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me = localStorage.getItem("alloo_uid");
let activeTarget = "";
let authMode = 'login';
let pc; let localStream; let isMuted = false;
let currentCallPartner = "";

if(me) { document.getElementById("loginScreen").style.display = "none"; initApp(); }

function setAuthMode(m) {
    authMode = m;
    document.getElementById('btnL').className = `mode-btn ${m==='login'?'active':''}`;
    document.getElementById('btnR').className = `mode-btn ${m==='register'?'active':''}`;
}

async function handleAuth() {
    const id = document.getElementById("uID").value.trim().toLowerCase();
    const ps = document.getElementById("uPass").value.trim();
    if(!id || !ps) return;
    const userRef = db.collection("users").doc(id);
    const doc = await userRef.get();
    if(authMode === 'register') {
        if(doc.exists) return alert("ID Reserved");
        await userRef.set({ pass: ps, online: true, lastSeen: Date.now() });
    } else {
        if(!doc.exists || doc.data().pass !== ps) return alert("Error");
        await userRef.update({ online: true, lastSeen: Date.now() });
    }
    localStorage.setItem("alloo_uid", id);
    location.reload();
}

function initApp() {
    document.getElementById("myIDDisplay").innerText = "NODE: " + me.toUpperCase();
    db.collection("users").doc(me).update({ online: true, lastSeen: Date.now() });
    
    db.collection("users").onSnapshot(snap => {
        const list = document.getElementById("userList");
        list.innerHTML = "";
        snap.forEach(doc => {
            if(doc.id === me) return;
            const d = doc.data();
            const isOnline = d.online && (Date.now() - d.lastSeen < 60000);
            const item = document.createElement("div");
            item.className = `user-item ${activeTarget === doc.id ? 'active' : ''} ${isOnline ? 'is-online' : ''}`;
            item.innerHTML = `<div class="avatar-hex">${doc.id[0].toUpperCase()}</div><div style="flex:1"><div style="font-weight:800;">${doc.id}</div></div>`;
            item.onclick = () => { activeTarget = doc.id; selectUser(); };
            list.appendChild(item);
        });
    });
    listenForCalls();
}

function selectUser() {
    document.getElementById("targetName").innerText = activeTarget.toUpperCase();
    document.getElementById("hAvatar").innerText = activeTarget[0].toUpperCase();
    loadMessages();
}

function loadMessages() {
    db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
        const box = document.getElementById("messages");
        box.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            if((d.f==me && d.t==activeTarget) || (d.f==activeTarget && d.t==me)) {
                const m = document.createElement("div");
                m.className = `bubble ${d.type==='sys' ? 'system' : (d.f==me ? 'me' : 'other')}`;
                if(d.audio) m.innerHTML = `<audio src="${d.audio}" controls style="filter:invert(1); height:30px;"></audio>`;
                else m.innerText = d.txt;
                box.appendChild(m);
            }
        });
        box.scrollTop = box.scrollHeight;
    });
}

function sendMsg(txt = null, type = 'text') {
    const i = document.getElementById("msgInput");
    const message = txt || i.value;
    if(!message || !activeTarget) return;
    db.collection("messages").add({ f: me, t: activeTarget, txt: message, type: type, time: Date.now() });
    if(!txt) i.value = "";
}

// --- سیستم تماس (WebRTC + Sync) ---
const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

function listenForCalls() {
    db.collection("calls").doc(me).onSnapshot(async snap => {
        const d = snap.data();
        // قطع دوطرفه: اگر در حال تماس بودیم و سند حذف شد
        if(!d && currentCallPartner) {
            stopCallUI();
            return;
        }
        // تماس ورودی
        if(d?.offer && !pc) {
            currentCallPartner = d.from;
            window.incoming = d;
            document.getElementById("callUI").style.display = "flex";
            document.getElementById("cName").innerText = d.from.toUpperCase();
            document.getElementById("acceptBtn").style.display = "block";
            document.getElementById("muteBtn").style.display = "none";
            document.getElementById("ring").play();
        } else if(d?.answer && pc) {
            await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
            document.getElementById("cStatus").innerText = "SECURE LINE";
        }
    });
}

async function startCall() {
    if(!activeTarget) return;
    currentCallPartner = activeTarget;
    document.getElementById("callUI").style.display = "flex";
    document.getElementById("cName").innerText = activeTarget.toUpperCase();
    document.getElementById("acceptBtn").style.display = "none";
    document.getElementById("muteBtn").style.display = "block";

    pc = new RTCPeerConnection(rtcConfig);
    pc.onicecandidate = e => { if(e.candidate) db.collection("calls").doc(activeTarget).collection("callerCandidates").add(e.candidate.toJSON()); };
    pc.ontrack = e => document.getElementById("remoteAudio").srcObject = e.streams[0];

    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await db.collection("calls").doc(activeTarget).set({ offer, from: me });

    // ثبت ICE Candidates طرف مقابل
    db.collection("calls").doc(activeTarget).collection("receiverCandidates").onSnapshot(s => {
        s.docChanges().forEach(c => { if(c.type==='added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
    });
}

async function answerCall() {
    document.getElementById("ring").pause();
    document.getElementById("acceptBtn").style.display = "none";
    document.getElementById("muteBtn").style.display = "block";

    pc = new RTCPeerConnection(rtcConfig);
    pc.onicecandidate = e => { if(e.candidate) db.collection("calls").doc(me).collection("receiverCandidates").add(e.candidate.toJSON()); };
    pc.ontrack = e => document.getElementById("remoteAudio").srcObject = e.streams[0];

    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    await pc.setRemoteDescription(new RTCSessionDescription(window.incoming.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await db.collection("calls").doc(me).update({ answer });

    db.collection("calls").doc(me).collection("callerCandidates").onSnapshot(s => {
        s.docChanges().forEach(c => { if(c.type==='added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
    });
}

async function hangup() {
    const partner = currentCallPartner;
    if(partner) {
        await db.collection("calls").doc(me).delete();
        await db.collection("calls").doc(partner).delete();
        // ثبت در چت
        db.collection("messages").add({ f: me, t: partner, txt: "📞 TERMINATED", type: 'sys', time: Date.now() });
    }
    stopCallUI();
}

function stopCallUI() {
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    if(pc) { pc.close(); pc = null; }
    document.getElementById("callUI").style.display = "none";
    document.getElementById("ring").pause();
    document.getElementById("remoteAudio").srcObject = null;
    currentCallPartner = "";
    isMuted = false;
    document.getElementById("muteBtn").innerText = "🎙️";
}

function toggleMute() {
    isMuted = !isMuted;
    localStream.getAudioTracks()[0].enabled = !isMuted;
    document.getElementById("muteBtn").innerText = isMuted ? "🚫" : "🎙️";
}

// --- ویس مسیج ---
let rec; let chunks = [];
async function toggleVoice() {
    const v = document.getElementById("vBtn");
    if(!rec || rec.state === 'inactive') {
        const s = await navigator.mediaDevices.getUserMedia({ audio: true });
        rec = new MediaRecorder(s); chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
            const b = new Blob(chunks, { type: 'audio/webm' });
            const r = new FileReader(); r.readAsDataURL(b);
            r.onloadend = () => db.collection("messages").add({ f: me, t: activeTarget, audio: r.result, time: Date.now() });
        };
        rec.start(); v.style.background = "var(--secondary)";
    } else { rec.stop(); v.style.background = "none"; }
}

function logout() { db.collection("users").doc(me).update({ online: false }); localStorage.clear(); location.reload(); }
</script>
</body>
</html>
