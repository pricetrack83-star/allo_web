<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ALLO | Next-Gen Messenger</title> 

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700;900&family=Orbitron:wght@400;600;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #00ffcc;
            --primary-bg: #0a0b10;
            --accent: #7000ff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #e0e0e0;
            --me-gradient: linear-gradient(135deg, #00ffcc 0%, #0099ff 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--primary-bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* پس‌زمینه متحرک */
        .bg-glow {
            position: fixed;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #1a1b25 0%, #050505 100%);
            z-index: -1;
        }

        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent);
            filter: blur(120px);
            opacity: 0.15;
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(20%, 20%); }
        }

        /* فریم اصلی برنامه */
        .app-container {
            width: 95vw;
            height: 92vh;
            max-width: 1400px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 30px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* سایدبار */
        .sidebar {
            width: 380px;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.2);
        }

        .sidebar-header {
            padding: 30px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Orbitron';
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: 5px;
            text-shadow: 0 0 15px var(--primary);
        }

        .user-list { flex: 1; overflow-y: auto; padding: 15px; }

        .user-card {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .user-card:hover { background: rgba(255,255,255,0.05); }
        .user-card.active {
            background: rgba(0, 255, 204, 0.08);
            border-color: rgba(0, 255, 204, 0.2);
        }

        .avatar {
            width: 55px;
            height: 55px;
            background: #1a1c25;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron';
            color: var(--primary);
            font-weight: bold;
            border: 1px solid var(--border);
            position: relative;
        }

        .online-status {
            position: absolute;
            bottom: -2px;
            left: -2px;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            border: 2px solid #0a0b10;
            box-shadow: 0 0 10px var(--primary);
        }

        /* بخش چت */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 20px 35px;
            background: rgba(0,0,0,0.15);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #messages-container {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* حباب‌های پیام */
        .msg {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 22px;
            font-size: 14.5px;
            line-height: 1.6;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.sent {
            align-self: flex-end;
            background: var(--me-gradient);
            color: #000;
            font-weight: 600;
            border-bottom-right-radius: 4px;
        }

        .msg.received {
            align-self: flex-start;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .msg img {
            max-width: 100%;
            border-radius: 15px;
            margin-bottom: 5px;
        }

        /* فوتر و ورودی */
        .chat-footer {
            padding: 20px 30px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid var(--border);
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .input-box input {
            flex: 1;
            background: none;
            border: none;
            color: white;
            padding: 12px;
            outline: none;
            font-size: 15px;
        }

        .btn-icon {
            width: 45px;
            height: 45px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: 0.2s;
        }

        .btn-send { background: var(--primary); color: #000; }
        .btn-util { background: var(--glass); color: #fff; border: 1px solid var(--border); }

        /* ریسپانسیو موبایل */
        @media (max-width: 768px) {
            .app-container { width: 100vw; height: 100dvh; border-radius: 0; }
            .sidebar { 
                width: 100%; 
                position: absolute; 
                z-index: 10; 
                height: 100%;
                transition: 0.4s;
            }
            .sidebar.hidden { transform: translateX(100%); }
            
            .chat-footer {
                padding-bottom: calc(20px + env(safe-area-inset-bottom));
            }
        }

        /* اسکرول‌بار زیبا */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="bg-glow"><div class="blob"></div></div>

    <div id="login-overlay" style="position:fixed; inset:0; z-index:100; background:#050505; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <div class="logo" style="font-size:50px; margin-bottom:40px;">ALLO</div>
        <div style="width:320px; display:flex; flex-direction:column; gap:15px;">
            <input id="uID" placeholder="User ID" style="padding:18px; border-radius:15px; border:1px solid var(--border); background:#111; color:white; text-align:center;">
            <input id="uPass" type="password" placeholder="Password" style="padding:18px; border-radius:15px; border:1px solid var(--border); background:#111; color:white; text-align:center;">
            <button onclick="handleAuth()" style="padding:18px; border-radius:15px; background:var(--primary); border:none; font-weight:900; cursor:pointer;">CONNECT</button>
        </div>
    </div>

    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">ALLO</div>
            </div>
            <div class="user-list" id="user-list"></div>
            <div style="padding:20px; border-top:1px solid var(--border);">
                <button onclick="logout()" style="width:100%; padding:12px; border-radius:12px; background:rgba(255,0,0,0.1); color:#ff5555; border:1px solid #ff5555; font-size:12px; cursor:pointer;">DISCONNECT</button>
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:15px;">
                    <button onclick="toggleSidebar()" id="back-btn" class="btn-util" style="display:none; width:35px; height:35px;">⬅</button>
                    <div id="active-avatar" class="avatar" style="width:40px; height:40px; font-size:14px;">?</div>
                    <div>
                        <div id="active-name" style="font-weight:bold; font-size:16px;">انتخاب مخاطب</div>
                        <div id="active-status" style="font-size:10px; color:var(--primary); font-family:'Orbitron';">READY</div>
                    </div>
                </div>
                <button onclick="startCall()" class="btn-send" style="padding:8px 20px; border-radius:10px; font-size:12px; font-family:'Orbitron'; font-weight:bold;">VOICE CALL</button>
            </div>

            <div id="messages-container"></div>

            <div class="chat-footer">
                <div id="voice-rec" style="display:none; color:var(--primary); font-size:10px; margin-bottom:10px; font-family:'Orbitron';">● RECORDING SIGNAL...</div>
                <div class="input-box">
                    <button onclick="document.getElementById('imgInp').click()" class="btn-util">🖼️</button>
                    <input type="file" id="imgInp" hidden accept="image/*" onchange="sendImage(this)">
                    
                    <input id="mInput" placeholder="Write something..." onkeypress="if(event.key=='Enter') sendMsg()">
                    
                    <button id="vBtn" onclick="toggleVoice()" class="btn-util">🎤</button>
                    <button onclick="sendMsg()" class="btn-send btn-icon">✈</button>
                </div>
            </div>
        </div>
    </div>

    <div id="call-ui" style="display:none; position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.95); backdrop-filter:blur(20px); flex-direction:column; align-items:center; justify-content:center;">
        <div class="avatar" style="width:120px; height:120px; font-size:40px; margin-bottom:20px;" id="c-avatar">?</div>
        <h2 id="c-name" style="font-family:'Orbitron'; margin-bottom:10px;">USER</h2>
        <div style="color:var(--primary); animation:pulse 1s infinite alternate;">INCOMING CALL...</div>
        <div style="display:flex; gap:30px; margin-top:50px;">
            <button onclick="answerCall()" style="width:70px; height:70px; border-radius:50%; background:#2ecc71; border:none; font-size:25px;">✅</button>
            <button onclick="hangup()" style="width:70px; height:70px; border-radius:50%; background:#ff4444; border:none; font-size:25px;">❌</button>
        </div>
    </div>

    <audio id="ringtone" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_ringtones.ogg" loop></audio>
    <audio id="remote-audio" autoplay playsinline></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
            authDomain: "alloo-web.firebaseapp.com",
            projectId: "alloo-web",
            storageBucket: "alloo-web.appspot.com",
            messagingSenderId: "132232824762",
            appId: "1:132232824762:web:4e3c25557c072f0feabf83"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let me = localStorage.getItem("alloo_uid");
        let target = "";
        let pc; let stream;

        if(me) { 
            document.getElementById("login-overlay").style.display = "none";
            initApp();
        }

        async function handleAuth() {
            const id = document.getElementById("uID").value.toLowerCase().trim();
            const pw = document.getElementById("uPass").value.trim();
            if(!id || !pw) return;
            const ref = db.collection("users").doc(id);
            const doc = await ref.get();
            if(!doc.exists) await ref.set({pass:pw, online:true, last:Date.now()});
            else if(doc.data().pass !== pw) return alert("خطا در رمز");
            localStorage.setItem("alloo_uid", id);
            location.reload();
        }

        function initApp() {
            db.collection("users").doc(me).update({online:true, last:Date.now()});
            setInterval(() => db.collection("users").doc(me).update({online:true, last:Date.now()}), 20000);

            db.collection("users").onSnapshot(snap => {
                const list = document.getElementById("user-list");
                list.innerHTML = "";
                snap.forEach(doc => {
                    if(doc.id === me) return;
                    const d = doc.data();
                    const isOn = d.online && (Date.now() - d.last < 60000);
                    const card = document.createElement("div");
                    card.className = `user-card ${target === doc.id ? 'active' : ''}`;
                    card.innerHTML = `
                        <div class="avatar">${doc.id[0].toUpperCase()}${isOn ? '<div class="online-status"></div>' : ''}</div>
                        <div><div style="font-weight:bold;">${doc.id}</div><div style="font-size:10px; opacity:0.5;">${isOn ? 'ONLINE' : 'OFFLINE'}</div></div>
                    `;
                    card.onclick = () => selectUser(doc.id);
                    list.appendChild(card);
                });
            });
            listenCall();
        }

        function selectUser(id) {
            target = id;
            document.getElementById("active-name").innerText = id;
            document.getElementById("active-avatar").innerText = id[0].toUpperCase();
            if(window.innerWidth < 768) {
                document.getElementById("sidebar").classList.add("hidden");
                document.getElementById("back-btn").style.display = "flex";
            }
            loadMsgs();
        }

        function toggleSidebar() {
            document.getElementById("sidebar").classList.remove("hidden");
            document.getElementById("back-btn").style.display = "none";
        }

        function loadMsgs() {
            db.collection("messages").orderBy("time","asc").onSnapshot(snap => {
                const box = document.getElementById("messages-container");
                box.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    if((d.f==me && d.t==target) || (d.f==target && d.t==me)) {
                        const m = document.createElement("div");
                        m.className = `msg ${d.f==me ? 'sent' : 'received'}`;
                        if(d.img) m.innerHTML = `<img src="${d.img}">${d.txt||''}`;
                        else if(d.audio) m.innerHTML = `<audio src="${d.audio}" controls style="width:200px;"></audio>`;
                        else m.innerText = d.txt;
                        box.appendChild(m);
                    }
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMsg() {
            const inp = document.getElementById("mInput");
            if(!inp.value || !target) return;
            db.collection("messages").add({f:me, t:target, txt:inp.value, time:Date.now()});
            inp.value = "";
        }

        function sendImage(inp) {
            const file = inp.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                db.collection("messages").add({f:me, t:target, img:e.target.result, time:Date.now()});
            };
            reader.readAsDataURL(file);
        }

        // سیستم تماس (WebRTC)
        const cfg = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
        async function startCall() {
            document.getElementById("call-ui").style.display = "flex";
            pc = new RTCPeerConnection(cfg);
            stream = await navigator.mediaDevices.getUserMedia({audio:true});
            stream.getTracks().forEach(t => pc.addTrack(t, stream));
            pc.ontrack = e => document.getElementById("remote-audio").srcObject = e.streams[0];
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await db.collection("calls").doc(target).set({offer, from:me});
            db.collection("calls").doc(target).onSnapshot(s => {
                if(s.data()?.ans) pc.setRemoteDescription(new RTCSessionDescription(s.data().ans));
            });
        }

        function listenCall() {
            db.collection("calls").doc(me).onSnapshot(async s => {
                const d = s.data();
                if(d?.offer && !pc) {
                    window.inc = d;
                    document.getElementById("call-ui").style.display = "flex";
                    document.getElementById("c-name").innerText = d.from;
                    document.getElementById("ringtone").play();
                } else if(!d && pc) hangup();
            });
        }

        async function answerCall() {
            document.getElementById("ringtone").pause();
            pc = new RTCPeerConnection(cfg);
            stream = await navigator.mediaDevices.getUserMedia({audio:true});
            stream.getTracks().forEach(t => pc.addTrack(t, stream));
            pc.ontrack = e => document.getElementById("remote-audio").srcObject = e.streams[0];
            await pc.setRemoteDescription(new RTCSessionDescription(window.inc.offer));
            const ans = await pc.createAnswer();
            await pc.setLocalDescription(ans);
            await db.collection("calls").doc(me).update({ans});
        }

        function hangup() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            if(pc) pc.close(); pc = null;
            db.collection("calls").doc(me).delete();
            document.getElementById("call-ui").style.display = "none";
            document.getElementById("ringtone").pause();
        }

        // ویس
        let rec; let chunks = [];
        async function toggleVoice() {
            if(!rec || rec.state === 'inactive') {
                const s = await navigator.mediaDevices.getUserMedia({audio:true});
                rec = new MediaRecorder(s);
                rec.ondataavailable = e => chunks.push(e.data);
                rec.onstop = () => {
                    const blob = new Blob(chunks, {type:'audio/ogg'});
                    const reader = new FileReader();
                    reader.onload = (e) => db.collection("messages").add({f:me, t:target, audio:e.target.result, time:Date.now()});
                    reader.readAsDataURL(blob);
                    chunks = []; s.getTracks().forEach(t => t.stop());
                };
                rec.start();
                document.getElementById("voice-rec").style.display = "block";
            } else {
                rec.stop();
                document.getElementById("voice-rec").style.display = "none";
            }
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
