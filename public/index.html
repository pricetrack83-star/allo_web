<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLO 🚀</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/wavesurfer.js"></script>

<style>
/* ==== Reset & Base ==== */
body{
  margin:0;
  font-family:'Vazirmatn',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  transition:0.5s;
}
body.light{
  background:linear-gradient(135deg,#f5f5f5,#ddd);
  color:#111;
}
body.dark{
  background:linear-gradient(135deg,#0f0f0f,#1a1a1a);
  color:white;
}

/* ==== App Container ==== */
.app{
  width:980px;
  height:720px;
  border-radius:30px;
  backdrop-filter:blur(25px);
  display:flex;
  overflow:hidden;
  transition:0.5s;
}
body.light .app{
  background:rgba(255,255,255,0.9);
  box-shadow:0 0 60px rgba(0,200,255,0.2);
}
body.dark .app{
  background:rgba(20,20,20,0.9);
  box-shadow:0 0 60px rgba(0,255,118,0.4);
}

/* ==== Login ==== */
#loginBox{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:20px;
}
#loginBox input{
  width:280px;
  padding:14px;
  border-radius:30px;
  border:none;
  background:#222;
  color:white;
  outline:none;
  transition:0.3s;
}
body.light #loginBox input{background:#ddd; color:#111;}
#loginBox input:focus{background:#333;}
body.light #loginBox input:focus{background:#ccc;}
#loginBox button{
  width:180px;
  padding:14px;
  border-radius:30px;
  border:none;
  background:linear-gradient(135deg,#00ff80,#00e676);
  color:black;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,255,118,0.4);
  transition:0.2s;
}
#loginBox button:hover{
  transform:scale(1.08);
  box-shadow:0 8px 25px rgba(0,255,118,0.6);
}

/* ==== Chat ==== */
#chatBox{display:none; flex:1; flex-direction:row; transition:0.5s;}
#onlineList{
  width:220px;
  padding:15px;
  display:flex;
  flex-direction:column;
  border-radius:0 0 0 30px;
  transition:0.5s;
  overflow-y:auto;
}
body.light #onlineList{
  background:rgba(240,240,240,0.95);
  border-right:2px solid #00aaff;
}
body.dark #onlineList{
  background:rgba(30,30,30,0.95);
  border-right:2px solid #00ff80;
}
#onlineList h3{
  text-align:center;
  margin-bottom:12px;
  text-shadow:0 0 8px currentColor;
}
.user{
  padding:12px;
  margin:5px 0;
  border-radius:25px;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 2px 8px rgba(0,255,118,0.2);
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.user:hover{
  transform:scale(1.05);
  box-shadow:0 5px 18px rgba(0,255,118,0.5);
}
body.light .user:hover{box-shadow:0 5px 18px rgba(0,170,255,0.5);}

/* ==== Chat Area ==== */
#chatArea{
  flex:1;
  display:flex;
  flex-direction:column;
  margin-left:10px;
  border-radius:0 30px 30px 0;
  padding:10px;
  transition:0.5s;
}
body.light #chatArea{background:rgba(255,255,255,0.9);}
body.dark #chatArea{background:rgba(10,10,10,0.9);}
#messages{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:10px;
}
.msg{
  padding:14px 20px;
  border-radius:25px;
  max-width:70%;
  position:relative;
  transition:0.3s;
  cursor:pointer;
  font-size:14px;
  word-break:break-word;
  box-shadow:0 2px 12px rgba(0,255,118,0.2);
}
.me{
  background:linear-gradient(135deg,#00ff80,#00e676);
  color:black;
  align-self:flex-end;
}
.other{
  background:linear-gradient(135deg,#333,#111);
  color:white;
}
.msg small{
  font-size:10px;
  color:#ccc;
  display:block;
  margin-top:5px;
}

/* ==== Footer ==== */
.footer{
  display:flex;
  gap:10px;
  padding:12px;
  border-top:2px solid currentColor;
  border-radius:0 0 30px 0;
  align-items:center;
}
.footer input{
  flex:1;
  padding:14px;
  border-radius:25px;
  border:none;
  background:#222;
  color:white;
  outline:none;
  transition:0.3s;
}
body.light .footer input{background:#eee; color:#111;}
.footer input:focus{background:#333;}
body.light .footer input:focus{background:#ccc;}
.footer button{
  padding:14px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#00ff80,#00e676);
  color:black;
  cursor:pointer;
  font-size:18px;
  transition:0.2s;
}
.footer button:hover{
  transform:scale(1.2);
  box-shadow:0 6px 20px rgba(0,255,118,0.6);
}

/* ==== Waveform ==== */
.waveform-container{
  width:100%;
  height:50px;
  border-radius:15px;
  overflow:hidden;
  margin-top:5px;
  box-shadow:0 0 10px rgba(0,255,118,0.4);
  cursor:pointer;
}

/* ==== Image ==== */
img{
  max-width:220px;
  border-radius:15px;
  margin-top:5px;
}

/* ==== Typing animation ==== */
.typing{
  font-size:13px;
  font-weight:bold;
  color:#00ff80;
  margin-left:5px;
  font-style:italic;
  animation:blink 1s infinite;
}
@keyframes blink{
  0%,100%{opacity:1;}
  50%{opacity:0.3;}
}

/* ==== Theme toggle button ==== */
#themeToggle{
  margin:10px;
  padding:10px 15px;
  border-radius:25px;
  border:none;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,#00ff80,#00e676);
  box-shadow:0 3px 12px rgba(0,255,118,0.3);
  transition:0.3s;
}
#themeToggle:hover{
  transform:scale(1.1);
  box-shadow:0 6px 20px rgba(0,255,118,0.5);
}

/* ==== Voice Recorder UI ==== */
#voiceControls{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:5px;
}
#recordBtn{
  padding:10px 18px;
  border-radius:50px;
  border:none;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,#ff4081,#f50057);
  color:white;
  transition:0.3s;
}
#recordBtn.recording{
  background:linear-gradient(135deg,#ff5252,#ff1744);
  animation:pulse 1s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 5px #ff5252;}
  50%{box-shadow:0 0 20px #ff1744;}
  100%{box-shadow:0 0 5px #ff5252;}
}
#recTimer{
  font-weight:bold;
  color:#ff5252;
}
</style>
</head>
<body class="dark">

<div class="app">

<!-- Login -->
<div id="loginBox">
  <div style="font-size:38px;font-weight:bold;color:#00ff80;text-shadow:0 0 20px #00ff80;">ALLO 🚀</div>
  <input id="usernameInput" placeholder="نام کاربری">
  <input id="passwordInput" type="password" placeholder="رمز عبور">
  <button onclick="registerUser()">ثبت نام</button>
  <button onclick="loginUser()">ورود</button>
  <button id="themeToggle" onclick="toggleTheme()">تغییر تم 🌗</button>
</div>

<!-- Chat -->
<div id="chatBox">
  <div id="onlineList">
    <h3>آنلاین‌ها</h3>
    <div id="users"></div>
  </div>
  <div id="chatArea">
    <div id="messages"></div>
    <div class="typing" id="typingInfo"></div>
    <div class="footer">
      <input id="msgInput" placeholder="پیام...">
      <button onclick="sendMessage()">💬</button>
      <input type="file" id="imgInput" style="display:none;" accept="image/*">
      <button onclick="document.getElementById('imgInput').click()">📸</button>
      <div id="voiceControls">
        <button id="recordBtn" onclick="toggleRecording()">🎤 ضبط</button>
        <span id="recTimer">00:00</span>
      </div>
    </div>
    <button onclick="logout()" style="margin:10px;background:#ff5252;border-radius:25px;padding:10px;font-weight:bold;cursor:pointer;">خروج</button>
  </div>
</div>

<script>
// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
  authDomain: "alloo-web.firebaseapp.com",
  projectId: "alloo-web",
  storageBucket: "alloo-web.firebasestorage.app",
  messagingSenderId: "132232824762",
  appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me="", activeUser="", recorder=null, recChunks=[], recInterval=null, recSeconds=0;
let typingTimeout;

// Theme toggle
function toggleTheme(){
  document.body.classList.toggle('light');
  document.body.classList.toggle('dark');
}

// Register & Login
function registerUser(){
  let u=document.getElementById("usernameInput").value.trim();
  let p=document.getElementById("passwordInput").value.trim();
  if(!u||!p) return alert("هر دو فیلد لازم است");
  db.collection("users").doc(u).get().then(doc=>{
    if(doc.exists) return alert("این کاربر قبلاً ساخته شده است");
    db.collection("users").doc(u).set({password:p,online:true});
    me=u; localStorage.setItem("allo_user",me); startApp();
  });
}
function loginUser(){
  let u=document.getElementById("usernameInput").value.trim();
  let p=document.getElementById("passwordInput").value.trim();
  if(!u||!p) return alert("هر دو فیلد لازم است");
  db.collection("users").doc(u).get().then(doc=>{
    if(!doc.exists) return alert("کاربر وجود ندارد");
    if(doc.data().password!==p) return alert("رمز اشتباه است");
    me=u; localStorage.setItem("allo_user",me);
    db.collection("users").doc(me).update({online:true});
    startApp();
  });
}

// Start App
function startApp(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("chatBox").style.display="flex";
  loadUsers(); loadMessages();
}

// Users
function loadUsers(){
  db.collection("users").onSnapshot(snap=>{
    const usersDiv=document.getElementById("users"); usersDiv.innerHTML="";
    snap.forEach(doc=>{
      if(doc.id===me) return;
      let div=document.createElement("div");
      div.className="user";
      div.innerHTML=`<span>${doc.id}</span><span>${doc.data().online?"✅":"❌"}</span>`;
      div.onclick=()=>{ activeUser=doc.id; loadMessages(); };
      usersDiv.appendChild(div);
    });
  });
}

// Messages
function loadMessages(){
  db.collection("messages").orderBy("time").onSnapshot(snap=>{
    const msgDiv=document.getElementById("messages"); msgDiv.innerHTML="";
    snap.forEach(doc=>{
      let m=doc.data();
      if(!((m.from===me&&m.to===activeUser)||(m.from===activeUser&&m.to===me))) return;
      let div=document.createElement("div");
      div.className="msg "+(m.from===me?"me":"other");
      if(m.text) div.innerText=m.text;
      if(m.image){let img=document.createElement("img"); img.src=m.image; div.appendChild(img);}
      if(m.audio){
        let container=document.createElement("div"); container.className='waveform-container';
        let ws=WaveSurfer.create({container:container,waveColor:'#00e676',progressColor:'#fff',cursorColor:'#fff',barWidth:2,height:50,responsive:true});
        ws.load(m.audio);
        container.onclick=()=>ws.isPlaying()?ws.pause():ws.play();
        div.appendChild(container);
      }
      if(m.seen && m.from===me) div.innerHTML+='<small>✔✔ Seen</small>';
      msgDiv.appendChild(div);
    });
    msgDiv.scrollTop=99999;
  });
}

// Send message
function sendMessage(){
  let text=document.getElementById("msgInput").value.trim();
  if(!text||!activeUser) return;
  db.collection("messages").add({from:me,to:activeUser,text,time:Date.now()});
  document.getElementById("msgInput").value="";
}

// Send image
document.getElementById("imgInput").addEventListener("change",function(e){
  const file=e.target.files[0];
  if(!file||!activeUser) return;
  const url=URL.createObjectURL(file);
  db.collection("messages").add({from:me,to:activeUser,image:url,time:Date.now()});
});

// Voice Recorder
async function toggleRecording(){
  const btn=document.getElementById("recordBtn");
  const timer=document.getElementById("recTimer");
  if(recorder && recorder.state==="recording"){
    recorder.stop();
    clearInterval(recInterval);
    btn.classList.remove("recording");
    recSeconds=0; timer.innerText="00:00";
    return;
  }
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  recorder=new MediaRecorder(stream); recChunks=[];
  recorder.ondataavailable=e=>recChunks.push(e.data);
  recorder.onstop=()=>{
    const blob=new Blob(recChunks,{type:'audio/webm'});
    const url=URL.createObjectURL(blob);
    if(activeUser) db.collection("messages").add({from:me,to:activeUser,audio:url,time:Date.now()});
  };
  recorder.start();
  btn.classList.add("recording");
  recInterval=setInterval(()=>{
    recSeconds++;
    let m=Math.floor(recSeconds/60).toString().padStart(2,'0');
    let s=(recSeconds%60).toString().padStart(2,'0');
    timer.innerText=`${m}:${s}`;
  },1000);
}

// Typing
document.getElementById("msgInput").addEventListener("input",()=>{
  if(!activeUser) return;
  db.collection("typing").doc(activeUser).set({typing:true});
  clearTimeout(typingTimeout);
  typingTimeout=setTimeout(()=>db.collection("typing").doc(activeUser).set({typing:false}),1000);
});
db.collection("typing").onSnapshot(snap=>{
  snap.forEach(doc=>{
    if(doc.id===me) return;
    document.getElementById("typingInfo").innerText=doc.data().typing?`${doc.id} در حال تایپ...`:"";
  });
});

// Logout
function logout(){
  db.collection("users").doc(me).update({online:false});
  localStorage.removeItem("allo_user");
  location.reload();
}

// Auto-login
window.onload=()=>{
  let saved=localStorage.getItem("allo_user");
  if(saved){ me=saved; db.collection("users").doc(me).update({online:true}); startApp(); }
};
</script>

</body>
</html>
