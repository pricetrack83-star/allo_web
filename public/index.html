<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLO</title> 
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/wavesurfer.js"></script>

<style>
/* ==================== BODY ==================== */
body{
  margin:0;
  font-family:'Vazirmatn',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  transition:0.5s;
}
body.light{
  background:linear-gradient(135deg,#f5f5f5,#ddd);
  color:#111;
}
body.dark{
  background:linear-gradient(135deg,#0f0f0f,#1a1a1a);
  color:white;
}

/* ==================== APP ==================== */
.app{
  width:980px;
  height:720px;
  border-radius:30px;
  backdrop-filter:blur(25px);
  display:flex;
  overflow:hidden;
  transition:0.5s;
  box-shadow:0 10px 40px rgba(0,0,0,0.2);
}
body.light .app{
  background:rgba(255,255,255,0.95);
  box-shadow:0 0 60px rgba(0,200,255,0.2);
}
body.dark .app{
  background:rgba(20,20,20,0.95);
  box-shadow:0 0 60px rgba(0,255,118,0.4);
}

/* ==================== LOGIN ==================== */
#loginBox{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:15px;
}
#loginBox input{
  width:300px;
  padding:16px;
  border-radius:30px;
  border:none;
  background:#222;
  color:white;
  outline:none;
  font-size:15px;
  transition:0.3s;
  box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
body.light #loginBox input{background:#eee; color:#111;}
#loginBox input:focus{background:#333; box-shadow:0 0 10px #00ff80;}
body.light #loginBox input:focus{background:#ccc; box-shadow:0 0 10px #00aaff;}
#loginBox button{
  width:200px;
  padding:16px;
  border-radius:30px;
  border:none;
  background:linear-gradient(135deg,#00ff80,#00e676);
  color:black;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
  box-shadow:0 5px 15px rgba(0,255,118,0.4);
  transition:0.3s;
}
#loginBox button:hover{
  transform:scale(1.1);
  box-shadow:0 8px 25px rgba(0,255,118,0.6);
}

/* ==================== CHAT ==================== */
#chatBox{display:none; flex:1; flex-direction:row; transition:0.5s;}
#onlineList{
  width:240px;
  padding:15px;
  display:flex;
  flex-direction:column;
  border-radius:0 0 0 30px;
  transition:0.5s;
  overflow-y:auto;
  background:rgba(30,30,30,0.95);
}
body.light #onlineList{
  background:rgba(240,240,240,0.95);
  border-right:2px solid #00aaff;
}
body.dark #onlineList{
  background:rgba(30,30,30,0.95);
  border-right:2px solid #00ff80;
}
#onlineList h3{
  text-align:center;
  margin-bottom:12px;
  text-shadow:0 0 8px currentColor;
}
.user{
  padding:12px 15px;
  margin:5px 0;
  border-radius:25px;
  cursor:pointer;
  transition:0.3s;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,0.2);
}
.user:hover{
  transform:scale(1.05);
  background:linear-gradient(135deg,#00ff80,#00e676);
  color:black;
  box-shadow:0 5px 18px rgba(0,255,118,0.5);
}
body.light .user:hover{background:linear-gradient(135deg,#00aaff,#00d4ff); color:white;}

/* ==================== CHAT AREA ==================== */
#chatArea{
  flex:1;
  display:flex;
  flex-direction:column;
  margin-left:10px;
  border-radius:0 30px 30px 0;
  padding:10px;
  transition:0.5s;
  background:rgba(10,10,10,0.9);
  position:relative;
}
body.light #chatArea{background:rgba(255,255,255,0.95);}
#userID{
  font-size:13px;
  color:#00ff80;
  text-align:center;
  margin-bottom:5px;
  font-weight:bold;
}
#messages{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:10px;
}
.msg{
  padding:14px 20px;
  border-radius:25px;
  max-width:70%;
  position:relative;
  transition:0.3s;
  cursor:pointer;
  font-size:14px;
  word-break:break-word;
  box-shadow:0 2px 12px rgba(0,255,118,0.2);
}
.me{
  background:linear-gradient(135deg,#00ff80,#00e676);
  color:black;
  align-self:flex-end;
}
.other{
  background:linear-gradient(135deg,#333,#111);
  color:white;
}
.msg img{
  border-radius:15px;
  max-width:220px;
  margin-top:5px;
  transition:0.3s;
}
.msg img:hover{transform:scale(1.05);}
.msg small{
  font-size:10px;
  color:#ccc;
  display:block;
  margin-top:5px;
}

/* ==================== FOOTER ==================== */
.footer{
  display:flex;
  gap:10px;
  padding:12px;
  border-top:2px solid currentColor;
  border-radius:0 0 30px 0;
  align-items:center;
}
.footer input{
  flex:1;
  padding:14px 16px;
  border-radius:25px;
  border:none;
  background:#222;
  color:white;
  outline:none;
  font-size:14px;
  transition:0.3s;
  box-shadow:0 2px 8px rgba(0,255,118,0.2);
}
body.light .footer input{background:#eee; color:#111;}
.footer input:focus{background:#333; box-shadow:0 0 8px #00ff80;}
body.light .footer input:focus{background:#ccc; box-shadow:0 0 8px #00aaff;}

.footer button{
  padding:14px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#00ff80,#00e676);
  color:black;
  cursor:pointer;
  font-size:18px;
  box-shadow:0 3px 12px rgba(0,255,118,0.4);
  transition:0.3s;
}
.footer button:hover{
  transform:scale(1.3);
  box-shadow:0 6px 20px rgba(0,255,118,0.6);
}

/* ==================== VOICE ==================== */
#voiceControls{
  display:flex;
  align-items:center;
  gap:10px;
}
#recordBtn{
  padding:10px 18px;
  border-radius:50px;
  border:none;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,#ff4081,#f50057);
  color:white;
  transition:0.3s;
  box-shadow:0 2px 10px rgba(255,82,82,0.4);
}
#recordBtn.recording{
  background:linear-gradient(135deg,#ff5252,#ff1744);
  animation:pulse 1s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 5px #ff5252;}
  50%{box-shadow:0 0 20px #ff1744;}
  100%{box-shadow:0 0 5px #ff5252;}
}

/* ==================== WAVEFORM ==================== */
.waveform-container{
  width:100%;
  height:50px;
  border-radius:15px;
  overflow:hidden;
  margin-top:5px;
  box-shadow:0 0 10px rgba(0,255,118,0.4);
  cursor:pointer;
  transition:0.3s;
}
.waveform-container:hover{box-shadow:0 0 20px rgba(0,255,118,0.6);}

/* ==================== TYPING ==================== */
.typing{
  font-size:13px;
  font-weight:bold;
  color:#00ff80;
  margin-left:5px;
  font-style:italic;
  animation:blink 1s infinite;
}
@keyframes blink{
  0%,100%{opacity:1;}
  50%{opacity:0.3;}
}
#themeToggle{
  margin:10px;
  padding:10px 18px;
  border-radius:25px;
  border:none;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,#00ff80,#00e676);
  box-shadow:0 3px 12px rgba(0,255,118,0.3);
  transition:0.3s;
}
#themeToggle:hover{
  transform:scale(1.1);
  box-shadow:0 6px 20px rgba(0,255,118,0.5);
}

/* ==================== CALL BOX ==================== */
#callBox{
  display:none;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.9);
  padding:20px;
  border-radius:20px;
  color:white;
  z-index:999;
  width:300px;
  text-align:center;
}
#callBox button{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:15px;
  cursor:pointer;
}
</style>
</head>
<body class="dark">

<div class="app">
<!-- Login -->
<div id="loginBox">
  <div style="font-size:38px;font-weight:bold;color:#00ff80;text-shadow:0 0 20px #00ff80;">ALLO</div>
  <input id="usernameInput" placeholder="نام کاربری">
  <input id="passwordInput" type="password" placeholder="رمز عبور">
  <input id="userIDInput" placeholder="شناسه یکتا (مثلاً: user123)">
  <button onclick="registerUser()">ثبت نام</button>
  <button onclick="loginUser()">ورود</button>
  <button id="themeToggle" onclick="toggleTheme()">تغییر تم 🌗</button>
</div>

<!-- Chat -->
<div id="chatBox">
  <div id="onlineList">
    <h3>آنلاین‌ها</h3>
    <div id="users"></div>
  </div>
  <div id="chatArea">
    <div id="userID"></div>
    <div id="messages"></div>
    <div class="typing" id="typingInfo"></div>
    <div class="footer">
      <input id="msgInput" placeholder="پیام...">
      <button onclick="sendMessage()">💬</button>
      <input type="file" id="imgInput" style="display:none;" accept="image/*">
      <button onclick="document.getElementById('imgInput').click()">📸</button>
      <div id="voiceControls">
        <button id="recordBtn" onclick="toggleRecording()">🎤</button>
        <span id="recTimer">00:00</span>
      </div>
      <button onclick="startCall()">📞 تماس صوتی</button>
      <button onclick="toggleTheme()">🌗</button>
    </div>
    <button onclick="logout()" style="margin:10px;background:#ff5252;border-radius:25px;padding:10px;font-weight:bold;cursor:pointer;">خروج</button>
  </div>
</div>

<!-- Call Box -->
<div id="callBox">
  <div id="callStatus">در انتظار تماس...</div>
  <div id="callActions" style="margin-top:10px; display:none;">
    <button onclick="acceptCall()" style="background:#4caf50;">✅ قبول</button>
    <button onclick="rejectCall()" style="background:#f44336;">❌ رد</button>
  </div>
  <button id="endCallBtn" onclick="endCall()" style="display:none;">قطع تماس</button>
</div>

<audio id="ringTone" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_ringtones.ogg" loop></audio>

<script>
// ==================== Firebase ====================
const firebaseConfig = {
  apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
  authDomain: "alloo-web.firebaseapp.com",
  projectId: "alloo-web",
  storageBucket: "alloo-web.firebasestorage.app",
  messagingSenderId: "132232824762",
  appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ==================== Global ====================
let me="", activeUser="", recorder=null, recChunks=[], recInterval=null, recSeconds=0;
let typingTimeout;
let localStream=null, remoteStream=null, peerConnection=null;
const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
const ringTone = document.getElementById("ringTone");

// ==================== Theme ====================
function toggleTheme(){
  document.body.classList.toggle('light');
  document.body.classList.toggle('dark');
  localStorage.setItem("allo_theme", document.body.classList.contains('dark')?"dark":"light");
}

// ==================== Register & Login ====================
function registerUser(){
  let u=document.getElementById("usernameInput").value.trim();
  let p=document.getElementById("passwordInput").value.trim();
  let id=document.getElementById("userIDInput").value.trim();
  if(!u||!p||!id) return alert("تمام فیلدها لازم است");
  db.collection("users").doc(id).get().then(doc=>{
    if(doc.exists) return alert("این شناسه یکتا قبلاً استفاده شده");
    db.collection("users").doc(id).set({username:u,password:p,online:true});
    me=id; 
    localStorage.setItem("allo_user",me); 
    document.getElementById("userID").innerText="کد شما: "+me; 
    startApp();
  });
}

function loginUser(){
  let u=document.getElementById("userIDInput").value.trim();
  let p=document.getElementById("passwordInput").value.trim();
  if(!u||!p) return alert("تمام فیلدها لازم است");
  db.collection("users").doc(u).get().then(doc=>{
    if(!doc.exists) return alert("کاربر وجود ندارد");
    if(doc.data().password!==p) return alert("رمز اشتباه است");
    me=u; localStorage.setItem("allo_user",me);
    db.collection("users").doc(me).update({online:true});
    document.getElementById("userID").innerText="کد شما: "+me;
    startApp();
  });
}

// ==================== Start App ====================
function startApp(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("chatBox").style.display="flex";
  loadUsers(); loadMessages();
}

// ==================== Users ====================
function loadUsers(){
  db.collection("users").onSnapshot(snap=>{
    const usersDiv=document.getElementById("users"); usersDiv.innerHTML="";
    snap.forEach(doc=>{
      if(doc.id===me) return;
      let div=document.createElement("div");
      div.className="user";
      div.innerHTML=`<span>${doc.data().username} (${doc.id})</span><span>${doc.data().online?"✅ آنلاین":"❌ آفلاین"}</span>`;
      div.onclick=()=>{ activeUser=doc.id; loadMessages(); };
      usersDiv.appendChild(div);
    });
  });
}

// ==================== Messages ====================
function loadMessages(){
  if(!activeUser) return;
  db.collection("messages").orderBy("time").onSnapshot(snap=>{
    const msgDiv = document.getElementById("messages");
    msgDiv.innerHTML = "";
    snap.forEach(doc=>{
      let m = doc.data();
      if(!((m.from===me && m.to===activeUser) || (m.from===activeUser && m.to===me))) return;
      let div = document.createElement("div");
      div.className = "msg " + (m.from===me ? "me" : "other");
      if(m.text) div.innerText = m.text;
      if(m.audio){
        let audioElem = document.createElement("audio");
        audioElem.src = m.audio;
        audioElem.controls=true;
        div.appendChild(audioElem);
      }
      msgDiv.appendChild(div);
    });
    msgDiv.scrollTop = msgDiv.scrollHeight;
  });
}

// ==================== Send Message ====================
function sendMessage(){
  let text = document.getElementById("msgInput").value.trim();
  if(!text || !activeUser) return;
  db.collection("messages").add({
    from: me,
    to: activeUser,
    text: text,
    time: Date.now()
  });
  document.getElementById("msgInput").value="";
}

// ==================== Logout ====================
function logout(){
  if(me) db.collection("users").doc(me).update({online:false});
  localStorage.removeItem("allo_user");
  location.reload();
}

// ==================== Voice Recording ====================
async function toggleRecording(){
  if(recorder){
    recorder.stop();
  } else {
    let stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recorder = new MediaRecorder(stream);
    recChunks=[];
    recorder.ondataavailable=e=>recChunks.push(e.data);
    recorder.onstop=()=>{
      let blob = new Blob(recChunks,{type:"audio/webm"});
      let url = URL.createObjectURL(blob);
      db.collection("messages").add({from:me,to:activeUser,audio:url,time:Date.now()});
      recorder=null; recChunks=[];
      clearInterval(recInterval); recInterval=null; recSeconds=0; document.getElementById("recTimer").innerText="00:00";
    };
    recorder.start();
    recInterval = setInterval(()=>{
      recSeconds++;
      let min = Math.floor(recSeconds/60).toString().padStart(2,"0");
      let sec = (recSeconds%60).toString().padStart(2,"0");
      document.getElementById("recTimer").innerText = min+":"+sec;
    },1000);
  }
}

// ==================== WebRTC Call (همانطور که در پیام قبل) ====================
async function startCall(){
  if(!activeUser) return alert("ابتدا کاربر را انتخاب کنید");
  showCallBox("در حال تماس با " + activeUser, false);

  localStream = await navigator.mediaDevices.getUserMedia({audio:true});
  remoteStream = new MediaStream();
  const audioEl = document.createElement("audio"); audioEl.autoplay=true; audioEl.srcObject=remoteStream; document.body.appendChild(audioEl);

  peerConnection = new RTCPeerConnection(config);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  peerConnection.ontrack = e => { e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t)); };
  peerConnection.onicecandidate = e => { if(e.candidate) db.collection("calls").doc(activeUser).set({from:me,candidate:e.candidate},{merge:true}); };

  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  await db.collection("calls").doc(activeUser).set({from:me, offer:offer, to:activeUser},{merge:true});

  db.collection("calls").doc(me).onSnapshot(async snap=>{
    if(!snap.exists) return;
    const data = snap.data();
    if(data.answer && !peerConnection.currentRemoteDescription){
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      showCallBox("تماس برقرار شد ✅", true);
    }
    if(data.candidate){ try{ await peerConnection.addIceCandidate(data.candidate); }catch(e){console.log(e);} }
  });
}

db.collection("calls").where("to", "==", me)
.onSnapshot(snapshot=>{
  snapshot.docChanges().forEach(async change=>{
    if(change.type==="added"){
      const call = change.doc.data();
      if(call.offer && !peerConnection){
        showCallBox("تماس ورودی از " + call.from, false, true);
        ringTone.play();

        localStream = await navigator.mediaDevices.getUserMedia({audio:true});
        remoteStream = new MediaStream();
        const audioEl = document.createElement("audio"); audioEl.autoplay=true; audioEl.srcObject=remoteStream; document.body.appendChild(audioEl);

        peerConnection = new RTCPeerConnection(config);
        localStream.getTracks().forEach(track=>peerConnection.addTrack(track,localStream));
        peerConnection.ontrack = e=>{ e.streams[0].getTracks().forEach(t=>remoteStream.addTrack(t)); };
        peerConnection.onicecandidate = e=>{
          if(e.candidate) db.collection("calls").doc(call.from).set({candidate:e.candidate},{merge:true});
        };
        peerConnection.pendingCall = call;
      }
    }
  });
});

async function acceptCall(){
  const call = peerConnection.pendingCall;
  if(!call) return;

  await peerConnection.setRemoteDescription(new RTCSessionDescription(call.offer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  await db.collection("calls").doc(call.from).set({answer:answer},{merge:true});

  showCallBox("تماس برقرار شد ✅", true);
  ringTone.pause();
}

function rejectCall(){
  if(peerConnection && peerConnection.pendingCall){
    db.collection("calls").doc(peerConnection.pendingCall.from).delete().catch(()=>{});
    peerConnection.close(); peerConnection=null;
  }
  ringTone.pause();
  hideCallBox();
}

async function endCall(){
  if(peerConnection) peerConnection.close(); peerConnection=null;
  if(localStream) localStream.getTracks().forEach(t=>t.stop()); localStream=null;
  ringTone.pause();
  hideCallBox();
  if(activeUser){
    await db.collection("calls").doc(activeUser).delete().catch(()=>{});
    await db.collection("calls").doc(me).delete().catch(()=>{});
  }
}

function showCallBox(text, inCall=false, incoming=false){
  const box = document.getElementById("callBox");
  const status = document.getElementById("callStatus");
  const actions = document.getElementById("callActions");
  const endBtn = document.getElementById("endCallBtn");
  status.innerText = text;
  box.style.display = "block";
  if(incoming){
    actions.style.display="block"; 
    endBtn.style.display="none";
  } else if(inCall){
    actions.style.display="none"; 
    endBtn.style.display="block";
  } else {
    actions.style.display="none"; 
    endBtn.style.display="none";
  }
}

function hideCallBox(){
  const box = document.getElementById("callBox");
  box.style.display="none";
  document.getElementById("callActions").style.display="none";
  document.getElementById("endCallBtn").style.display="none";
}

// ==================== Init ====================
window.onload = ()=>{
  const theme = localStorage.getItem("allo_theme");
  if(theme) document.body.className=theme;
  const storedUser = localStorage.getItem("allo_user");
  if(storedUser) { me=storedUser; startApp(); document.getElementById("userID").innerText="کد شما: "+me; }
};
</script>
</body>
</html>
