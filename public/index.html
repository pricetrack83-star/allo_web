<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLOO PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.app{
  width:400px;
  height:680px;
  border-radius:25px;
  overflow:hidden;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  box-shadow:0 20px 70px rgba(0,0,0,0.7);
  display:flex;
  flex-direction:column;
}

.header{
  padding:15px;
  text-align:center;
  font-weight:bold;
  background:linear-gradient(90deg,#00e676,#00c853);
  color:black;
}

#login,#chat{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:15px;
}

#chat{display:none;}

input{
  padding:12px;
  border-radius:15px;
  border:none;
  background:rgba(255,255,255,0.1);
  color:white;
  margin-top:10px;
}

button{
  padding:10px;
  border:none;
  border-radius:15px;
  margin-top:10px;
  background:#00e676;
  cursor:pointer;
  font-weight:bold;
}

#users{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:10px;
}

.user{
  padding:6px 12px;
  border-radius:20px;
  background:rgba(255,255,255,0.1);
  cursor:pointer;
}

.active{
  background:#00e676;
  color:black;
}

#messages{
  flex:1;
  overflow:auto;
}

.msg{
  padding:10px;
  border-radius:15px;
  margin:6px 0;
  max-width:70%;
}

.me{
  background:#00e676;
  color:black;
  align-self:flex-end;
}

.other{
  background:#333;
}

.footer{
  display:flex;
  gap:5px;
}

.footer input{flex:1;}
</style>
</head>

<body>

<div class="app">

<div class="header">ALLOO 💬</div>

<div id="login">
<input id="name" placeholder="اسم">
<button onclick="login()">ورود</button>
</div>

<div id="chat">

<div id="users"></div>

<div id="messages"></div>

<div class="footer">
<input id="msg" placeholder="پیام...">
<button onclick="send()">ارسال</button>
</div>

<button onclick="logout()">خروج</button>

</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
  authDomain: "alloo-web.firebaseapp.com",
  projectId: "alloo-web",
  storageBucket: "alloo-web.firebasestorage.app",
  messagingSenderId: "132232824762",
  appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me = "";
let activeUser = "";

// login
function login(){
  me = document.getElementById("name").value.trim();
  if(!me) return alert("اسم وارد کن");

  localStorage.setItem("allo_user", me);

  db.collection("users").doc(me).set({
    online:true
  });

  start();
}

// start app
function start(){
  document.getElementById("login").style.display="none";
  document.getElementById("chat").style.display="flex";

  loadUsers();
}

// users
function loadUsers(){
  db.collection("users").onSnapshot(snap=>{
    users.innerHTML="";

    snap.forEach(doc=>{
      if(doc.id === me) return;

      let div = document.createElement("div");
      div.className = "user";
      div.innerText = doc.id;

      div.onclick = ()=>{
        activeUser = doc.id;
        loadMessages();
      };

      users.appendChild(div);
    });
  });
}

// messages
function loadMessages(){
  db.collection("messages")
  .orderBy("time")
  .onSnapshot(snap=>{
    messages.innerHTML="";

    snap.forEach(doc=>{
      let m = doc.data();

      if(!(m.from===me && m.to===activeUser) &&
         !(m.from===activeUser && m.to===me)) return;

      let div = document.createElement("div");
      div.className = "msg " + (m.from===me ? "me" : "other");
      div.innerText = m.text;

      messages.appendChild(div);
    });

    messages.scrollTop = 99999;
  });
}

// send
function send(){
  let text = document.getElementById("msg").value.trim();
  if(!text || !activeUser) return;

  db.collection("messages").add({
    from: me,
    to: activeUser,
    text: text,
    time: Date.now()
  });

  document.getElementById("msg").value="";
}

// logout
function logout(){
  db.collection("users").doc(me).update({online:false});
  localStorage.removeItem("allo_user");
  location.reload();
}

// auto login
window.onload = ()=>{
  let saved = localStorage.getItem("allo_user");
  if(saved){
    me = saved;
    db.collection("users").doc(me).set({online:true});
    start();
  }
};
</script>

</body>
</html>
