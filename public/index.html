<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLO | Next-Gen Cyber Terminal</title> 

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;500;800;900&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root {
    --primary: #00ffcc;
    --primary-glow: rgba(0, 255, 204, 0.4);
    --secondary: #ff0055;
    --secondary-glow: rgba(255, 0, 85, 0.5);
    --accent: #bc13fe;
    --dark-bg: #030303;
    --glass: rgba(255, 255, 255, 0.03);
    --border: rgba(255, 255, 255, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

/* اسکرول‌بار سفارشی */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }

body { 
    font-family: 'Vazirmatn', sans-serif; background: var(--dark-bg); color: white;
    height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center;
}

.bg-canvas {
    position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(circle at 50% 50%, #0a111a 0%, #000 100%);
}
.particle {
    position: absolute; border-radius: 50%; background: var(--primary);
    filter: blur(80px); opacity: 0.1; animation: float 20s infinite alternate ease-in-out;
}

@keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(100px, -50px) scale(1.3); }
}

#loginScreen {
    position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    backdrop-filter: blur(40px);
}

.login-card {
    width: 420px; padding: 45px; border-radius: 35px;
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
    border: 1px solid var(--border); box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    text-align: center;
}

.brand-title {
    font-family: 'Orbitron', sans-serif; font-size: 70px; font-weight: 900;
    color: var(--primary); letter-spacing: 12px; margin-bottom: 25px;
    text-shadow: 0 0 30px var(--primary-glow);
}

.auth-mode-switch {
    display: flex; background: rgba(255,255,255,0.03); border-radius: 18px;
    margin-bottom: 30px; padding: 4px; border: 1px solid var(--border);
}
.mode-btn {
    flex: 1; padding: 12px; border-radius: 14px; cursor: pointer;
    font-weight: 800; font-size: 13px; color: #666; border: none; background: none;
}
.mode-btn.active { background: var(--primary); color: #000; box-shadow: 0 5px 15px var(--primary-glow); }

.input-container input {
    width: 100%; padding: 20px; border-radius: 18px; margin-bottom: 15px;
    background: rgba(0,0,0,0.4); border: 1px solid var(--border);
    color: #fff; font-size: 14px; outline: none; text-align: center;
}
.input-container input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 255, 204, 0.15); }

.action-btn {
    width: 100%; padding: 20px; border-radius: 18px; border: none;
    background: linear-gradient(90deg, var(--primary), #00d2ff);
    color: #000; font-weight: 900; cursor: pointer; box-shadow: 0 10px 25px var(--primary-glow);
}

/* --- ساختار اپلیکیشن ارتقا یافته --- */
.app-frame {
    width: 96vw; height: 92vh; display: flex;
    background: rgba(5, 5, 5, 0.4); border: 1px solid var(--border);
    border-radius: 40px; backdrop-filter: blur(60px); overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,0.8);
}

.sidebar { width: 340px; border-left: 1px solid var(--border); display: flex; flex-direction: column; background: rgba(255,255,255,0.015); }

.user-item {
    padding: 18px 22px; margin: 8px 15px; border-radius: 20px;
    display: flex; align-items: center; gap: 15px; cursor: pointer;
    border: 1px solid transparent; position: relative;
}
.user-item:hover { background: rgba(255,255,255,0.04); border-color: var(--border); transform: translateX(-5px); }
.user-item.active { background: rgba(0, 255, 204, 0.08); border-color: rgba(0, 255, 204, 0.2); }

.unread-badge {
    position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
    background: var(--secondary); color: white; min-width: 22px; height: 22px;
    border-radius: 11px; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 900; font-family: 'Orbitron';
    box-shadow: 0 0 15px var(--secondary-glow);
}

.avatar-hex {
    width: 48px; height: 48px; background: #000; border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron'; font-weight: 900; color: var(--primary);
    border: 1px solid var(--border); position: relative;
}

.is-online .online-glow { display: block; position: absolute; bottom: -2px; right: -2px; width: 12px; height: 12px; background: var(--primary); border: 2px solid #000; border-radius: 50%; box-shadow: 0 0 10px var(--primary); }

/* --- فضای چت --- */
.chat-window { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at 10% 10%, rgba(0,255,204,0.02), transparent); }
.chat-header { padding: 20px 35px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

#messages { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
.bubble {
    padding: 14px 20px; border-radius: 22px; max-width: 70%; font-size: 13.5px;
    animation: slideIn 0.3s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.bubble.me { align-self: flex-end; background: var(--primary); color: #000; font-weight: 600; border-bottom-right-radius: 4px; box-shadow: 0 5px 20px var(--primary-glow); }
.bubble.other { align-self: flex-start; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: #fff; }

.input-area {
    padding: 20px 35px; display: flex; flex-direction: column; gap: 12px; 
    background: rgba(0,0,0,0.3); border-top: 1px solid var(--border);
}

#callUI {
    position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 20000;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    backdrop-filter: blur(100px);
}
</style>
</head>
<body>

<div class="bg-canvas">
    <div class="particle" style="width:400px; height:400px; top:10%; left:10%;"></div>
    <div class="particle" style="width:500px; height:500px; bottom:10%; right:10%; background:var(--accent);"></div>
</div>

<div id="loginScreen">
    <div class="brand-title">ALLO</div>
    <div class="login-card">
        <div class="auth-mode-switch">
            <button id="btnL" class="mode-btn active" onclick="setAuthMode('login')">ورود</button>
            <button id="btnR" class="mode-btn" onclick="setAuthMode('register')">ثبت‌نام</button>
        </div>
        <div class="input-container">
            <input id="uID" placeholder="USERNAME ID" autocomplete="off">
            <input id="uPass" type="password" placeholder="ACCESS KEY">
        </div>
        <button class="action-btn" onclick="handleAuth()">INITIALIZE SESSION</button>
    </div>
</div>

<div class="app-frame">
    <div class="sidebar">
        <div style="padding:35px; border-bottom:1px solid var(--border);">
            <h1 style="font-family:'Orbitron'; color:var(--primary); font-size:24px; letter-spacing:5px;">ALLO</h1>
        </div>
        <div id="userList" style="flex:1; overflow-y:auto; padding-top:10px;"></div>
        <div style="padding:20px; background:rgba(0,0,0,0.2); border-top:1px solid var(--border);">
            <div id="myIDDisplay" style="font-family:'Orbitron'; font-size:9px; color:var(--primary); margin-bottom:12px; opacity:0.6;">NODE: ...</div>
            <button onclick="logout()" class="logout-btn">LOGOUT ✕</button>
        </div>
    </div>

    <div class="chat-window">
        <div class="chat-header">
            <div style="display:flex; align-items:center; gap:15px;">
                <div id="hAvatar" style="width:45px; height:45px; background:var(--glass); border:1px solid var(--border); border-radius:14px; display:flex; align-items:center; justify-content:center; font-family:'Orbitron'; font-weight:900; color:var(--primary);">?</div>
                <h3 id="targetName" style="font-weight:400; letter-spacing:1px; font-size:16px; opacity:0.8;">Terminal Ready</h3>
            </div>
            <button onclick="startCall()" style="background:var(--primary); color:#000; border:none; padding:10px 25px; border-radius:12px; font-weight:900; cursor:pointer; font-family:'Orbitron'; font-size:11px;">CALL</button>
        </div>

        <div id="messages"></div>

        <div class="input-area">
            <div id="recIndicator" style="display:none; font-family:'Orbitron'; font-size:10px; color:var(--secondary); letter-spacing:2px; animation: blink 1s infinite;">🔴 RECORDING DATA...</div>
            <div style="display:flex; gap:12px;">
                <input id="msgInput" placeholder="Secure transmission..." onkeypress="if(event.key=='Enter') sendMsg()">
                <button id="vBtn" onclick="toggleVoice()" class="icon-btn" style="border:1px solid var(--secondary); color:var(--secondary); background:none;">🎤</button>
                <button onclick="sendMsg()" class="icon-btn" style="background:var(--primary); color:#000;">✈</button>
            </div>
        </div>
    </div>
</div>

<div id="callUI">
    <button class="min-btn" id="minBtn" onclick="toggleCallView()" style="position:absolute; top:40px; right:40px; background:none; border:1px solid var(--border); color:#fff; padding:10px; border-radius:10px; cursor:pointer;">MINIMIZE</button>
    <div class="call-avatar-large" id="cAvatar">👤</div>
    <h2 id="cName" style="font-family:'Orbitron'; font-size:40px; margin-bottom:10px;">USER</h2>
    <p id="cStatus" style="color:var(--primary); letter-spacing:5px; font-size:10px;">CONNECTING...</p>
    <div style="display:flex; gap:30px; margin-top:40px;">
        <button id="acceptBtn" onclick="answerCall()" style="width:80px; height:80px; border-radius:30px; background:#2ecc71; border:none; font-size:30px; cursor:pointer;">✅</button>
        <button id="muteBtn" onclick="toggleMute()" style="width:80px; height:80px; border-radius:30px; background:rgba(255,255,255,0.1); border:1px solid var(--border); font-size:30px; cursor:pointer; display:none;">🎙️</button>
        <button onclick="hangup()" style="width:80px; height:80px; border-radius:30px; background:var(--secondary); border:none; font-size:30px; cursor:pointer;">❌</button>
    </div>
</div>

<audio id="ring" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_ringtones.ogg" loop></audio>
<audio id="remoteAudio" autoplay></audio>

<script>
// --- تنظیمات فایربیس (ثابت) ---
const firebaseConfig = {
    apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
    authDomain: "alloo-web.firebaseapp.com",
    projectId: "alloo-web",
    storageBucket: "alloo-web.appspot.com",
    messagingSenderId: "132232824762",
    appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me = localStorage.getItem("alloo_uid");
let activeTarget = "";
let unreadCounts = {};

if(me) { document.getElementById("loginScreen").style.display = "none"; initApp(); }

// --- توابع کمکی ---
function setAuthMode(m) {
    authMode = m;
    document.getElementById('btnL').className = `mode-btn ${m==='login'?'active':''}`;
    document.getElementById('btnR').className = `mode-btn ${m==='register'?'active':''}`;
}

async function handleAuth() {
    const id = document.getElementById("uID").value.trim().toLowerCase();
    const ps = document.getElementById("uPass").value.trim();
    if(!id || !ps) return;
    const userRef = db.collection("users").doc(id);
    const doc = await userRef.get();
    if(authMode === 'register') {
        if(doc.exists) return alert("آی‌دی رزرو شده است.");
        await userRef.set({ pass: ps, online: true, lastSeen: Date.now() });
    } else {
        if(!doc.exists || doc.data().pass !== ps) return alert("اطلاعات ورود نادرست است.");
        await userRef.update({ online: true, lastSeen: Date.now() });
    }
    localStorage.setItem("alloo_uid", id);
    location.reload();
}

function initApp() {
    document.getElementById("myIDDisplay").innerText = "NODE: " + me.toUpperCase();
    db.collection("users").doc(me).update({ online: true, lastSeen: Date.now() });
    
    // گوش دادن به تغییرات پیام‌ها برای شمارش نخوانده‌ها
    db.collection("messages").onSnapshot(snap => {
        unreadCounts = {};
        snap.forEach(doc => {
            const d = doc.data();
            if(d.t === me && d.read === false) {
                unreadCounts[d.f] = (unreadCounts[d.f] || 0) + 1;
            }
        });
        updateUserList();
    });

    db.collection("users").onSnapshot(snap => {
        window.allUsers = snap;
        updateUserList();
    });
    listenForCalls();
}

function updateUserList() {
    if(!window.allUsers) return;
    const list = document.getElementById("userList");
    list.innerHTML = "";
    window.allUsers.forEach(doc => {
        if(doc.id === me) return;
        const d = doc.data();
        const isOnline = d.online && (Date.now() - d.lastSeen < 60000);
        const unread = unreadCounts[doc.id] || 0;

        const item = document.createElement("div");
        item.className = `user-item ${activeTarget === doc.id ? 'active' : ''} ${isOnline ? 'is-online' : ''}`;
        item.innerHTML = `
            <div class="avatar-hex">${doc.id[0].toUpperCase()}<div class="online-glow"></div></div>
            <div style="flex:1">
                <div style="font-weight:800; font-size:14px; color:#fff;">${doc.id}</div>
                <div style="font-size:8px; color:var(--primary); font-weight:700;">${isOnline ? 'ONLINE' : 'OFFLINE'}</div>
            </div>
            ${unread > 0 ? `<div class="unread-badge">${unread}</div>` : ''}
        `;
        item.onclick = () => { activeTarget = doc.id; markAsRead(doc.id); selectUser(); };
        list.appendChild(item);
    });
}

async function markAsRead(targetID) {
    const batch = db.batch();
    const msgs = await db.collection("messages").where("f", "==", targetID).where("t", "==", me).where("read", "==", false).get();
    msgs.forEach(doc => batch.update(doc.ref, { read: true }));
    await batch.commit();
}

function selectUser() {
    document.getElementById("targetName").innerText = activeTarget.toUpperCase();
    document.getElementById("hAvatar").innerText = activeTarget[0].toUpperCase();
    loadMessages();
}

function loadMessages() {
    db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
        const box = document.getElementById("messages");
        box.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            if((d.f==me && d.t==activeTarget) || (d.f==activeTarget && d.t==me)) {
                const m = document.createElement("div");
                m.className = `bubble ${d.f==me ? 'me' : 'other'}`;
                if(d.audio) m.innerHTML = `<audio src="${d.audio}" controls style="filter:invert(1); height:30px;"></audio>`;
                else m.innerText = d.txt;
                box.appendChild(m);
            }
        });
        box.scrollTop = box.scrollHeight;
    });
}

function sendMsg() {
    const i = document.getElementById("msgInput");
    if(!i.value || !activeTarget) return;
    db.collection("messages").add({ f: me, t: activeTarget, txt: i.value, time: Date.now(), read: false });
    i.value = "";
}

// کدهای تماس و ویس (بدون تغییر منطق)
const rtcConfig = { iceServers: [{ urls: ["stun:stun.l.google.com:19302"] }] };
let pc; let localStream;

async function startCall() {
    if(!activeTarget) return;
    document.getElementById("callUI").style.display = "flex";
    document.getElementById("cName").innerText = activeTarget.toUpperCase();
    pc = new RTCPeerConnection(rtcConfig);
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await db.collection("calls").doc(activeTarget).set({ offer, from: me });
}

function hangup() {
    const target = activeTarget || (window.incoming ? window.incoming.from : null);
    if(target) db.collection("messages").add({ f: me, t: target, txt: "📞 تماس پایان یافت", time: Date.now(), read: false });
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    if(pc) pc.close();
    db.collection("calls").doc(me).delete();
    document.getElementById("callUI").style.display = "none";
}

let rec; let chunks = [];
async function toggleVoice() {
    const v = document.getElementById("vBtn");
    const indicator = document.getElementById("recIndicator");
    if(!rec || rec.state === 'inactive') {
        const s = await navigator.mediaDevices.getUserMedia({ audio: true });
        rec = new MediaRecorder(s); chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
            const b = new Blob(chunks, { type: 'audio/webm' });
            const r = new FileReader(); r.readAsDataURL(b);
            r.onloadend = () => db.collection("messages").add({ f: me, t: activeTarget, audio: r.result, time: Date.now(), read: false });
            v.style.background = "none"; indicator.style.display = "none";
        };
        rec.start(); v.style.background = "var(--secondary)"; indicator.style.display = "block";
    } else { rec.stop(); }
}

function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
