<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLO | Ultimate Cyber Terminal</title> 

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;500;800;900&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.4);
            --secondary: #ff0055;
            --secondary-glow: rgba(255, 0, 85, 0.5);
            --accent: #bc13fe;
            --dark-bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.25s ease; }

        body { 
            font-family: 'Vazirmatn', sans-serif; background: var(--dark-bg); color: white;
            height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }

        /* --- Scrollbar Customization --- */
        #messages::-webkit-scrollbar, #userList::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-thumb, #userList::-webkit-scrollbar-thumb { 
            background: var(--primary); border-radius: 10px; box-shadow: 0 0 10px var(--primary-glow); 
        }

        /* --- Animated Background --- */
        .bg-canvas { position: fixed; inset: 0; z-index: -1; background: #000; overflow: hidden; }
        .particle {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.12; 
            animation: float 20s infinite alternate ease-in-out;
        }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(100px, -50px) scale(1.3); } }

        /* --- Auth Screen --- */
        #loginScreen {
            position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(20px);
        }
        .login-card {
            width: 400px; padding: 40px; border-radius: 30px; background: var(--glass);
            border: 1px solid var(--border); box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: center;
        }
        .brand-title {
            font-family: 'Orbitron', sans-serif; font-size: 60px; font-weight: 900;
            color: var(--primary); letter-spacing: 10px; margin-bottom: 30px; text-shadow: 0 0 30px var(--primary-glow);
        }

        /* --- App Interface --- */
        .app-frame {
            width: 95vw; height: 90vh; display: flex; background: rgba(10, 10, 10, 0.6);
            border: 1px solid var(--border); border-radius: 40px; backdrop-filter: blur(40px); overflow: hidden;
        }

        .sidebar { width: 320px; border-left: 1px solid var(--border); display: flex; flex-direction: column; background: rgba(0,0,0,0.2); }

        .user-item {
            padding: 15px 20px; margin: 8px 12px; border-radius: 20px;
            display: flex; align-items: center; gap: 12px; cursor: pointer; position: relative;
        }
        .user-item:hover { background: rgba(255,255,255,0.05); }
        .user-item.active { background: rgba(0, 255, 204, 0.1); border: 1px solid rgba(0, 255, 204, 0.2); }

        .unread-badge {
            background: var(--secondary); color: white; font-size: 10px; padding: 2px 8px;
            border-radius: 10px; box-shadow: 0 0 10px var(--secondary-glow); animation: pulse 1.5s infinite;
        }

        .avatar-hex {
            width: 45px; height: 45px; background: #111; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; font-family: 'Orbitron';
            color: var(--primary); border: 1px solid var(--border); position: relative;
        }

        .online-glow {
            position: absolute; top: -2px; right: -2px; width: 12px; height: 12px;
            background: var(--primary); border-radius: 50%; border: 2px solid #000; display: none;
        }
        .is-online .online-glow { display: block; box-shadow: 0 0 10px var(--primary); }

        /* --- Chat Area --- */
        .chat-window { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at top right, rgba(0,255,204,0.02), transparent); }
        #messages { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

        .bubble {
            padding: 14px 20px; border-radius: 20px; max-width: 70%; font-size: 14px; line-height: 1.6;
            animation: msgFade 0.3s ease-out;
        }
        @keyframes msgFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .bubble.me { align-self: flex-end; background: var(--primary); color: #000; font-weight: 600; border-bottom-right-radius: 2px; }
        .bubble.other { align-self: flex-start; background: rgba(255,255,255,0.07); border: 1px solid var(--border); border-bottom-left-radius: 2px; }

        /* --- Call UI --- */
        #callUI {
            position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 20000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #callUI.minimized {
            width: 300px; height: 100px; inset: auto 20px 20px auto; border-radius: 25px;
            flex-direction: row; padding: 20px; border: 1px solid var(--primary);
        }
        #callUI.minimized .call-avatar-large, #callUI.minimized #cStatus { display: none; }
        #callUI.minimized #cName { font-size: 16px; margin: 0 15px; }

        /* Helpers */
        .auth-mode-switch { display: flex; gap: 10px; margin-bottom: 20px; background: #000; padding: 5px; border-radius: 15px; }
        .mode-btn { flex: 1; padding: 10px; border-radius: 10px; cursor: pointer; background: none; border: none; color: #555; font-weight: bold; }
        .mode-btn.active { background: var(--primary); color: #000; }
        .input-container input { width: 100%; padding: 15px; border-radius: 12px; background: #000; border: 1px solid var(--border); color: #fff; margin-bottom: 15px; text-align: center; }
        .action-btn { width: 100%; padding: 15px; border-radius: 12px; background: var(--primary); border: none; font-weight: 900; cursor: pointer; }
        .icon-btn { width: 50px; height: 50px; border-radius: 15px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="bg-canvas">
    <div class="particle" style="width:400px; height:400px; top:-10%; left:-10%; background:var(--primary);"></div>
    <div class="particle" style="width:500px; height:500px; bottom:-10%; right:-10%; background:var(--accent);"></div>
</div>

<div id="loginScreen">
    <div class="brand-title">ALLO</div>
    <div class="login-card">
        <div class="auth-mode-switch">
            <button id="btnL" class="mode-btn active" onclick="setAuthMode('login')">ورود</button>
            <button id="btnR" class="mode-btn" onclick="setAuthMode('register')">ثبت‌نام</button>
        </div>
        <div class="input-container"><input id="uID" placeholder="USERNAME ID" autocomplete="off"></div>
        <div class="input-container"><input id="uPass" type="password" placeholder="ACCESS KEY"></div>
        <button class="action-btn" onclick="handleAuth()">INITIALIZE</button>
    </div>
</div>

<div class="app-frame">
    <div class="sidebar">
        <div style="padding:30px; border-bottom:1px solid var(--border);">
            <h2 style="font-family:'Orbitron'; color:var(--primary); letter-spacing:4px;">ALLO</h2>
        </div>
        <div id="userList" style="flex:1; overflow-y:auto; padding-top:10px;"></div>
        <div style="padding:20px; background:rgba(0,0,0,0.3);">
            <div id="myIDDisplay" style="font-size:10px; color:var(--primary); margin-bottom:10px; opacity:0.6;">NODE: ...</div>
            <button onclick="logout()" style="width:100%; padding:10px; border-radius:10px; background:rgba(255,0,85,0.1); color:var(--secondary); border:1px solid var(--secondary); cursor:pointer; font-weight:bold;">LOGOUT</button>
        </div>
    </div>

    <div class="chat-window">
        <div style="padding:20px 30px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
            <div style="display:flex; align-items:center; gap:15px;">
                <div id="hAvatar" class="avatar-hex">?</div>
                <h3 id="targetName" style="font-weight:300;">Select a Node</h3>
            </div>
            <button onclick="startCall()" style="background:var(--primary); padding:10px 25px; border-radius:12px; border:none; font-weight:900; cursor:pointer;">CALL</button>
        </div>

        <div id="messages"></div>

        <div style="padding:20px 30px; display:flex; gap:10px; background:rgba(0,0,0,0.1);">
            <input id="msgInput" placeholder="Write a secure message..." style="flex:1; padding:15px; border-radius:15px; border:1px solid var(--border); background:#000; color:#fff; outline:none;" onkeypress="if(event.key=='Enter') sendMsg()">
            <button id="vBtn" onclick="toggleVoice()" class="icon-btn" style="background:none; border:1px solid var(--secondary); color:var(--secondary);">🎤</button>
            <button onclick="sendMsg()" class="icon-btn" style="background:var(--primary); color:#000;">✈</button>
        </div>
    </div>
</div>

<div id="callUI">
    <button onclick="toggleCallView()" style="position:absolute; top:30px; right:30px; background:none; border:1px solid #fff; color:#fff; padding:5px 15px; border-radius:10px; cursor:pointer;">MINIMIZE</button>
    <div class="call-avatar-large" id="cAvatar" style="width:150px; height:150px; background:var(--primary); border-radius:50px; font-size:60px; display:flex; align-items:center; justify-content:center; color:#000; margin-bottom:20px;">👤</div>
    <h2 id="cName" style="font-family:'Orbitron'; font-size:40px;">USER</h2>
    <p id="cStatus" style="color:var(--primary); letter-spacing:5px;">CONNECTING...</p>
    <div style="display:flex; gap:30px; margin-top:40px;">
        <button id="acceptBtn" onclick="answerCall()" style="width:80px; height:80px; border-radius:50%; background:#2ecc71; border:none; font-size:30px; cursor:pointer;">✅</button>
        <button id="muteBtn" onclick="toggleMute()" style="width:80px; height:80px; border-radius:50%; background:rgba(255,255,255,0.1); border:1px solid var(--border); font-size:30px; cursor:pointer; display:none;">🎙️</button>
        <button onclick="hangup()" style="width:80px; height:80px; border-radius:50%; background:var(--secondary); border:none; font-size:30px; cursor:pointer;">❌</button>
    </div>
</div>

<audio id="ring" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_ringtones.ogg" loop></audio>
<audio id="remoteAudio" autoplay></audio>

<script>
// --- Firebase Config ---
const firebaseConfig = {
    apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
    authDomain: "alloo-web.firebaseapp.com",
    projectId: "alloo-web",
    storageBucket: "alloo-web.appspot.com",
    messagingSenderId: "132232824762",
    appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me = localStorage.getItem("alloo_uid");
let activeTarget = "";
let authMode = 'login';
let unreadCounts = {};
let pc; let localStream; let isMuted = false;

if(me) { document.getElementById("loginScreen").style.display = "none"; initApp(); }

function setAuthMode(m) {
    authMode = m;
    document.getElementById('btnL').className = `mode-btn ${m==='login'?'active':''}`;
    document.getElementById('btnR').className = `mode-btn ${m==='register'?'active':''}`;
}

async function handleAuth() {
    const id = document.getElementById("uID").value.trim().toLowerCase();
    const ps = document.getElementById("uPass").value.trim();
    if(!id || !ps) return;
    const userRef = db.collection("users").doc(id);
    const doc = await userRef.get();
    if(authMode === 'register') {
        if(doc.exists) return alert("ID Already Reserved");
        await userRef.set({ pass: ps, online: true, lastSeen: Date.now() });
    } else {
        if(!doc.exists || doc.data().pass !== ps) return alert("Invalid Credentials");
        await userRef.update({ online: true, lastSeen: Date.now() });
    }
    localStorage.setItem("alloo_uid", id);
    location.reload();
}

function initApp() {
    document.getElementById("myIDDisplay").innerText = "NODE: " + me.toUpperCase();
    db.collection("users").doc(me).update({ online: true, lastSeen: Date.now() });
    setInterval(() => db.collection("users").doc(me).update({ lastSeen: Date.now(), online: true }), 20000);

    // Unread Tracker
    db.collection("messages").where("t", "==", me).onSnapshot(snap => {
        snap.docChanges().forEach(change => {
            if (change.type === "added") {
                const m = change.doc.data();
                if (m.f !== activeTarget) {
                    unreadCounts[m.f] = (unreadCounts[m.f] || 0) + 1;
                    renderUserList();
                }
            }
        });
    });

    db.collection("users").onSnapshot(() => renderUserList());
    listenForCalls();
}

async function renderUserList() {
    const snap = await db.collection("users").get();
    const list = document.getElementById("userList");
    list.innerHTML = "";
    snap.forEach(doc => {
        if(doc.id === me) return;
        const d = doc.data();
        const isOnline = d.online && (Date.now() - d.lastSeen < 60000);
        const unread = unreadCounts[doc.id] || 0;
        
        const item = document.createElement("div");
        item.className = `user-item ${activeTarget === doc.id ? 'active' : ''} ${isOnline ? 'is-online' : ''}`;
        item.innerHTML = `
            <div class="avatar-hex">${doc.id[0].toUpperCase()}<div class="online-glow"></div></div>
            <div style="flex:1">
                <div style="font-weight:800; font-size:14px;">${doc.id}</div>
                <div style="font-size:9px; color:var(--primary);">${isOnline?'ONLINE':'OFFLINE'}</div>
            </div>
            ${unread > 0 ? `<div class="unread-badge">${unread}</div>` : ''}
        `;
        item.onclick = () => { 
            activeTarget = doc.id; 
            unreadCounts[doc.id] = 0;
            selectUser(); 
            renderUserList();
        };
        list.appendChild(item);
    });
}

function selectUser() {
    document.getElementById("targetName").innerText = activeTarget.toUpperCase();
    document.getElementById("hAvatar").innerText = activeTarget[0].toUpperCase();
    loadMessages();
}

function loadMessages() {
    db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
        const box = document.getElementById("messages");
        box.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            if((d.f==me && d.t==activeTarget) || (d.f==activeTarget && d.t==me)) {
                const m = document.createElement("div");
                m.className = `bubble ${d.f==me ? 'me' : 'other'}`;
                if(d.audio) m.innerHTML = `<audio src="${d.audio}" controls style="filter:invert(1); height:30px;"></audio>`;
                else m.innerText = d.txt;
                box.appendChild(m);
            }
        });
        box.scrollTop = box.scrollHeight;
    });
}

function sendMsg() {
    const i = document.getElementById("msgInput");
    if(!i.value || !activeTarget) return;
    db.collection("messages").add({ f: me, t: activeTarget, txt: i.value, time: Date.now() });
    i.value = "";
}

// --- WebRTC Logic ---
const rtcConfig = { iceServers: [{ urls: ["stun:stun.l.google.com:19302"] }] };

async function startCall() {
    if(!activeTarget) return;
    const ui = document.getElementById("callUI");
    ui.style.display = "flex";
    document.getElementById("cName").innerText = activeTarget.toUpperCase();
    document.getElementById("acceptBtn").style.display = "none";
    document.getElementById("muteBtn").style.display = "block";
    
    pc = new RTCPeerConnection(rtcConfig);
    pc.onicecandidate = e => e.candidate && db.collection("calls").doc(activeTarget).collection("callerCandidates").add(e.candidate.toJSON());
    pc.ontrack = e => { document.getElementById("remoteAudio").srcObject = e.streams[0]; document.getElementById("cStatus").innerText = "CONNECTED"; };

    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await db.collection("calls").doc(activeTarget).set({ offer, from: me });

    db.collection("calls").doc(activeTarget).onSnapshot(async snap => {
        const d = snap.data();
        if(d?.answer && !pc.currentRemoteDescription) await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
    });
}

function listenForCalls() {
    db.collection("calls").doc(me).onSnapshot(async snap => {
        const d = snap.data();
        if(d?.offer && !pc) {
            window.incoming = d;
            document.getElementById("callUI").style.display = "flex";
            document.getElementById("cName").innerText = d.from.toUpperCase();
            document.getElementById("acceptBtn").style.display = "block";
            document.getElementById("ring").play();
        } else if(!d && pc) hangup();
    });
}

async function answerCall() {
    document.getElementById("ring").pause();
    document.getElementById("acceptBtn").style.display = "none";
    document.getElementById("muteBtn").style.display = "block";
    pc = new RTCPeerConnection(rtcConfig);
    pc.onicecandidate = e => e.candidate && db.collection("calls").doc(me).collection("receiverCandidates").add(e.candidate.toJSON());
    pc.ontrack = e => { document.getElementById("remoteAudio").srcObject = e.streams[0]; document.getElementById("cStatus").innerText = "CONNECTED"; };
    
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    
    await pc.setRemoteDescription(new RTCSessionDescription(window.incoming.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await db.collection("calls").doc(me).update({ answer });
}

function hangup() {
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    if(pc) pc.close();
    pc = null;
    db.collection("calls").doc(me).delete();
    if(activeTarget) db.collection("calls").doc(activeTarget).delete();
    document.getElementById("callUI").style.display = "none";
    document.getElementById("callUI").classList.remove("minimized");
    document.getElementById("ring").pause();
}

function toggleCallView() {
    document.getElementById("callUI").classList.toggle("minimized");
}

let rec; let chunks = [];
async function toggleVoice() {
    const v = document.getElementById("vBtn");
    if(!rec || rec.state === 'inactive') {
        const s = await navigator.mediaDevices.getUserMedia({ audio: true });
        rec = new MediaRecorder(s); chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
            const b = new Blob(chunks, { type: 'audio/webm' });
            const r = new FileReader(); r.readAsDataURL(b);
            r.onloadend = () => db.collection("messages").add({ f: me, t: activeTarget, audio: r.result, time: Date.now() });
            v.style.background = "none";
        };
        rec.start(); v.style.background = "var(--secondary)";
    } else { rec.stop(); }
}

function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
