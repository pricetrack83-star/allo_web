<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLO_ - Hyper Cyber v4</title> 

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/wavesurfer.js"></script>

<style>
:root {
    --primary: #00ffcc;
    --secondary: #ff0055;
    --bg-dark: #020202;
    --glass: rgba(255, 255, 255, 0.03);
    --neon-box: 0 0 30px rgba(0, 255, 204, 0.4);
    --neon-text: 0 0 15px rgba(0, 255, 204, 0.8);
}

* { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

body { 
    font-family: 'Vazirmatn', sans-serif; background: var(--bg-dark); color: white;
    height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
}

/* --- پس‌زمینه متحرک پیشرفته --- */
.cyber-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
}
.cyber-orb {
    position: absolute; border-radius: 50%; filter: blur(120px);
    animation: rotate 20s infinite linear; opacity: 0.15;
}
.orb-1 { width: 600px; height: 600px; background: var(--primary); top: -20%; left: -10%; }
.orb-2 { width: 700px; height: 700px; background: var(--secondary); bottom: -20%; right: -10%; }

@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* --- صفحه لاگین فوق لوکس --- */
#loginScreen { 
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 20000; 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    backdrop-filter: blur(15px);
}

.login-brand {
    font-size: 110px; font-weight: 900; color: var(--primary); 
    letter-spacing: 15px; margin-bottom: 40px; 
    text-shadow: var(--neon-text); position: relative;
    animation: floating 3s infinite ease-in-out;
}
.login-brand span { color: #fff; opacity: 0.5; }

@keyframes floating {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

.login-inner { 
    background: rgba(255, 255, 255, 0.05); 
    padding: 60px; border-radius: 60px; width: 480px; 
    border: 1px solid rgba(255, 255, 255, 0.1); 
    text-align: center; 
    box-shadow: 0 40px 100px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.02);
    position: relative;
    overflow: hidden;
}

.login-inner::before {
    content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: conic-gradient(transparent, transparent, var(--primary), transparent);
    animation: borderRotate 6s infinite linear;
    z-index: -1; opacity: 0.3;
}
@keyframes borderRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.login-inner input { 
    width: 100%; padding: 22px; margin-bottom: 25px; border-radius: 25px; 
    border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.6); 
    color: #fff; text-align: center; font-size: 18px; outline: none;
}
.login-inner input:focus {
    border-color: var(--primary); box-shadow: var(--neon-box); transform: scale(1.02);
}

.btn-auth {
    width: 100%; padding: 22px; border-radius: 25px; border: none;
    background: linear-gradient(90deg, var(--primary), #00d4ff);
    color: #000; font-weight: 900; font-size: 20px; cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 255, 204, 0.3);
}
.btn-auth:hover { letter-spacing: 2px; box-shadow: 0 15px 40px rgba(0, 255, 204, 0.5); }

/* --- استایل اپ اصلی --- */
.app {
    width: 95vw; height: 92vh; max-width: 1400px;
    background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(60px);
    border-radius: 60px; border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; box-shadow: 0 50px 150px rgba(0,0,0,0.9); position: relative;
}

.sidebar { width: 360px; border-left: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }
.sidebar-header { padding: 45px; border-bottom: 1px solid rgba(255,255,255,0.05); }

.user-card {
    margin: 12px 25px; padding: 20px; border-radius: 30px; background: var(--glass);
    cursor: pointer; display: flex; align-items: center; justify-content: space-between;
}
.user-card:hover { transform: translateX(-10px); background: rgba(255,255,255,0.08); }
.user-card.active { border-color: var(--primary); background: rgba(0, 255, 204, 0.08); box-shadow: var(--neon-box); border: 1px solid var(--primary); }

.chat-main { flex: 1; display: flex; flex-direction: column; position: relative; }
.chat-header { padding: 30px 45px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); }

#messages { flex: 1; padding: 45px; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; }
.msg { 
    padding: 20px 28px; border-radius: 35px; max-width: 70%; font-size: 15px; 
    animation: popIn 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
.me { align-self: flex-end; background: linear-gradient(135deg, var(--primary), #00ccff); color: #000; font-weight: 700; border-bottom-right-radius: 5px; }
.other { align-self: flex-start; background: #1a1a1a; color: #fff; border-bottom-left-radius: 5px; border: 1px solid rgba(255,255,255,0.1); }

.footer { padding: 35px 50px; display: flex; gap: 25px; align-items: center; }
.input-wrap { flex: 1; }
#msgInput { 
    width: 100%; padding: 22px 40px; border-radius: 45px; border: 1px solid rgba(255,255,255,0.1);
    background: #000; color: #fff; outline: none; font-size: 16px;
}

.btn-icon { width: 65px; height: 65px; border-radius: 25px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 26px; }
.btn-send { background: var(--primary); color: #000; box-shadow: 0 10px 30px rgba(0, 255, 204, 0.4); }

/* --- کال باکس --- */
#callBox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98);
    z-index: 10000; flex-direction: column; align-items: center; justify-content: center;
    backdrop-filter: blur(50px);
}
.call-card {
    text-align: center; padding: 100px; border-radius: 80px; background: var(--glass);
    border: 1px solid var(--primary); box-shadow: 0 0 120px rgba(0, 255, 204, 0.2);
}

audio { height: 45px; filter: invert(1); margin-top: 15px; }
</style>
</head>
<body>

<div class="cyber-bg">
    <div class="cyber-orb orb-1"></div>
    <div class="cyber-orb orb-2"></div>
</div>

<div id="loginScreen">
    <div class="login-brand">ALLO_<span></span></div>
    <div class="login-inner">
        <div style="color:var(--primary); margin-bottom:30px; font-weight:100; font-size:14px; letter-spacing:5px;">SECURE CYBER ACCESS</div>
        <input id="uID" placeholder="ایم یا آی‌دی کاربری">
        <input id="uPass" type="password" placeholder="رمز عبور">
        <button class="btn-auth" onclick="handleAuth()">ورود به شبکه</button>
        <p style="margin-top:25px; font-size:12px; opacity:0.4;">v4.0.2 - Encrypted End-to-End</p>
    </div>
</div>

<div class="app">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2 style="color:var(--primary); letter-spacing:4px; font-weight:900;">ALLO_</h2>
        </div>
        <div id="userList" style="flex:1; overflow-y:auto; padding-top:20px;"></div>
        <div style="padding:35px; border-top:1px solid rgba(255,255,255,0.05);">
            <div id="myIDDisplay" style="font-size:12px; opacity:0.5; margin-bottom:12px; font-family:monospace;">STATION: ONLINE</div>
            <button onclick="logout()" style="background:none; border:none; color:var(--secondary); font-weight:bold; cursor:pointer; letter-spacing:1px;">TERMINATE SESSION ⬅</button>
        </div>
    </div>

    <div class="chat-main">
        <div class="chat-header">
            <div style="display:flex; align-items:center; gap:25px;">
                <div id="hAvatar" style="width:60px; height:60px; border-radius:22px; background:var(--primary); color:#000; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:24px;">?</div>
                <div>
                    <h3 id="hName" style="margin:0;">Select Terminal</h3>
                    <span style="font-size:11px; color:var(--primary); opacity:0.6;">Ready to Sync</span>
                </div>
            </div>
            <div style="display:flex; gap:18px;">
                <button class="btn-icon" style="background:var(--glass); color:var(--primary); border:1px solid rgba(0,255,204,0.2);" onclick="startCall()">📞</button>
                <button class="btn-icon" style="background:var(--glass);" onclick="toggleTheme()">🌗</button>
            </div>
        </div>

        <div id="messages"></div>

        <div class="footer">
            <div class="input-wrap">
                <input id="msgInput" placeholder="پیام رمزنگاری شده..." onkeypress="if(event.key=='Enter') sendMsg()">
            </div>
            <button id="vBtn" class="btn-icon btn-voice" onclick="toggleVoice()" style="color:var(--secondary); border:1px solid var(--secondary); background:transparent;">🎤</button>
            <button class="btn-icon btn-send" onclick="sendMsg()">✈</button>
        </div>
    </div>
</div>

<div id="callBox">
    <div class="call-card">
        <div style="width:140px; height:140px; border-radius:50%; background:var(--primary); margin:0 auto 30px; display:flex; align-items:center; justify-content:center; font-size:60px; color:#000; box-shadow:var(--neon-box);" id="cAvatar">👤</div>
        <h2 id="cName" style="font-size:38px; margin-bottom:15px; font-weight:900;">User</h2>
        <p id="cStatus" style="color:var(--primary); letter-spacing:2px; font-size:14px;">ESTABLISHING CONNECTION...</p>
        
        <div style="display:flex; gap:45px; justify-content:center; margin-top:60px;">
            <button id="acceptBtn" class="btn-icon" style="background:#2ecc71; width:100px; height:100px; display:none; box-shadow:0 0 30px #2ecc71;" onclick="answerCall()">✅</button>
            <button class="btn-icon" style="background:var(--secondary); width:100px; height:100px; box-shadow:0 0 30px var(--secondary);" onclick="hangup()">❌</button>
        </div>
    </div>
</div>

<audio id="ring" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_ringtones.ogg" loop></audio>

<script>
// --- فایربیس و منطق بدون تغییر ---
const firebaseConfig = {
    apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
    authDomain: "alloo-web.firebaseapp.com",
    projectId: "alloo-web",
    storageBucket: "alloo-web.appspot.com",
    messagingSenderId: "132232824762",
    appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me = localStorage.getItem("alloo_uid");
let activeTarget = "";
let pc = null;
let localStream = null;
const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] };

if(me) { 
    document.getElementById("loginScreen").style.display = "none";
    initApp(); 
}

function handleAuth() {
    const id = document.getElementById("uID").value.trim();
    const ps = document.getElementById("uPass").value.trim();
    if(!id || !ps) return;
    db.collection("users").doc(id).set({ online: true, pass: ps }, {merge:true});
    localStorage.setItem("alloo_uid", id);
    location.reload();
}

function initApp() {
    document.getElementById("myIDDisplay").innerText = "STATION: " + me.toUpperCase();
    db.collection("users").doc(me).update({ online: true });
    
    db.collection("users").onSnapshot(snap => {
        const list = document.getElementById("userList");
        list.innerHTML = "";
        snap.forEach(doc => {
            if(doc.id === me) return;
            const card = document.createElement("div");
            card.className = `user-card ${activeTarget === doc.id ? 'active' : ''}`;
            card.innerHTML = `
                <div style="display:flex; align-items:center; gap:18px;">
                    <div style="width:50px; height:50px; border-radius:18px; background:#111; display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--primary);">${doc.id[0].toUpperCase()}</div>
                    <b style="font-size:17px;">${doc.id}</b>
                </div>
                <div style="width:12px; height:12px; border-radius:50%; background:${doc.data().online ? 'var(--primary)' : '#444'}; box-shadow:${doc.data().online ? '0 0 10px var(--primary)' : 'none'}"></div>
            `;
            card.onclick = () => { activeTarget = doc.id; selectUser(); };
            list.appendChild(card);
        });
    });
    listenForInboundCalls();
}

function selectUser() {
    document.getElementById("hName").innerText = activeTarget;
    document.getElementById("hAvatar").innerText = activeTarget[0].toUpperCase();
    loadMessages();
}

function loadMessages() {
    db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
        const box = document.getElementById("messages");
        box.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            if((d.f==me && d.t==activeTarget) || (d.f==activeTarget && d.t==me)) {
                const m = document.createElement("div");
                m.className = `msg ${d.f==me ? 'me' : 'other'}`;
                if(d.audio) m.innerHTML = `<audio src="${d.audio}" controls></audio>`;
                else m.innerText = d.txt;
                box.appendChild(m);
            }
        });
        box.scrollTop = box.scrollHeight;
    });
}

function sendMsg() {
    const inp = document.getElementById("msgInput");
    if(!inp.value || !activeTarget) return;
    db.collection("messages").add({ f: me, t: activeTarget, txt: inp.value, time: Date.now() });
    inp.value = "";
}

// تماس صوتی (ثابت شده)
async function startCall() {
    if(!activeTarget) return;
    showCallUI(activeTarget, false);
    pc = new RTCPeerConnection(rtcConfig);
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.ontrack = e => {
        const remoteAudio = new Audio();
        remoteAudio.srcObject = e.streams[0];
        remoteAudio.autoplay = true;
        remoteAudio.play();
    };

    pc.onicecandidate = e => {
        if(e.candidate) db.collection("calls").doc(activeTarget).collection("callerCandidates").add(e.candidate.toJSON());
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await db.collection("calls").doc(activeTarget).set({ offer: { sdp: offer.sdp, type: offer.type }, from: me, status: "ringing" });

    db.collection("calls").doc(activeTarget).onSnapshot(async snap => {
        const data = snap.data();
        if(data && data.answer && !pc.currentRemoteDescription) {
            await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            document.getElementById("cStatus").innerText = "ENCRYPTED CHANNAL ACTIVE";
        }
    });

    db.collection("calls").doc(activeTarget).collection("receiverCandidates").onSnapshot(snap => {
        snap.docChanges().forEach(change => { if(change.type === "added") pc.addIceCandidate(new RTCIceCandidate(change.doc.data())); });
    });
}

function listenForInboundCalls() {
    db.collection("calls").doc(me).onSnapshot(async snap => {
        const data = snap.data();
        if(data && data.offer && !pc) {
            window.incomingCall = data;
            showCallUI(data.from, true);
            document.getElementById("ring").play();
        } else if(!data && pc) hangup();
    });
}

async function answerCall() {
    document.getElementById("ring").pause();
    document.getElementById("acceptBtn").style.display = "none";
    pc = new RTCPeerConnection(rtcConfig);
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.ontrack = e => {
        const remoteAudio = new Audio();
        remoteAudio.srcObject = e.streams[0];
        remoteAudio.autoplay = true;
        remoteAudio.play();
    };

    pc.onicecandidate = e => {
        if(e.candidate) db.collection("calls").doc(me).collection("receiverCandidates").add(e.candidate.toJSON());
    };

    await pc.setRemoteDescription(new RTCSessionDescription(window.incomingCall.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await db.collection("calls").doc(me).update({ answer: { sdp: answer.sdp, type: answer.type } });

    db.collection("calls").doc(me).collection("callerCandidates").onSnapshot(snap => {
        snap.docChanges().forEach(change => { if(change.type === "added") pc.addIceCandidate(new RTCIceCandidate(change.doc.data())); });
    });
}

function showCallUI(name, incoming) {
    document.getElementById("callBox").style.display = "flex";
    document.getElementById("cName").innerText = name;
    document.getElementById("acceptBtn").style.display = incoming ? "block" : "none";
}

function hangup() {
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    if(pc) { pc.close(); pc = null; }
    db.collection("calls").doc(me).delete();
    if(activeTarget) db.collection("calls").doc(activeTarget).delete();
    document.getElementById("callBox").style.display = "none";
    document.getElementById("ring").pause();
}

let rec; let chunks = [];
async function toggleVoice() {
    const btn = document.getElementById("vBtn");
    if(!rec || rec.state === "inactive") {
        const s = await navigator.mediaDevices.getUserMedia({ audio: true });
        rec = new MediaRecorder(s);
        chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
            const b = new Blob(chunks, { type: 'audio/webm' });
            const r = new FileReader();
            r.readAsDataURL(b);
            r.onloadend = () => db.collection("messages").add({ f: me, t: activeTarget, audio: r.result, time: Date.now() });
        };
        rec.start();
        btn.style.background = "var(--secondary)"; btn.style.color = "#fff";
    } else {
        rec.stop();
        btn.style.background = "transparent"; btn.style.color = "var(--secondary)";
    }
}

function logout() { db.collection("users").doc(me).update({ online: false }); localStorage.clear(); location.reload(); }
function toggleTheme() { document.body.classList.toggle("light"); }
</script>
</body>
</html>
