<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLOO</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.container {
  width:360px;
  height:600px;
  background:#111;
  border-radius:25px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.header {
  background:#00e676;
  padding:15px;
  text-align:center;
  color:#000;
  font-weight:bold;
}

#login, #chat {
  flex:1;
  display:flex;
  flex-direction:column;
  padding:15px;
}

#chat { display:none; }

input, button {
  padding:10px;
  border:none;
  border-radius:10px;
  margin-top:10px;
}

button {
  background:#00e676;
  cursor:pointer;
}

#messages {
  flex:1;
  overflow:auto;
}

.msg {
  margin:5px 0;
  padding:10px;
  border-radius:15px;
  max-width:75%;
}

.me { background:#00e676; color:black; align-self:flex-end; }
.other { background:#333; }

.footer {
  display:flex;
  gap:5px;
}

.footer input { flex:1; }

.voice-btn {
  background:#ff5252;
}
</style>
</head>

<body>

<div class="container">

<div class="header">ALLOO 🎤</div>

<div id="login">
  <input id="name" placeholder="اسمتو بنویس">
  <button id="loginBtn">ورود</button>
</div>

<div id="chat">
  <div id="messages"></div>

  <div class="footer">
    <input id="msg" placeholder="پیام...">
    <button id="sendBtn">➤</button>
    <button id="recBtn" class="voice-btn">🎤</button>
  </div>

  <button id="logoutBtn">خروج</button>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
  authDomain: "alloo-web.firebaseapp.com",
  projectId: "alloo-web",
  storageBucket: "alloo-web.firebasestorage.app",
  messagingSenderId: "132232824762",
  appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me = "";
let mediaRecorder;
let chunks = [];

const loginBtn = document.getElementById("loginBtn");
const sendBtn = document.getElementById("sendBtn");
const recBtn = document.getElementById("recBtn");

// ورود
loginBtn.onclick = ()=>{
  const name = document.getElementById("name").value.trim();
  if(!name) return alert("اسم بزن");

  me = name;
  localStorage.setItem("allo_user", name);
  startChat();
};

function startChat(){
  document.getElementById("login").style.display="none";
  document.getElementById("chat").style.display="flex";

  db.collection("messages").orderBy("time")
  .onSnapshot(snap=>{
    const box = document.getElementById("messages");
    box.innerHTML="";

    snap.forEach(doc=>{
      const m = doc.data();
      const div = document.createElement("div");
      div.className = "msg " + (m.from===me ? "me":"other");

      if(m.text){
        div.innerHTML = `<b>${m.from}</b><br>${m.text}`;
      }

      if(m.audio){
        const audio = document.createElement("audio");
        audio.src = m.audio;
        audio.controls = true;
        div.innerHTML = `<b>${m.from}</b><br>`;
        div.appendChild(audio);
      }

      box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
  });
}

// ارسال متن
sendBtn.onclick = ()=>{
  const input = document.getElementById("msg");
  const txt = input.value.trim();
  if(!txt) return;

  db.collection("messages").add({
    from: me,
    text: txt,
    time: Date.now()
  });

  input.value="";
};

// 🎤 ضبط ویس
recBtn.onclick = async ()=>{
  if(!mediaRecorder){
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream);

    mediaRecorder.ondataavailable = e => chunks.push(e.data);

    mediaRecorder.onstop = ()=>{
      const blob = new Blob(chunks, {type:'audio/webm'});
      chunks = [];

      const reader = new FileReader();
      reader.readAsDataURL(blob);

      reader.onloadend = ()=>{
        db.collection("messages").add({
          from: me,
          audio: reader.result,
          time: Date.now()
        });
      };
    };

    mediaRecorder.start();
    recBtn.innerText = "⏹";
  } else {
    mediaRecorder.stop();
    mediaRecorder = null;
    recBtn.innerText = "🎤";
  }
};

// خروج
document.getElementById("logoutBtn").onclick = ()=>{
  localStorage.removeItem("allo_user");
  location.reload();
};

// auto login
window.onload = ()=>{
  const user = localStorage.getItem("allo_user");
  if(user){
    me = user;
    startChat();
  }
};
</script>

</body>
</html>
