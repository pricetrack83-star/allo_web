<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLOO</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.container {
  width:360px;
  height:600px;
  background:#111;
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 0 30px rgba(0,0,0,0.6);
  display:flex;
  flex-direction:column;
}

.header {
  background:#00e676;
  padding:15px;
  text-align:center;
  font-weight:bold;
  color:#000;
  font-size:18px;
}

#login, #chat {
  flex:1;
  display:flex;
  flex-direction:column;
  padding:15px;
}

#chat { display:none; }

input {
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  outline:none;
}

button {
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#00e676;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover {
  opacity:0.8;
}

#messages {
  flex:1;
  overflow:auto;
  margin:10px 0;
  padding:5px;
}

.msg {
  margin:6px 0;
  padding:10px;
  border-radius:15px;
  max-width:75%;
  word-wrap:break-word;
  animation:fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}

.me {
  background:#00e676;
  color:black;
  align-self:flex-end;
}

.other {
  background:#333;
  align-self:flex-start;
}

.footer {
  display:flex;
  gap:5px;
}

.footer input {
  flex:1;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">ALLOO 💬</div>

  <!-- LOGIN -->
  <div id="login">
    <input id="name" placeholder="اسمتو بنویس...">
    <button id="loginBtn">ورود</button>
  </div>

  <!-- CHAT -->
  <div id="chat">
    <div id="messages"></div>

    <div class="footer">
      <input id="msg" placeholder="پیام...">
      <button id="sendBtn">➤</button>
    </div>

    <button id="logoutBtn">خروج</button>
  </div>

</div>

<script>
console.log("ALLOO START");

// 🔥 کانفیگ خودت
const firebaseConfig = {
  apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
  authDomain: "alloo-web.firebaseapp.com",
  projectId: "alloo-web",
  storageBucket: "alloo-web.firebasestorage.app",
  messagingSenderId: "132232824762",
  appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};

// init
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me = "";

// elements
const loginBox = document.getElementById("login");
const chatBox = document.getElementById("chat");
const loginBtn = document.getElementById("loginBtn");
const sendBtn = document.getElementById("sendBtn");
const logoutBtn = document.getElementById("logoutBtn");

// ورود
loginBtn.onclick = ()=>{
  const name = document.getElementById("name").value.trim();

  if(!name){
    alert("اسم وارد کن 😐");
    return;
  }

  me = name;
  localStorage.setItem("allo_user", name);

  startChat();
};

// شروع چت
function startChat(){
  loginBox.style.display="none";
  chatBox.style.display="flex";

  loadMessages();
}

// لود پیام‌ها
function loadMessages(){
  db.collection("messages")
    .orderBy("time")
    .onSnapshot(snapshot=>{
      const box = document.getElementById("messages");
      box.innerHTML = "";

      snapshot.forEach(doc=>{
        const m = doc.data();

        const div = document.createElement("div");
        div.className = "msg " + (m.from === me ? "me" : "other");

        div.innerHTML = `<b>${m.from}</b><br>${m.text}`;

        box.appendChild(div);
      });

      box.scrollTop = box.scrollHeight;
    });
}

// ارسال پیام
sendBtn.onclick = ()=>{
  const input = document.getElementById("msg");
  const txt = input.value.trim();

  if(!txt) return;

  db.collection("messages").add({
    from: me,
    text: txt,
    time: Date.now()
  });

  input.value = "";
};

// خروج
logoutBtn.onclick = ()=>{
  localStorage.removeItem("allo_user");
  location.reload();
};

// ورود خودکار
window.onload = ()=>{
  const user = localStorage.getItem("allo_user");
  if(user){
    me = user;
    startChat();
  }
};
</script>

</body>
</html>
