<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLOO TEST LOGIN</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

#login, #chat {
  background:#1a1a1a;
  padding:30px;
  border-radius:20px;
  text-align:center;
  width:300px;
}

#chat {
  display:none;
}

input {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

button {
  margin-top:10px;
  padding:10px;
  width:100%;
  border:none;
  border-radius:10px;
  background:#00e676;
  cursor:pointer;
}
</style>

</head>
<body>

<div id="login">
  <h2>ALLOO</h2>
  <input id="name" placeholder="نام خود را وارد کنید">
  <button id="loginBtn">ورود</button>
</div>

<div id="chat">
  <h2>🎉 وارد شدی</h2>
  <p id="userName"></p>
  <button id="logoutBtn">خروج</button>
</div>

<script>
console.log("JS Loaded ✅");

// گرفتن المان‌ها
const loginBox = document.getElementById("login");
const chatBox = document.getElementById("chat");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const nameInput = document.getElementById("name");
const userName = document.getElementById("userName");

// ورود
loginBtn.onclick = function(){
    const name = nameInput.value.trim();

    if(!name){
        alert("لطفا اسم وارد کن");
        return;
    }

    localStorage.setItem("allo_user", name);

    showChat(name);

    console.log("LOGIN SUCCESS ✅");
};

// نمایش چت
function showChat(name){
    loginBox.style.display = "none";
    chatBox.style.display = "block";
    userName.innerText = "👤 " + name;
}

// خروج
logoutBtn.onclick = function(){
    localStorage.removeItem("allo_user");
    location.reload();
};

// ورود خودکار
window.onload = function(){
    const user = localStorage.getItem("allo_user");
    if(user){
        showChat(user);
    }
};
</script>

</body>
</html>
