<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLOO</title> 
<link rel="icon" type="image/png" href="logo.png">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/wavesurfer.js"></script>

<style>
/* تمام استایل‌های شما بدون تغییر */
body{
  margin:0;
  font-family:'Vazirmatn',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  transition:0.5s;
}
body.light{
  background:linear-gradient(135deg,#f5f5f5,#ddd);
  color:#111;
}
body.dark{
  background:linear-gradient(135deg,#0f0f0f,#1a1a1a);
  color:white;
}
.app{
  width:980px;
  height:720px;
  border-radius:30px;
  backdrop-filter:blur(25px);
  display:flex;
  overflow:hidden;
  transition:0.5s;
  box-shadow:0 10px 40px rgba(0,0,0,0.2);
}
body.light .app{
  background:rgba(255,255,255,0.95);
  box-shadow:0 0 60px rgba(0,200,255,0.2);
}
body.dark .app{
  background:rgba(20,20,20,0.95);
  box-shadow:0 0 60px rgba(0,255,118,0.4);
}
.main-logo-img {
  width: 130px;
  height: auto;
  margin-bottom: 15px;
  filter: drop-shadow(0 0 10px rgba(0,255,128,0.4));
  transition: 0.3s;
}
.sidebar-logo-img {
  width: 70px;
  height: auto;
  display: block;
  margin: 15px auto;
  filter: drop-shadow(0 0 5px rgba(0,255,128,0.2));
}
body.light .main-logo-img, body.light .sidebar-logo-img {
  filter: invert(0.8) drop-shadow(0 0 5px rgba(0,0,0,0.1));
}
#loginBox{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:15px;
}
#loginBox input{
  width:300px;
  padding:16px;
  border-radius:30px;
  border:none;
  background:#222;
  color:white;
  outline:none;
  font-size:15px;
  transition:0.3s;
  box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
body.light #loginBox input{background:#eee; color:#111;}
#loginBox input:focus{background:#333; box-shadow:0 0 10px #00ff80;}
body.light #loginBox input:focus{background:#ccc; box-shadow:0 0 10px #00aaff;}
#loginBox button{
  width:200px;
  padding:16px;
  border-radius:30px;
  border:none;
  background:linear-gradient(135deg,#00ff80,#00e676);
  color:black;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
  box-shadow:0 5px 15px rgba(0,255,118,0.4);
  transition:0.3s;
}
#loginBox button:hover{
  transform:scale(1.1);
  box-shadow:0 8px 25px rgba(0,255,118,0.6);
}
#chatBox{display:none; flex:1; flex-direction:row; transition:0.5s;}
#onlineList{
  width:240px;
  padding:15px;
  display:flex;
  flex-direction:column;
  border-radius:0 0 0 30px;
  transition:0.5s;
  overflow-y:auto;
  background:rgba(30,30,30,0.95);
}
body.light #onlineList{
  background:rgba(240,240,240,0.95);
  border-right:2px solid #00aaff;
}
body.dark #onlineList{
  background:rgba(30,30,30,0.95);
  border-right:2px solid #00ff80;
}
#onlineList h3{
  text-align:center;
  margin-bottom:12px;
  text-shadow:0 0 8px currentColor;
}
.user{
  padding:12px 15px;
  margin:5px 0;
  border-radius:25px;
  cursor:pointer;
  transition:0.3s;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,0.2);
}
.user:hover{
  transform:scale(1.05);
  background:linear-gradient(135deg,#00ff80,#00e676);
  color:black;
  box-shadow:0 5px 18px rgba(0,255,118,0.5);
}
body.light .user:hover{background:linear-gradient(135deg,#00aaff,#00d4ff); color:white;}
#chatArea{
  flex:1;
  display:flex;
  flex-direction:column;
  margin-left:10px;
  border-radius:0 30px 30px 0;
  padding:10px;
  transition:0.5s;
  background:rgba(10,10,10,0.9);
  position:relative;
}
body.light #chatArea{background:rgba(255,255,255,0.95);}
#userID{
  font-size:13px;
  color:#00ff80;
  text-align:center;
  margin-bottom:5px;
  font-weight:bold;
}
#messages{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:10px;
}
.msg{
  padding:14px 20px;
  border-radius:25px;
  max-width:70%;
  position:relative;
  transition:0.3s;
  cursor:pointer;
  font-size:14px;
  word-break:break-word;
  box-shadow:0 2px 12px rgba(0,255,118,0.2);
}
.me{
  background:linear-gradient(135deg,#00ff80,#00e676);
  color:black;
  align-self:flex-end;
}
.other{
  background:linear-gradient(135deg,#333,#111);
  color:white;
}
.footer{
  display:flex;
  gap:10px;
  padding:12px;
  border-top:2px solid currentColor;
  border-radius:0 0 30px 0;
  align-items:center;
}
.footer input{
  flex:1;
  padding:14px 16px;
  border-radius:25px;
  border:none;
  background:#222;
  color:white;
  outline:none;
  font-size:14px;
  transition:0.3s;
}
body.light .footer input{background:#eee; color:#111;}
.footer button{
  padding:14px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#00ff80,#00e676);
  color:black;
  cursor:pointer;
  font-size:18px;
  transition:0.3s;
}
.footer button:hover{ transform:scale(1.2); }
#recordBtn{
  padding:10px 18px;
  border-radius:50px;
  border:none;
  background:linear-gradient(135deg,#ff4081,#f50057);
  color:white;
  cursor:pointer;
}
#recordBtn.recording{ animation:pulse 1s infinite; }
@keyframes pulse{
  0%{box-shadow:0 0 5px #ff5252;}
  50%{box-shadow:0 0 20px #ff1744;}
  100%{box-shadow:0 0 5px #ff5252;}
}
#callBox{
  display:none;
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.9);
  padding:20px;
  border-radius:20px;
  color:white;
  z-index:999;
  width:300px;
  text-align:center;
}
</style>
</head>
<body class="dark">

<div class="app">
<div id="loginBox">
  <img src="logo.png" alt="Logo" class="main-logo-img">
  <div style="font-size:38px;font-weight:bold;color:#00ff80;text-shadow:0 0 20px #00ff80;">ALLOO</div>
  
  <input id="usernameInput" placeholder="نام کاربری">
  <input id="passwordInput" type="password" placeholder="رمز عبور">
  <input id="userIDInput" placeholder="شناسه یکتا (مثلاً: user123)">
  <button onclick="registerUser()">ثبت نام</button>
  <button onclick="loginUser()">ورود</button>
  <button id="themeToggle" onclick="toggleTheme()">تغییر تم 🌗</button>
</div>

<div id="chatBox">
  <div id="onlineList">
    <img src="logo.png" alt="ALLOO" class="sidebar-logo-img">
    <h3>آنلاین‌ها</h3>
    <div id="users"></div>
  </div>
  <div id="chatArea">
    <div id="userID"></div>
    <div id="messages"></div>
    <div class="footer">
      <input id="msgInput" placeholder="پیام...">
      <button onclick="sendMessage()">💬</button>
      <input type="file" id="imgInput" style="display:none;" accept="image/*">
      <button onclick="document.getElementById('imgInput').click()">📸</button>
      <div id="voiceControls">
        <button id="recordBtn" onclick="toggleRecording()">🎤</button>
        <span id="recTimer">00:00</span>
      </div>
      <button id="callMainBtn" onclick="startCall()">📞 تماس</button>
      <button onclick="toggleTheme()">🌗</button>
    </div>
    <button onclick="logout()" style="margin:10px;background:#ff5252;border-radius:25px;padding:10px;font-weight:bold;cursor:pointer;border:none;color:white;">خروج</button>
  </div>
</div>

<div id="callBox">
  <div id="callStatus">در انتظار تماس...</div>
  <div id="callActions" style="margin-top:10px; display:none;">
    <button onclick="acceptCall()" style="background:#4caf50;color:white;border:none;padding:10px;border-radius:10px;cursor:pointer;">✅ قبول</button>
    <button onclick="rejectCall()" style="background:#f44336;color:white;border:none;padding:10px;border-radius:10px;cursor:pointer;margin-right:5px;">❌ رد</button>
  </div>
  <button id="hangupBtn" onclick="endCall()" style="display:none; background:#f44336; color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; margin-top:10px;">📞 قطع تماس</button>
</div>

<audio id="ringTone" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_ringtones.ogg" loop></audio>

<script>
// ==================== Firebase ====================
const firebaseConfig = {
  apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
  authDomain: "alloo-web.firebaseapp.com",
  projectId: "alloo-web",
  storageBucket: "alloo-web.appspot.com",
  messagingSenderId: "132232824762",
  appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me="", activeUser="", recorder=null, recChunks=[], recInterval=null, recSeconds=0;
let localStream=null, peerConnection=null, currentCallDocId = null;
const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

// --- پوسته و اجرا ---
document.body.classList.add(localStorage.getItem("allo_theme")||"dark");
if(localStorage.getItem("allo_user")){ 
    me=localStorage.getItem("allo_user"); 
    document.getElementById("userID").innerText="کد شما: "+me; 
    startApp(); 
}

function toggleTheme(){
  document.body.classList.toggle('light');
  document.body.classList.toggle('dark');
  localStorage.setItem("allo_theme", document.body.classList.contains('dark')?"dark":"light");
}

// --- مدیریت کاربر ---
function registerUser(){
  let u=document.getElementById("usernameInput").value.trim();
  let p=document.getElementById("passwordInput").value.trim();
  let id=document.getElementById("userIDInput").value.trim();
  if(!u||!p||!id) return alert("تمام فیلدها لازم است");
  db.collection("users").doc(id).get().then(doc=>{
    if(doc.exists) return alert("این شناسه یکتا قبلاً استفاده شده");
    db.collection("users").doc(id).set({username:u,password:p,online:true});
    me=id; localStorage.setItem("allo_user",me); 
    startApp();
  });
}

function loginUser(){
  let u=document.getElementById("userIDInput").value.trim();
  let p=document.getElementById("passwordInput").value.trim();
  db.collection("users").doc(u).get().then(doc=>{
    if(!doc.exists || doc.data().password!==p) return alert("خطا در ورود");
    me=u; localStorage.setItem("allo_user",me);
    db.collection("users").doc(me).update({online:true});
    startApp();
  });
}

function startApp(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("chatBox").style.display="flex";
  document.getElementById("userID").innerText="کد شما: "+me;
  loadUsers();
  listenForCalls();
}

function loadUsers(){
  db.collection("users").onSnapshot(snap=>{
    const usersDiv=document.getElementById("users"); usersDiv.innerHTML="";
    snap.forEach(doc=>{
      if(doc.id===me) return;
      let div=document.createElement("div");
      div.className="user";
      div.innerHTML=`<span>${doc.data().username} (${doc.id})</span><span>${doc.data().online?"✅":"❌"}</span>`;
      div.onclick=()=>{ activeUser=doc.id; loadMessages(); };
      usersDiv.appendChild(div);
    });
  });
}

function loadMessages(){
  if(!activeUser) return;
  db.collection("messages").orderBy("time").onSnapshot(snap=>{
    const msgDiv = document.getElementById("messages");
    msgDiv.innerHTML = "";
    snap.forEach(doc=>{
      let m = doc.data();
      if(!((m.from===me && m.to===activeUser) || (m.from===activeUser && m.to===me))) return;
      let div = document.createElement("div");
      div.className = "msg " + (m.from===me ? "me" : "other");
      if(m.text) div.innerText = m.text;
      if(m.audio){
        let aud = document.createElement("audio"); aud.src = m.audio; aud.controls=true;
        div.appendChild(aud);
      }
      msgDiv.appendChild(div);
    });
    msgDiv.scrollTop = msgDiv.scrollHeight;
  });
}

function sendMessage(){
  let text = document.getElementById("msgInput").value.trim();
  if(text && activeUser) {
    db.collection("messages").add({ from: me, to: activeUser, text: text, time: firebase.firestore.FieldValue.serverTimestamp() });
    document.getElementById("msgInput").value="";
  }
}

// --- ضبط صدا ---
async function toggleRecording(){
  if(recorder && recorder.state=="recording"){
    recorder.stop(); clearInterval(recInterval); recSeconds=0;
    document.getElementById("recordBtn").classList.remove("recording");
  }else{
    let stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recorder = new MediaRecorder(stream);
    recorder.start(); recChunks=[]; recSeconds=0;
    document.getElementById("recordBtn").classList.add("recording");
    recInterval=setInterval(()=>{ recSeconds++; let m=Math.floor(recSeconds/60); let s=recSeconds%60; document.getElementById("recTimer").innerText=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; },1000);
    recorder.ondataavailable=e=>recChunks.push(e.data);
    recorder.onstop=()=>{
      let reader = new FileReader();
      reader.readAsDataURL(new Blob(recChunks,{type:'audio/webm'}));
      reader.onloadend = () => {
        if(activeUser) db.collection("messages").add({ from:me, to:activeUser, audio:reader.result, time:firebase.firestore.FieldValue.serverTimestamp() });
      };
    };
  }
}

// ==================== تماس صوتی هوشمند (با قابلیت قطع تماس) ====================

async function startCall(){
  if(!activeUser) return alert("ابتدا یک کاربر را انتخاب کنید");
  
  currentCallDocId = activeUser; // سندی که برای طرف مقابل ساخته می‌شود
  localStream = await navigator.mediaDevices.getUserMedia({audio:true});
  peerConnection = new RTCPeerConnection(config);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

  peerConnection.onicecandidate = e => {
    if(e.candidate) db.collection("calls").doc(currentCallDocId).collection("candidates").add(e.candidate.toJSON());
  };

  peerConnection.ontrack = e => {
    let aud = document.getElementById("remoteAudio") || document.createElement("audio");
    aud.id = "remoteAudio"; aud.srcObject = e.streams[0]; aud.autoplay = true; document.body.appendChild(aud);
  };

  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);

  await db.collection("calls").doc(currentCallDocId).set({ 
    offer: {type: offer.type, sdp: offer.sdp}, 
    from: me,
    status: "calling" 
  });

  // نمایش پنل قطع تماس
  document.getElementById("callBox").style.display = "block";
  document.getElementById("callStatus").innerText = "در حال زنگ زدن...";
  document.getElementById("hangupBtn").style.display = "inline-block";
  document.getElementById("callActions").style.display = "none";

  // گوش دادن به پاسخ یا قطع تماس
  db.collection("calls").doc(currentCallDocId).onSnapshot(doc => {
    let data = doc.data();
    if(!data) { cleanupCall(); return; } // اگر سند حذف شد یعنی طرف مقابل قطع کرده
    if(data.answer && !peerConnection.currentRemoteDescription) {
      peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      document.getElementById("callStatus").innerText = "در حال مکالمه...";
    }
  });
}

function listenForCalls(){
  db.collection("calls").doc(me).onSnapshot(async doc => {
    let data = doc.data();
    if(!data) { if(peerConnection) cleanupCall(); return; }
    
    if(data.offer && !peerConnection){
      window.incomingCallData = data;
      currentCallDocId = me;
      document.getElementById("callBox").style.display="block";
      document.getElementById("callStatus").innerText="تماس از طرف: " + data.from;
      document.getElementById("callActions").style.display="block";
      document.getElementById("hangupBtn").style.display = "none";
      document.getElementById("ringTone").play();
    }
  });
}

async function acceptCall(){
  document.getElementById("ringTone").pause();
  document.getElementById("callActions").style.display="none";
  document.getElementById("hangupBtn").style.display = "inline-block";
  document.getElementById("callStatus").innerText = "در حال اتصال...";

  let data = window.incomingCallData;
  localStream = await navigator.mediaDevices.getUserMedia({audio:true});
  peerConnection = new RTCPeerConnection(config);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

  peerConnection.onicecandidate = e => {
    if(e.candidate) db.collection("calls").doc(currentCallDocId).collection("candidates").add(e.candidate.toJSON());
  };

  peerConnection.ontrack = e => {
    let aud = document.getElementById("remoteAudio") || document.createElement("audio");
    aud.id = "remoteAudio"; aud.srcObject = e.streams[0]; aud.autoplay = true; document.body.appendChild(aud);
  };

  await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);

  await db.collection("calls").doc(me).update({ 
    answer: {type: answer.type, sdp: answer.sdp},
    status: "connected"
  });

  db.collection("calls").doc(me).collection("candidates").onSnapshot(snap => {
    snap.docChanges().forEach(change => {
      if(change.type === "added") peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
    });
  });
}

// تابع قطع تماس توسط کاربر
async function endCall() {
  if(currentCallDocId) {
    await db.collection("calls").doc(currentCallDocId).delete();
  }
  cleanupCall();
}

// تابع پاکسازی رابط کاربری و حافظه
function cleanupCall() {
  if(localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }
  if(peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  let aud = document.getElementById("remoteAudio");
  if(aud) aud.remove();
  
  document.getElementById("ringTone").pause();
  document.getElementById("callBox").style.display = "none";
  document.getElementById("hangupBtn").style.display = "none";
}

function rejectCall(){ 
  endCall();
}

function logout(){
  if(me) db.collection("users").doc(me).update({online:false});
  localStorage.removeItem("allo_user");
  location.reload();
}
</script>
</body>
</html>
