<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ALLO - Ultimate Edition</title> 

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;500;800;900&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root {
    --primary: #00ffcc;
    --primary-glow: rgba(0, 255, 204, 0.6);
    --secondary: #ff0055;
    --secondary-glow: rgba(255, 0, 85, 0.5);
    --accent: #bc13fe;
    --dark-bg: #050505;
    --glass: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.12);
    --text-main: #ffffff;
    --card-bg: rgba(255, 255, 255, 0.07);
}

body.light-mode {
    --dark-bg: #eef2f3;
    --glass: rgba(0, 0, 0, 0.05);
    --border: rgba(0, 0, 0, 0.1);
    --text-main: #1a1a1a;
    --primary: #00a884;
    --card-bg: rgba(0, 0, 0, 0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }

body { 
    font-family: 'Vazirmatn', sans-serif; background: var(--dark-bg); color: var(--text-main);
    height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center;
}

/* --- [بخش ریسپانسیو موبایل] --- */
@media (max-width: 768px) {
    .app-frame { width: 100vw !important; height: 100vh !important; border-radius: 0 !important; border: none !important; }
    
    .sidebar { 
        width: 100% !important; 
        position: absolute; 
        inset: 0; 
        z-index: 10; 
        background: var(--dark-bg) !important;
        border-left: 2px solid var(--primary) !important;
        box-shadow: inset -10px 0 30px rgba(0, 255, 204, 0.05);
        transition: transform 0.5s ease; 
    }
    
    .sidebar.active-chat { transform: translateX(100%); }
    
    .input-area-wrapper { 
        padding: 10px 15px !important; 
        gap: 8px !important; 
        background: var(--glass) !important;
    }
    
    .input-row-mobile { display: flex !important; width: 100% !important; gap: 8px !important; align-items: center; }
    #msgInput { padding: 12px 15px !important; font-size: 13px !important; height: 45px !important; border-radius: 12px !important; }
    
    .icon-btn { 
        width: 45px !important; 
        height: 45px !important; 
        font-size: 18px !important; 
        border-radius: 12px !important; 
    }

    .chat-header { padding: 15px !important; }
    #targetName { font-size: 15px !important; }
    
    .bubble.has-audio { min-width: 150px !important; max-width: 85% !important; }
    .bubble audio { width: 100% !important; height: 32px !important; }

    /* ویدئو در موبایل */
    #remoteVideo { width: 100% !important; height: 100% !important; object-fit: cover; }
    #localVideo { width: 80px !important; height: 120px !important; bottom: 20px !important; left: 20px !important; }
}

.unread-count {
    background: var(--secondary) !important;
    color: #fff !important;
    font-weight: 900 !important;
    padding: 2px 10px !important;
    border-radius: 20px !important;
    font-size: 10px !important;
    font-family: 'Orbitron';
    box-shadow: 0 0 15px var(--secondary-glow), 0 0 5px #fff;
    border: 1px solid rgba(255,255,255,0.3);
    animation: unreadPulse 1s infinite alternate;
}
@keyframes unreadPulse { from { box-shadow: 0 0 5px var(--secondary-glow); } to { box-shadow: 0 0 15px var(--secondary-glow); } }

.is-recording {
    animation: recBtnPulse 1.5s infinite !important;
    background: var(--secondary) !important;
    color: white !important;
    border: none !important;
}
@keyframes recBtnPulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(255, 0, 85, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
}

.bubble.has-audio {
    background: var(--glass) !important;
    border: 1px solid var(--primary) !important;
    position: relative;
    overflow: hidden;
    min-width: 180px;
}
.bubble.has-audio::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--primary-glow), transparent);
    width: 60%; animation: voiceWaveMove 2s infinite linear;
    opacity: 0.15; pointer-events: none;
}
@keyframes voiceWaveMove { 0% { transform: translateX(-150%); } 100% { transform: translateX(200%); } }

/* استایل عکس در چت */
.bubble.has-image {
    padding: 5px !important;
    background: var(--glass) !important;
    border: 1px solid var(--border) !important;
}
.bubble img {
    max-width: 100%;
    border-radius: 18px;
    display: block;
    cursor: zoom-in;
}

.bg-canvas { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at center, var(--dark-bg) 0%, #000 100%); }
.particle { position: absolute; border-radius: 50%; background: var(--primary); filter: blur(100px); opacity: 0.15; animation: float 25s infinite alternate ease-in-out; }
@keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(150px, -100px) scale(1.4); } }

#loginScreen { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(30px); }
.login-card { width: 440px; padding: 50px; border-radius: 40px; background: var(--card-bg); border: 1px solid var(--border); box-shadow: 0 40px 100px rgba(0,0,0,0.9); text-align: center; }
.brand-title { font-family: 'Orbitron', sans-serif; font-size: 80px; font-weight: 900; color: var(--primary); letter-spacing: 15px; margin-bottom: 30px; text-shadow: 0 0 40px var(--primary-glow); }

.auth-mode-switch { display: flex; background: rgba(0,0,0,0.6); border-radius: 20px; margin-bottom: 35px; padding: 5px; border: 1px solid var(--border); }
.mode-btn { flex: 1; padding: 14px; border-radius: 15px; cursor: pointer; font-weight: 900; font-size: 14px; color: #888; border: none; background: none; }
.mode-btn.active { background: var(--primary); color: #000; box-shadow: 0 0 25px var(--primary-glow); }

.input-container { margin-bottom: 20px; position: relative; }
.input-container input { width: 100%; padding: 22px; border-radius: 18px; background: rgba(0,0,0,0.7); border: 1px solid var(--border); color: #fff; font-size: 15px; outline: none; text-align: center; }
.action-btn { width: 100%; padding: 22px; border-radius: 18px; border: none; background: linear-gradient(90deg, var(--primary), #00d2ff); color: #000; font-weight: 900; font-size: 16px; cursor: pointer; }

.app-frame { width: 96vw; height: 92vh; display: flex; background: var(--glass); border: 1px solid var(--border); border-radius: 50px; backdrop-filter: blur(50px); overflow: hidden; }
.sidebar { width: 360px; border-left: 1px solid var(--border); display: flex; flex-direction: column; background: rgba(0,0,0,0.2); }
.user-item { padding: 20px 25px; margin: 10px 15px; border-radius: 22px; display: flex; align-items: center; gap: 15px; cursor: pointer; border: 1px solid transparent; }
.user-item.active { background: linear-gradient(90deg, rgba(0, 255, 204, 0.12), transparent); border-color: rgba(0, 255, 204, 0.2); }

.avatar-hex { width: 52px; height: 52px; background: #0a0a0a; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-weight: 900; color: var(--primary); border: 1px solid var(--border); position: relative; }
.online-glow { position: absolute; top: -3px; right: -3px; width: 14px; height: 14px; background: var(--primary); border-radius: 50%; border: 3px solid #080808; display: none; box-shadow: 0 0 15px var(--primary); }
.is-online .online-glow { display: block; animation: pulse 2s infinite; }

.chat-window { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
.chat-header { padding: 25px 40px; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
#messages { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }

.bubble { padding: 16px 24px; border-radius: 25px; max-width: 65%; font-size: 14px; line-height: 1.6; }
.bubble.me { align-self: flex-end; background: var(--primary); color: #000; font-weight: 700; border-bottom-right-radius: 4px; }
.bubble.other { align-self: flex-start; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--text-main); }

#callUI { position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 20000; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(100px); }
#callUI.minimized { width: 380px; height: 100px; inset: auto 30px 30px auto; border-radius: 30px; flex-direction: row; padding: 0 25px; border: 2px solid var(--primary); background: #000; justify-content: space-between; }

/* استایل ویدئوهای تماس */
#remoteVideo { width: 100%; height: 100%; position: absolute; inset: 0; object-fit: cover; z-index: -1; display: none; background: #000; }
#localVideo { width: 150px; height: 220px; position: absolute; bottom: 40px; left: 40px; border-radius: 25px; border: 2px solid var(--primary); object-fit: cover; z-index: 10; display: none; background: #111; transform: scaleX(-1); }

.theme-toggle-btn { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--glass); color: var(--primary); font-family: 'Orbitron'; font-size: 10px; cursor: pointer; margin-bottom: 10px; }
.logout-btn { color: var(--secondary); background: rgba(255,0,85,0.1); border: 1px solid rgba(255,0,85,0.2); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 11px; width: 100%; }

#msgInput { flex: 1; padding: 22px 30px; border-radius: 22px; border: 1px solid var(--border); background: rgba(0,0,0,0.6); color: #fff; outline: none; font-size: 14px; min-width: 0; }
.icon-btn { width: 65px; height: 65px; border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; border: none; flex-shrink: 0; }
#recIndicator { display: none; align-items: center; gap: 10px; color: var(--secondary); font-weight: 800; font-size: 11px; font-family: 'Orbitron'; margin-bottom: 5px; }
.rec-dot { width: 10px; height: 10px; background: var(--secondary); border-radius: 50%; animation: recPulse 1.2s infinite; }

/* دکمه‌های جدید چت */
.chat-action-bar { display: flex; gap: 10px; margin-right: 15px; }
.call-type-btn { padding: 8px 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--glass); color: var(--text-main); font-family: 'Orbitron'; font-size: 10px; cursor: pointer; }
.call-type-btn.video-btn { border-color: var(--accent); color: var(--accent); }

</style>
</head>
<body>

<div class="bg-canvas">
    <div class="particle" style="width:450px; height:450px; top:5%; left:5%;"></div>
    <div class="particle" style="width:600px; height:600px; bottom:5%; right:5%; background:var(--accent);"></div>
</div>

<div id="loginScreen">
    <div class="brand-title">ALLO</div>
    <div class="login-card">
        <div class="auth-mode-switch">
            <button id="btnL" class="mode-btn active" onclick="setAuthMode('login')">ورود</button>
            <button id="btnR" class="mode-btn" onclick="setAuthMode('register')">ثبت‌نام</button>
        </div>
        <div class="input-container"><input id="uID" placeholder="USERNAME ID" autocomplete="off"></div>
        <div class="input-container"><input id="uPass" type="password" placeholder="ACCESS KEY"></div>
        <button class="action-btn" onclick="handleAuth()">INITIALIZE SESSION</button>
    </div>
</div>

<div class="app-frame">
    <div class="sidebar" id="mainSidebar">
        <div style="padding:40px; border-bottom:1px solid var(--border);">
            <h1 style="font-family:'Orbitron'; color:var(--primary); font-size:26px; letter-spacing:6px;">ALLO</h1>
        </div>
        <div id="userList" style="flex:1; overflow-y:auto; padding-top:15px;"></div>
        <div style="padding:25px; background:rgba(0,0,0,0.4); border-top:1px solid var(--border);">
            <div id="myIDDisplay" style="font-family:'Orbitron'; font-size:10px; color:var(--primary); margin-bottom:15px; opacity:0.7;">NODE: ...</div>
            <button onclick="toggleTheme()" class="theme-toggle-btn">🌓 SWITCH THEME</button>
            <button onclick="logout()" class="logout-btn">LOGOUT ✕</button>
        </div>
    </div>

    <div class="chat-window">
        <div class="chat-header">
            <div style="display:flex; align-items:center; gap:18px;">
                <button id="backToListBtn" onclick="backToList()" style="display:none; background:none; border:1px solid var(--primary); color:var(--primary); padding:8px 12px; border-radius:10px; cursor:pointer; font-size:10px; font-family:'Orbitron';">BACK</button>
                <div id="hAvatar" style="width:55px; height:55px; background:var(--glass); border:1px solid var(--border); border-radius:18px; display:flex; align-items:center; justify-content:center; font-family:'Orbitron'; font-weight:900; color:var(--primary);">?</div>
                <h3 id="targetName" style="font-weight:300; letter-spacing:2px; font-size:18px;">Terminal Ready</h3>
            </div>
            <div class="chat-action-bar">
                <button class="call-type-btn video-btn" onclick="startCall(true)">VIDEO</button>
                <button class="call-type-btn" onclick="startCall(false)" style="background:var(--primary); color:#000; border:none; font-weight:900;">CALL</button>
            </div>
        </div>

        <div id="messages"></div>

        <div class="input-area-wrapper" style="padding:25px 40px; display:flex; flex-direction:column; gap:10px; background:rgba(0,0,0,0.2);">
            <div id="recIndicator" style="display:none; align-items:center; gap:15px;">
                <div class="rec-dot"></div>
                <span style="color:var(--secondary); font-family:'Orbitron'; font-size:10px;">RECORDING...</span>
                <canvas id="voiceWave" width="100" height="20" style="flex:1;"></canvas>
            </div>
            <div class="input-row-mobile" style="display:flex; gap:15px; width:100%; align-items:center;">
                <input id="msgInput" placeholder="Secure transmission..." onkeypress="if(event.key=='Enter') sendMsg()">
                <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="sendImage(this)">
                <button onclick="document.getElementById('imgInput').click()" class="icon-btn" style="border:1px solid var(--accent); color:var(--accent); background:none; font-size: 20px;">🖼️</button>
                <button id="vBtn" onclick="toggleVoice()" class="icon-btn" style="border:1px solid var(--secondary); color:var(--secondary); background:none;">🎤</button>
                <button onclick="sendMsg()" class="icon-btn" style="background:var(--primary); color:#000;">✈</button>
            </div>
        </div>
    </div>
</div>

<div id="callUI">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>

    <button id="minBtn" onclick="toggleCallView()" style="position:absolute; top:30px; left:30px; background:none; border:1px solid #fff; color:#fff; padding:8px 15px; border-radius:10px; cursor:pointer; font-family:'Orbitron'; font-size:10px; z-index:100;">MINIMIZE</button>
    
    <div id="callInfo">
        <div class="call-avatar-large" id="cAvatar" style="font-size: 60px; text-align: center;">👤</div>
        <h2 id="cName" style="font-family:'Orbitron'; font-size:45px; margin-bottom:10px; letter-spacing:5px; text-align: center;">USER</h2>
        <p id="cStatus" style="color:var(--primary); letter-spacing:8px; font-weight:100; font-size:12px; text-align: center;">CONNECTING...</p>
    </div>

    <div class="call-controls-wrapper" style="display:flex; gap:35px; margin-top:50px; z-index:100;">
        <button id="acceptBtn" onclick="answerCall()" style="width:90px; height:90px; border-radius:35px; background:#2ecc71; border:none; font-size:35px; cursor:pointer;">✅</button>
        <button id="muteBtn" onclick="toggleMute()" style="width:90px; height:90px; border-radius:35px; background:rgba(255,255,255,0.1); border:1px solid var(--border); font-size:35px; cursor:pointer; display:none;">🎙️</button>
        <button onclick="hangup()" style="width:90px; height:90px; border-radius:35px; background:var(--secondary); border:none; font-size:35px; cursor:pointer;">❌</button>
    </div>
</div>

<audio id="ring" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_ringtones.ogg" loop></audio>
<audio id="remoteAudio" autoplay playsinline style="display:none;"></audio>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
    authDomain: "alloo-web.firebaseapp.com",
    projectId: "alloo-web",
    storageBucket: "alloo-web.appspot.com",
    messagingSenderId: "132232824762",
    appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me = localStorage.getItem("alloo_uid");
let activeTarget = "";
let authMode = 'login';
let pc; 
let localStream; 
let isMuted = false;
let isVideoCall = false;
let unreadCounts = {}; 

if(localStorage.getItem("allo_theme") === "light") document.body.classList.add("light-mode");

function toggleTheme() {
    document.body.classList.toggle("light-mode");
    localStorage.setItem("allo_theme", document.body.classList.contains("light-mode") ? "light" : "dark");
}

if(me) { document.getElementById("loginScreen").style.display = "none"; initApp(); }

function setAuthMode(m) {
    authMode = m;
    document.getElementById('btnL').className = `mode-btn ${m==='login'?'active':''}`;
    document.getElementById('btnR').className = `mode-btn ${m==='register'?'active':''}`;
}

async function handleAuth() {
    const id = document.getElementById("uID").value.trim().toLowerCase();
    const ps = document.getElementById("uPass").value.trim();
    if(!id || !ps) return;
    const userRef = db.collection("users").doc(id);
    const doc = await userRef.get();
    if(authMode === 'register') {
        if(doc.exists) return alert("آی‌دی رزرو شده است.");
        await userRef.set({ pass: ps, online: true, lastSeen: Date.now() });
    } else {
        if(!doc.exists || doc.data().pass !== ps) return alert("اطلاعات ورود نادرست است.");
        await userRef.update({ online: true, lastSeen: Date.now() });
    }
    localStorage.setItem("alloo_uid", id);
    location.reload();
}

function initApp() {
    document.getElementById("myIDDisplay").innerText = "NODE: " + me.toUpperCase();
    db.collection("users").doc(me).update({ online: true, lastSeen: Date.now() });
    setInterval(() => db.collection("users").doc(me).update({ lastSeen: Date.now(), online: true }), 20000);

    db.collection("messages").where("t", "==", me).where("read", "==", false).onSnapshot(snap => {
        unreadCounts = {}; 
        snap.forEach(doc => {
            const m = doc.data();
            unreadCounts[m.f] = (unreadCounts[m.f] || 0) + 1;
        });
        updateUserListUI();
    });

    db.collection("users").onSnapshot(() => updateUserListUI());
    listenForCalls();
}

function updateUserListUI() {
    const list = document.getElementById("userList");
    db.collection("users").get().then(snap => {
        list.innerHTML = "";
        snap.forEach(doc => {
            if(doc.id === me) return;
            const d = doc.data();
            const isOnline = d.online && (Date.now() - d.lastSeen < 60000);
            const unread = unreadCounts[doc.id] || 0;
            const item = document.createElement("div");
            item.className = `user-item ${activeTarget === doc.id ? 'active' : ''} ${isOnline ? 'is-online' : ''}`;
            item.innerHTML = `
                <div class="avatar-hex">${doc.id[0].toUpperCase()}<div class="online-glow"></div></div>
                <div style="flex:1">
                    <div style="font-weight:900; font-size:15px; color:var(--text-main); letter-spacing:1px;">${doc.id}</div>
                    <div style="font-size:9px; color:var(--primary); opacity:0.8; font-weight:800;">${isOnline ? 'ONLINE' : 'OFFLINE'}</div>
                </div>
                ${unread > 0 ? `<div class="unread-count">${unread}</div>` : ''}`;
            item.onclick = () => { activeTarget = doc.id; selectUser(); };
            list.appendChild(item);
        });
    });
}

function selectUser() {
    document.getElementById("targetName").innerText = activeTarget.toUpperCase();
    document.getElementById("hAvatar").innerText = activeTarget[0].toUpperCase();
    if(window.innerWidth <= 768) {
        document.getElementById("mainSidebar").classList.add("active-chat");
        document.getElementById("backToListBtn").style.display = "block";
    }
    loadMessages();
}

function backToList() {
    document.getElementById("mainSidebar").classList.remove("active-chat");
    document.getElementById("backToListBtn").style.display = "none";
}

function loadMessages() {
    db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
        const box = document.getElementById("messages");
        box.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            if((d.f==me && d.t==activeTarget) || (d.f==activeTarget && d.t==me)) {
                if (d.f === activeTarget && d.read === false) {
                    db.collection("messages").doc(doc.id).update({ read: true });
                }
                const m = document.createElement("div");
                m.className = `bubble ${d.f==me ? 'me' : 'other'}`;
                
                if(d.audio) {
                    m.classList.add('has-audio');
                    m.innerHTML = `<audio src="${d.audio}" controls playsinline webkit-playsinline style="filter:invert(1) opacity:0.8; height:35px; width:220px; max-width:100%;"></audio>`;
                } else if(d.image) {
                    m.classList.add('has-image');
                    m.innerHTML = `<img src="${d.image}" onclick="window.open(this.src)" alt="image">`;
                } else {
                    m.innerText = d.txt;
                }
                box.appendChild(m);
            }
        });
        box.scrollTop = box.scrollHeight;
    });
}

function sendMsg() {
    const i = document.getElementById("msgInput");
    if(!i.value || !activeTarget) return;
    db.collection("messages").add({ f: me, t: activeTarget, txt: i.value, time: Date.now(), read: false });
    i.value = "";
}

// ارسال عکس
async function sendImage(input) {
    if (!input.files || !input.files[0] || !activeTarget) return;
    const file = input.files[0];
    if (file.size > 1.5 * 1024 * 1024) return alert("سایز عکس نباید بیشتر از 1.5 مگابایت باشد.");
    
    const reader = new FileReader();
    reader.onload = (e) => {
        db.collection("messages").add({
            f: me,
            t: activeTarget,
            image: e.target.result,
            time: Date.now(),
            read: false
        });
    };
    reader.readAsDataURL(file);
    input.value = ""; 
}

const rtcConfig = { iceServers: [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }] };

// شروع تماس (صوتی یا تصویری)
async function startCall(video = false) {
    if(!activeTarget) return;
    isVideoCall = video;
    
    const ui = document.getElementById("callUI");
    ui.style.display = "flex";
    document.getElementById("cName").innerText = activeTarget.toUpperCase();
    document.getElementById("acceptBtn").style.display = "none";
    document.getElementById("muteBtn").style.display = "block";
    document.getElementById("cStatus").innerText = isVideoCall ? "VIDEO CALLING..." : "CALLING...";
    
    // تنظیمات ویدئو
    document.getElementById("localVideo").style.display = isVideoCall ? "block" : "none";
    document.getElementById("remoteVideo").style.display = isVideoCall ? "block" : "none";
    document.getElementById("callInfo").style.display = isVideoCall ? "none" : "block";

    pc = new RTCPeerConnection(rtcConfig);
    
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
            audio: true, 
            video: isVideoCall 
        });
        
        if(isVideoCall) {
            document.getElementById("localVideo").srcObject = localStream;
        }

        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    } catch(err) {
        console.error(err);
        return hangup();
    }

    pc.onicecandidate = e => {
        if(e.candidate) db.collection("calls").doc(activeTarget).collection("callerCandidates").add(e.candidate.toJSON());
    };

    pc.ontrack = e => {
        const stream = e.streams[0];
        if(isVideoCall) {
            document.getElementById("remoteVideo").srcObject = stream;
            document.getElementById("cStatus").innerText = "LIVE VIDEO";
        } else {
            document.getElementById("remoteAudio").srcObject = stream;
            document.getElementById("cStatus").innerText = "CONNECTED";
        }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await db.collection("calls").doc(activeTarget).set({ offer, from: me, video: isVideoCall });

    db.collection("calls").doc(activeTarget).onSnapshot(async snap => {
        const d = snap.data();
        if(d?.answer && !pc.currentRemoteDescription) {
            await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
        }
    });

    db.collection("calls").doc(activeTarget).collection("receiverCandidates").onSnapshot(s => {
        s.docChanges().forEach(c => { if(c.type==='added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
    });
}

function listenForCalls() {
    db.collection("calls").doc(me).onSnapshot(async snap => {
        const d = snap.data();
        if(d?.offer && !pc) {
            window.incoming = d;
            isVideoCall = d.video || false;
            
            document.getElementById("callUI").style.display = "flex";
            document.getElementById("cName").innerText = d.from.toUpperCase();
            document.getElementById("acceptBtn").style.display = "block";
            document.getElementById("muteBtn").style.display = "none";
            document.getElementById("cStatus").innerText = isVideoCall ? "INCOMING VIDEO CALL" : "INCOMING CALL";
            
            document.getElementById("localVideo").style.display = "none";
            document.getElementById("remoteVideo").style.display = "none";
            document.getElementById("callInfo").style.display = "block";
            
            document.getElementById("ring").play();
        } else if(!d && pc) hangup();
    });
}

async function answerCall() {
    document.getElementById("ring").pause();
    document.getElementById("acceptBtn").style.display = "none";
    document.getElementById("muteBtn").style.display = "block";
    document.getElementById("cStatus").innerText = "CONNECTING...";

    if(isVideoCall) {
        document.getElementById("localVideo").style.display = "block";
        document.getElementById("remoteVideo").style.display = "block";
        document.getElementById("callInfo").style.display = "none";
    }

    pc = new RTCPeerConnection(rtcConfig);
    
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
            audio: true, 
            video: isVideoCall 
        });
        
        if(isVideoCall) {
            document.getElementById("localVideo").srcObject = localStream;
        }
        
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    } catch(err) {
        console.error(err);
        return hangup();
    }

    pc.onicecandidate = e => {
        if(e.candidate) db.collection("calls").doc(me).collection("receiverCandidates").add(e.candidate.toJSON());
    };

    pc.ontrack = e => {
        const stream = e.streams[0];
        if(isVideoCall) {
            document.getElementById("remoteVideo").srcObject = stream;
        } else {
            document.getElementById("remoteAudio").srcObject = stream;
        }
        document.getElementById("cStatus").innerText = "CONNECTED";
    };

    await pc.setRemoteDescription(new RTCSessionDescription(window.incoming.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await db.collection("calls").doc(me).update({ answer });

    db.collection("calls").doc(me).collection("callerCandidates").onSnapshot(s => {
        s.docChanges().forEach(c => { if(c.type==='added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
    });
}

function toggleMute() {
    isMuted = !isMuted;
    localStream.getAudioTracks()[0].enabled = !isMuted;
    document.getElementById("muteBtn").innerText = isMuted ? "🚫" : "🎙️";
}

function hangup() {
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    if(pc) {
        pc.ontrack = null;
        pc.onicecandidate = null;
        pc.close(); 
        pc = null; 
    }
    
    db.collection("calls").doc(me).delete().catch(()=>{});
    if(activeTarget) db.collection("calls").doc(activeTarget).delete().catch(()=>{});
    
    document.getElementById("callUI").style.display = "none";
    document.getElementById("callUI").classList.remove("minimized");
    document.getElementById("ring").pause();
    
    document.getElementById("localVideo").srcObject = null;
    document.getElementById("remoteVideo").srcObject = null;
    document.getElementById("remoteAudio").srcObject = null;
    
    isVideoCall = false;
}

function toggleCallView() {
    document.getElementById("callUI").classList.toggle("minimized");
}

let rec; let chunks = [];
let audioCtx; let analyser; let animId;

async function toggleVoice() {
    const v = document.getElementById("vBtn");
    const indicator = document.getElementById("recIndicator");
    const canvas = document.getElementById("voiceWave");
    const ctx = canvas.getContext("2d");

    if(!rec || rec.state === 'inactive') {
        const s = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaStreamSource(s);
        source.connect(analyser);
        analyser.fftSize = 64;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function draw() {
            animId = requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff0055';
            let barWidth = (canvas.width / bufferLength) * 2;
            let barHeight;
            let x = 0;
            for(let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i] / 4;
                ctx.fillRect(x, canvas.height/2 - barHeight/2, barWidth, barHeight);
                x += barWidth + 1;
            }
        }
        draw();

        const options = { mimeType: MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm' };
        rec = new MediaRecorder(s, options); 
        chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
            cancelAnimationFrame(animId);
            if(audioCtx) audioCtx.close();
            const b = new Blob(chunks, { type: options.mimeType });
            const r = new FileReader(); r.readAsDataURL(b);
            r.onloadend = () => db.collection("messages").add({ f: me, t: activeTarget, audio: r.result, time: Date.now(), read: false });
            v.classList.remove("is-recording");
            indicator.style.display = "none";
            s.getTracks().forEach(track => track.stop());
        };
        rec.start(); 
        v.classList.add("is-recording"); 
        indicator.style.display = "flex"; 
    } else { rec.stop(); }
}

function logout() { 
    db.collection("users").doc(me).update({ online: false }); 
    localStorage.clear(); 
    location.reload(); 
}
