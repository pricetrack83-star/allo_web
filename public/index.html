<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLO 🚀</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#1d2671,#c33764);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.app{
  width:850px;
  height:700px;
  border-radius:25px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  display:flex;
  flex-direction:row;
  overflow:hidden;
}

#loginBox{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
}

#chatBox{
  flex:2;
  display:none;
  flex-direction:row;
}

#onlineList{
  width:200px;
  background:rgba(0,0,0,0.4);
  padding:10px;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
}

#onlineList h3{
  text-align:center;
  margin-bottom:10px;
  color:#00e676;
  text-shadow:0 0 10px #00e676;
}

.user{
  padding:10px;
  margin:5px 0;
  background:#222;
  border-radius:15px;
  cursor:pointer;
  transition:0.3s;
}

.user:hover{background:#00e676;color:black;}

#chatArea{
  flex:1;
  display:flex;
  flex-direction:column;
  margin-left:10px;
}

#messages{
  flex:1;
  overflow:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.msg{
  padding:10px;
  border-radius:15px;
  max-width:70%;
}

.me{background:#00e676;color:black;align-self:flex-end;}
.other{background:#333;}

.footer{
  display:flex;
  gap:5px;
  padding:5px;
}

.footer input{flex:1;padding:10px;border-radius:10px;border:none;}
.footer button{padding:10px;border-radius:10px;border:none;background:#00e676;color:black;cursor:pointer;transition:0.3s;}
.footer button:hover{background:#00ff80;}

input{padding:10px;border-radius:10px;border:none;margin-top:5px;width:80%;}

button{padding:10px;border-radius:10px;border:none;margin-top:5px;cursor:pointer;background:#00e676;color:black;transition:0.3s;}
button:hover{background:#00ff80;}

.header{text-align:center;font-size:24px;font-weight:bold;margin-bottom:20px;color:#00e676;text-shadow:0 0 10px #00e676;}
</style>
</head>

<body>

<div class="app">

<!-- Login -->
<div id="loginBox">
<div class="header">ALLO 🚀</div>
<input id="usernameInput" placeholder="نام کاربری">
<input id="passwordInput" type="password" placeholder="رمز عبور">
<button onclick="registerUser()">ثبت نام</button>
<button onclick="loginUser()">ورود</button>
</div>

<!-- Chat -->
<div id="chatBox">

<div id="onlineList">
<h3>آنلاین‌ها</h3>
<div id="users"></div>
</div>

<div id="chatArea">
<div id="messages"></div>
<div class="footer">
<input id="msgInput" placeholder="پیام...">
<button onclick="sendMessage()">ارسال</button>
</div>
<button onclick="logout()">خروج</button>
</div>

</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
  authDomain: "alloo-web.firebaseapp.com",
  projectId: "alloo-web",
  storageBucket: "alloo-web.firebasestorage.app",
  messagingSenderId: "132232824762",
  appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me = "";
let activeUser = "";

// 🔐 ثبت نام
function registerUser(){
  let u = document.getElementById("usernameInput").value.trim();
  let p = document.getElementById("passwordInput").value.trim();
  if(!u || !p) return alert("هر دو فیلد لازم است");

  db.collection("users").doc(u).get().then(doc=>{
    if(doc.exists){
      alert("این کاربر قبلاً ساخته شده است");
    }else{
      db.collection("users").doc(u).set({
        password: p,
        online:true
      });
      me = u;
      localStorage.setItem("allo_user", me);
      startApp();
    }
  });
}

// 🔐 ورود
function loginUser(){
  let u = document.getElementById("usernameInput").value.trim();
  let p = document.getElementById("passwordInput").value.trim();
  if(!u || !p) return alert("هر دو فیلد لازم است");

  db.collection("users").doc(u).get().then(doc=>{
    if(!doc.exists) return alert("کاربر وجود ندارد");
    if(doc.data().password !== p) return alert("رمز اشتباه است");

    me = u;
    localStorage.setItem("allo_user", me);
    db.collection("users").doc(me).update({online:true});
    startApp();
  });
}

// شروع برنامه
function startApp(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("chatBox").style.display="flex";
  loadUsers();
}

// کاربران آنلاین
function loadUsers(){
  db.collection("users").onSnapshot(snap=>{
    const usersDiv = document.getElementById("users");
    usersDiv.innerHTML="";
    snap.forEach(doc=>{
      if(doc.id===me) return;
      let div=document.createElement("div");
      div.className="user";
      div.innerText=doc.id + (doc.data().online ? " ✅" : " ❌");
      div.onclick=()=>{
        activeUser=doc.id;
        loadMessages();
      };
      usersDiv.appendChild(div);
    });
  });
}

// پیام‌ها
function loadMessages(){
  db.collection("messages")
  .orderBy("time")
  .onSnapshot(snap=>{
    const msgDiv = document.getElementById("messages");
    msgDiv.innerHTML="";
    snap.forEach(doc=>{
      let m = doc.data();
      if(!(m.from===me && m.to===activeUser) &&
         !(m.from===activeUser && m.to===me)) return;
      let div = document.createElement("div");
      div.className="msg "+(m.from===me?"me":"other");
      div.innerText = m.text;
      msgDiv.appendChild(div);
    });
    msgDiv.scrollTop = 99999;
  });
}

// ارسال پیام
function sendMessage(){
  let text = document.getElementById("msgInput").value.trim();
  if(!text || !activeUser) return;
  db.collection("messages").add({
    from: me,
    to: activeUser,
    text: text,
    time: Date.now()
  });
  document.getElementById("msgInput").value="";
}

// خروج
function logout(){
  db.collection("users").doc(me).update({online:false});
  localStorage.removeItem("allo_user");
  location.reload();
}

// ورود خودکار
window.onload=()=>{
  let saved = localStorage.getItem("allo_user");
  if(saved){
    me = saved;
    db.collection("users").doc(me).update({online:true});
    startApp();
  }
};
</script>

</body>
</html>
