<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLO | Ultimate Cyber</title> 

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root {
    --primary: #00ffcc;
    --secondary: #ff0055;
    --accent: #7d2ae8;
    --bg: #030303;
    --card: rgba(15, 15, 15, 0.7);
    --border: rgba(255, 255, 255, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }

body { 
    font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: white;
    height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center;
}

/* پس‌زمینه متحرک */
.bg-mesh {
    position: fixed; inset: 0; z-index: -1;
    background: 
        radial-gradient(circle at 10% 10%, rgba(0, 255, 204, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 90% 90%, rgba(255, 0, 85, 0.05) 0%, transparent 50%);
}

/* صفحه لاگین */
#loginScreen {
    position: fixed; inset: 0; z-index: 1000; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    backdrop-filter: blur(20px);
}

.login-box {
    width: 400px; padding: 50px; border-radius: 40px;
    background: var(--card); border: 1px solid var(--border);
    box-shadow: 0 30px 60px rgba(0,0,0,0.5); text-align: center;
}

.brand { font-size: 80px; font-weight: 900; color: var(--primary); letter-spacing: 8px; margin-bottom: 30px; text-shadow: 0 0 20px var(--primary); }

.input-field {
    width: 100%; padding: 18px; margin-bottom: 15px; border-radius: 15px;
    background: rgba(0,0,0,0.3); border: 1px solid var(--border);
    color: white; outline: none; text-align: center;
}
.input-field:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0,255,204,0.2); }

.auth-btn {
    width: 100%; padding: 18px; border-radius: 15px; border: none;
    background: var(--primary); color: #000; font-weight: 900; cursor: pointer;
}

/* اپلیکیشن اصلی */
.main-app {
    width: 95vw; height: 92vh; display: flex;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 45px; overflow: hidden; backdrop-filter: blur(40px);
}

.sidebar { width: 350px; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
.chat-area { flex: 1; display: flex; flex-direction: column; }

/* لیست کاربران و وضعیت آنلاین */
.user-card {
    padding: 20px; margin: 10px 15px; border-radius: 20px;
    display: flex; align-items: center; gap: 15px; cursor: pointer;
    border: 1px solid transparent;
}
.user-card:hover { background: rgba(255,255,255,0.03); }
.user-card.active { background: rgba(0, 255, 204, 0.05); border-color: var(--primary); }

.avatar-wrapper { position: relative; }
.avatar { 
    width: 50px; height: 50px; border-radius: 15px; background: #111;
    display: flex; align-items: center; justify-content: center; font-weight: bold;
}
.online-indicator {
    position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px;
    border-radius: 50%; border: 3px solid #0a0a0a; background: #333;
}
.is-online .online-indicator { background: var(--primary); box-shadow: 0 0 10px var(--primary); }
.is-online .avatar { box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); border: 1px solid var(--primary); }

/* چت */
#messages { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.msg { padding: 15px 22px; border-radius: 22px; max-width: 75%; font-size: 14px; position: relative; }
.msg.me { align-self: flex-end; background: var(--primary); color: #000; font-weight: 600; border-bottom-right-radius: 4px; }
.msg.other { align-self: flex-start; background: #1a1a1a; border: 1px solid var(--border); border-bottom-left-radius: 4px; }

/* صفحه تماس */
#callOverlay {
    position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.9);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    backdrop-filter: blur(50px);
}
.call-btn { width: 80px; height: 80px; border-radius: 50%; border: none; cursor: pointer; font-size: 25px; }

audio { display: none; }
</style>
</head>
<body>

<div class="bg-mesh"></div>

<div id="loginScreen">
    <div class="brand">ALLO</div>
    <div class="login-box">
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button id="modeLog" onclick="setMode('login')" style="flex:1; background:var(--primary); border:none; padding:10px; border-radius:10px; cursor:pointer;">ورود</button>
            <button id="modeReg" onclick="setMode('register')" style="flex:1; background:rgba(255,255,255,0.1); border:none; color:white; padding:10px; border-radius:10px; cursor:pointer;">ثبت‌نام</button>
        </div>
        <input id="uID" class="input-field" placeholder="آی‌دی کاربری">
        <input id="uPass" type="password" class="input-field" placeholder="رمز عبور">
        <button class="auth-btn" onclick="handleAuth()">اتصال به شبکه</button>
    </div>
</div>

<div class="main-app">
    <div class="sidebar">
        <div style="padding:30px; border-bottom:1px solid var(--border);"><h2 style="color:var(--primary)">ALLO</h2></div>
        <div id="userList" style="flex:1; overflow-y:auto;"></div>
        <div style="padding:20px; font-size:12px; opacity:0.5; border-top:1px solid var(--border)">ID: <span id="myID"></span></div>
    </div>
    <div class="chat-area">
        <div id="chatHeader" style="padding:20px 40px; display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.2)">
            <h3 id="targetName">Select a Terminal</h3>
            <button id="callBtn" onclick="startCall()" style="background:none; border:1px solid var(--primary); color:var(--primary); padding:10px 20px; border-radius:12px; cursor:pointer;">Call 📞</button>
        </div>
        <div id="messages"></div>
        <div style="padding:25px; display:flex; gap:15px;">
            <input id="msgInput" class="input-field" style="margin:0" placeholder="Type encrypted message..." onkeypress="if(event.key=='Enter') sendMsg()">
            <button onclick="toggleVoice()" id="vBtn" style="background:none; border:1px solid var(--secondary); color:var(--secondary); padding:0 20px; border-radius:15px; cursor:pointer">🎤</button>
            <button onclick="sendMsg()" style="background:var(--primary); border:none; padding:0 30px; border-radius:15px; cursor:pointer; font-weight:bold">SEND</button>
        </div>
    </div>
</div>

<div id="callOverlay">
    <div id="callAvatar" style="width:120px; height:120px; background:var(--primary); border-radius:50%; margin-bottom:20px; display:flex; align-items:center; justify-content:center; font-size:50px; color:#000">👤</div>
    <h2 id="callName">User</h2>
    <p id="callStatus" style="color:var(--primary); margin:20px 0;">CONNECTION ESTABLISHING...</p>
    <div style="display:flex; gap:30px;">
        <button id="acceptBtn" class="call-btn" style="background:#2ecc71" onclick="answerCall()">✅</button>
        <button class="call-btn" style="background:var(--secondary)" onclick="hangup()">❌</button>
    </div>
</div>

<audio id="ring" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_ringtones.ogg" loop></audio>
<audio id="remoteAudio" autoplay></audio>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
    authDomain: "alloo-web.firebaseapp.com",
    projectId: "alloo-web",
    storageBucket: "alloo-web.appspot.com",
    messagingSenderId: "132232824762",
    appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me = localStorage.getItem("alloo_uid");
let activeTarget = "";
let mode = 'login';
let pc; 
let localStream;

if(me) { document.getElementById("loginScreen").style.display = "none"; initApp(); }

function setMode(m) {
    mode = m;
    document.getElementById('modeLog').style.background = m === 'login' ? 'var(--primary)' : 'rgba(255,255,255,0.1)';
    document.getElementById('modeReg').style.background = m === 'register' ? 'var(--primary)' : 'rgba(255,255,255,0.1)';
}

async function handleAuth() {
    const id = document.getElementById("uID").value.trim().toLowerCase();
    const ps = document.getElementById("uPass").value.trim();
    if(!id) return;

    const userDoc = await db.collection("users").doc(id).get();
    if(mode === 'register') {
        if(userDoc.exists) return alert("آی‌دی تکراری");
        await db.collection("users").doc(id).set({ pass: ps, online: true, lastSeen: Date.now() });
    } else {
        if(!userDoc.exists || userDoc.data().pass !== ps) return alert("خطا در ورود");
        await db.collection("users").doc(id).update({ online: true, lastSeen: Date.now() });
    }
    localStorage.setItem("alloo_uid", id);
    location.reload();
}

function initApp() {
    document.getElementById("myID").innerText = me;
    
    // آپدیت وضعیت آنلاین هر ۳۰ ثانیه
    setInterval(() => db.collection("users").doc(me).update({ online: true, lastSeen: Date.now() }), 30000);

    db.collection("users").onSnapshot(snap => {
        const list = document.getElementById("userList");
        list.innerHTML = "";
        snap.forEach(doc => {
            if(doc.id === me) return;
            const data = doc.data();
            const isOnline = data.online && (Date.now() - data.lastSeen < 60000);
            const card = document.createElement("div");
            card.className = `user-card ${activeTarget === doc.id ? 'active' : ''} ${isOnline ? 'is-online' : ''}`;
            card.innerHTML = `
                <div class="avatar-wrapper">
                    <div class="avatar">${doc.id[0].toUpperCase()}</div>
                    <div class="online-indicator"></div>
                </div>
                <div style="flex:1">
                    <div style="font-weight:bold">${doc.id}</div>
                    <div style="font-size:10px; opacity:0.5">${isOnline ? 'ONLINE' : 'OFFLINE'}</div>
                </div>
            `;
            card.onclick = () => { activeTarget = doc.id; selectUser(); };
            list.appendChild(card);
        });
    });
    listenForCalls();
}

function selectUser() {
    document.getElementById("targetName").innerText = activeTarget;
    loadMessages();
}

function loadMessages() {
    db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
        const box = document.getElementById("messages");
        box.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            if((d.f==me && d.t==activeTarget) || (d.f==activeTarget && d.t==me)) {
                const m = document.createElement("div");
                m.className = `msg ${d.f==me ? 'me' : 'other'}`;
                m.innerText = d.txt || "Voice Message";
                if(d.audio) m.innerHTML = `<audio src="${d.audio}" controls style="filter:invert(1)"></audio>`;
                box.appendChild(m);
            }
        });
        box.scrollTop = box.scrollHeight;
    });
}

function sendMsg() {
    const i = document.getElementById("msgInput");
    if(!i.value || !activeTarget) return;
    db.collection("messages").add({ f: me, t: activeTarget, txt: i.value, time: Date.now() });
    i.value = "";
}

// --- سیستم تماس کاملاً اصلاح شده ---
const rtcConfig = { iceServers: [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }] };

async function startCall() {
    if(!activeTarget) return;
    showCallUI(activeTarget, false);
    
    pc = new RTCPeerConnection(rtcConfig);
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    pc.onicecandidate = e => {
        if(e.candidate) db.collection("calls").doc(activeTarget).collection("callerCandidates").add(e.candidate.toJSON());
    };

    pc.ontrack = e => document.getElementById("remoteAudio").srcObject = e.streams[0];

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await db.collection("calls").doc(activeTarget).set({ offer, from: me });

    db.collection("calls").doc(activeTarget).onSnapshot(async snap => {
        const data = snap.data();
        if(data?.answer && !pc.currentRemoteDescription) {
            await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            document.getElementById("callStatus").innerText = "CONNECTED";
        }
    });

    db.collection("calls").doc(activeTarget).collection("receiverCandidates").onSnapshot(s => {
        s.docChanges().forEach(c => { if(c.type==='added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
    });
}

function listenForCalls() {
    db.collection("calls").doc(me).onSnapshot(async snap => {
        const data = snap.data();
        if(data?.offer && !pc) {
            window.incoming = data;
            showCallUI(data.from, true);
            document.getElementById("ring").play();
        } else if(!data && pc) hangup();
    });
}

async function answerCall() {
    document.getElementById("ring").pause();
    document.getElementById("acceptBtn").style.display = "none";
    pc = new RTCPeerConnection(rtcConfig);
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    pc.onicecandidate = e => {
        if(e.candidate) db.collection("calls").doc(me).collection("receiverCandidates").add(e.candidate.toJSON());
    };

    pc.ontrack = e => document.getElementById("remoteAudio").srcObject = e.streams[0];

    await pc.setRemoteDescription(new RTCSessionDescription(window.incoming.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await db.collection("calls").doc(me).update({ answer });

    db.collection("calls").doc(me).collection("callerCandidates").onSnapshot(s => {
        s.docChanges().forEach(c => { if(c.type==='added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
    });
}

function showCallUI(name, incoming) {
    document.getElementById("callOverlay").style.display = "flex";
    document.getElementById("callName").innerText = name;
    document.getElementById("acceptBtn").style.display = incoming ? "block" : "none";
}

function hangup() {
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    if(pc) pc.close(); pc = null;
    db.collection("calls").doc(me).delete();
    if(activeTarget) db.collection("calls").doc(activeTarget).delete();
    document.getElementById("callOverlay").style.display = "none";
    document.getElementById("ring").pause();
}

// ویس مسیج
let rec; let chunks = [];
async function toggleVoice() {
    const v = document.getElementById("vBtn");
    if(!rec || rec.state === 'inactive') {
        const s = await navigator.mediaDevices.getUserMedia({ audio: true });
        rec = new MediaRecorder(s);
        chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
            const b = new Blob(chunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(b);
            reader.onloadend = () => db.collection("messages").add({ f: me, t: activeTarget, audio: reader.result, time: Date.now() });
        };
        rec.start(); v.style.background = "var(--secondary)";
    } else { rec.stop(); v.style.background = "none"; }
}
</script>
</body>
</html>
