<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLOO PRO</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- WaveSurfer -->
<script src="https://unpkg.com/wavesurfer.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#141e30,#243b55);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.container{
  width:380px;
  height:640px;
  border-radius:30px;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.05);
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header{
  padding:15px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
  background:linear-gradient(90deg,#00e676,#00c853);
  color:black;
}

#login,#chat{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:15px;
}

#chat{display:none;}

input{
  padding:12px;
  border:none;
  border-radius:15px;
  margin-top:10px;
  background:rgba(255,255,255,0.1);
  color:white;
  outline:none;
}

button{
  padding:12px;
  border:none;
  border-radius:15px;
  margin-top:10px;
  background:linear-gradient(90deg,#00e676,#00c853);
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{ transform:scale(1.05); }

#users{
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.user{
  padding:6px 12px;
  border-radius:20px;
  background:rgba(255,255,255,0.1);
  font-size:13px;
  cursor:pointer;
}

.online{
  border:1px solid #00e676;
}

#messages{
  flex:1;
  overflow:auto;
}

.msg{
  margin:8px 0;
  padding:12px;
  border-radius:20px;
  max-width:75%;
}

.me{
  background:linear-gradient(135deg,#00e676,#00c853);
  color:black;
  align-self:flex-end;
}

.other{
  background:rgba(255,255,255,0.1);
}

.wave{
  height:50px;
  margin-top:5px;
}

.footer{
  display:flex;
  gap:5px;
}

.footer input{ flex:1; }

.voice-btn{
  background:linear-gradient(135deg,#ff5252,#ff1744);
  color:white;
}
</style>
</head>

<body>

<div class="container">

<div class="header">ALLOO ✨</div>

<div id="login">
  <input id="name" placeholder="اسمتو بنویس">
  <button onclick="login()">ورود</button>
</div>

<div id="chat">

  <div id="users"></div>

  <div id="messages"></div>

  <div class="footer">
    <input id="msg" placeholder="پیام...">
    <button onclick="send()">➤</button>
    <button onclick="record()" class="voice-btn">🎤</button>
  </div>

  <button onclick="logout()">خروج</button>

</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
  authDomain: "alloo-web.firebaseapp.com",
  projectId: "alloo-web",
  storageBucket: "alloo-web.firebasestorage.app",
  messagingSenderId: "132232824762",
  appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me="";
let activeUser="";
let mediaRecorder;
let chunks=[];

function login(){
  const name=document.getElementById("name").value.trim();
  if(!name)return alert("اسم بزن 😐");

  me=name;
  localStorage.setItem("allo_user",name);

  db.collection("users").doc(me).set({
    online:true,
    lastSeen:Date.now()
  });

  start();
}

function start(){
  document.getElementById("login").style.display="none";
  document.getElementById("chat").style.display="flex";

  loadUsers();
  loadMessages();
}

function loadUsers(){
  db.collection("users").onSnapshot(snap=>{
    const box=document.getElementById("users");
    box.innerHTML="";

    snap.forEach(doc=>{
      const u=doc.id;
      if(u===me)return;

      const data=doc.data();

      const div=document.createElement("div");
      div.className="user "+(data.online?"online":"");
      div.innerText=u;

      div.onclick=()=>{activeUser=u;};

      box.appendChild(div);
    });
  });
}

function loadMessages(){
  db.collection("messages").orderBy("time")
  .onSnapshot(snap=>{
    const box=document.getElementById("messages");
    box.innerHTML="";

    snap.forEach(doc=>{
      const m=doc.data();

      if(!(m.from===me && m.to===activeUser) &&
         !(m.from===activeUser && m.to===me)) return;

      const div=document.createElement("div");
      div.className="msg "+(m.from===me?"me":"other");

      if(m.text){
        div.innerHTML=`<b>${m.from}</b><br>${m.text}`;
      }

      if(m.audio){
        div.innerHTML=`<b>${m.from}</b>`;
        const wave=document.createElement("div");
        wave.className="wave";
        div.appendChild(wave);

        const ws=WaveSurfer.create({
          container:wave,
          waveColor:'#00e676',
          progressColor:'#fff',
          height:50
        });

        ws.load(m.audio);
        wave.onclick=()=>ws.playPause();
      }

      box.appendChild(div);
    });

    box.scrollTop=box.scrollHeight;
  });
}

function send(){
  const txt=document.getElementById("msg").value.trim();
  if(!txt || !activeUser) return alert("یه نفر انتخاب کن");

  db.collection("messages").add({
    from:me,
    to:activeUser,
    text:txt,
    time:Date.now()
  });

  document.getElementById("msg").value="";
}

async function record(){
  if(!activeUser) return alert("اول یوزر انتخاب کن");

  if(!mediaRecorder){
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream);

    mediaRecorder.ondataavailable=e=>chunks.push(e.data);

    mediaRecorder.onstop=()=>{
      const blob=new Blob(chunks,{type:'audio/webm'});
      chunks=[];

      const reader=new FileReader();
      reader.readAsDataURL(blob);

      reader.onloadend=()=>{
        db.collection("messages").add({
          from:me,
          to:activeUser,
          audio:reader.result,
          time:Date.now()
        });
      };
    };

    mediaRecorder.start();
    event.target.innerText="⏹";
  }else{
    mediaRecorder.stop();
    mediaRecorder=null;
    event.target.innerText="🎤";
  }
}

function logout(){
  db.collection("users").doc(me).update({
    online:false,
    lastSeen:Date.now()
  });

  localStorage.removeItem("allo_user");
  location.reload();
}

window.onload=()=>{
  const user=localStorage.getItem("allo_user");
  if(user){
    me=user;

    db.collection("users").doc(me).set({
      online:true,
      lastSeen:Date.now()
    });

    start();
  }
};
</script>

</body>
</html>
