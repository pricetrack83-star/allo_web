<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLOO - Pro Messenger</title> 
<link rel="icon" type="image/png" href="logo.png">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/wavesurfer.js"></script>

<style>
/* --- متغیرها و تنظیمات اصلی --- */
:root {
    --primary-color: #00ff80;
    --secondary-color: #ff4081;
    --dark-bg: #0a0a0a;
    --glass: rgba(255, 255, 255, 0.05);
    --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

body { 
    margin: 0; 
    font-family: 'Vazirmatn', sans-serif; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    transition: background 0.5s ease; 
    overflow: hidden; 
}

body.dark { background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); color: white; }
body.light { background: radial-gradient(circle at center, #f5f5f5 0%, #ccc 100%); color: #111; }

/* --- استایل بدنه اپلیکیشن --- */
.app { 
    width: 1100px; 
    height: 800px; 
    border-radius: 40px; 
    backdrop-filter: blur(30px); 
    display: flex; 
    overflow: hidden; 
    transition: var(--transition); 
    box-shadow: 0 40px 100px rgba(0,0,0,0.6); 
    position: relative; 
    border: 1px solid rgba(255,255,255,0.1);
}

body.light .app { background: rgba(255,255,255,0.9); border: 1px solid rgba(0,0,0,0.1); }
body.dark .app { background: rgba(20,20,20,0.8); }

/* --- بخش لاگین --- */
#loginBox { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    gap: 20px; 
    animation: slideUp 0.8s ease;
}

@keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

.login-container {
    background: var(--glass);
    padding: 50px;
    border-radius: 35px;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 350px;
    text-align: center;
}

#loginBox input { 
    width: 100%; 
    padding: 18px; 
    border-radius: 15px; 
    border: none; 
    background: rgba(255,255,255,0.1); 
    color: inherit; 
    outline: none; 
    box-sizing: border-box;
    font-family: inherit;
}

#loginBox button { 
    width: 100%; 
    padding: 16px; 
    border-radius: 15px; 
    border: none; 
    background: linear-gradient(135deg, var(--primary-color), #00e676); 
    color: black; 
    font-weight: 900; 
    cursor: pointer; 
    transition: var(--transition);
}

#loginBox button:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,255,128,0.3); }

/* --- بخش چت --- */
#chatBox { display: none; flex: 1; flex-direction: row; transition: 0.5s; }

#onlineList { 
    width: 300px; 
    padding: 25px; 
    display: flex; 
    flex-direction: column; 
    background: rgba(0,0,0,0.3); 
    border-left: 1px solid rgba(255,255,255,0.05); 
}

#chatArea { flex: 1; display: flex; flex-direction: column; background: transparent; position: relative; }

/* لیست کاربران */
.user-card {
    padding: 15px 20px;
    margin-bottom: 10px;
    border-radius: 20px;
    background: var(--glass);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.3s;
    border: 1px solid transparent;
}
.user-card:hover { background: rgba(255,255,255,0.1); }
.user-card.active { border-color: var(--primary-color); background: rgba(0,255,128,0.1); }

.status-indicator { width: 10px; height: 10px; border-radius: 50%; }
.online-dot { background: var(--primary-color); box-shadow: 0 0 10px var(--primary-color); }
.offline-dot { background: #555; }

/* پیام‌ها */
#messages { 
    flex: 1; 
    overflow-y: auto; 
    display: flex; 
    flex-direction: column; 
    gap: 15px; 
    padding: 30px; 
    scroll-behavior: smooth;
}

.msg { 
    padding: 14px 20px; 
    border-radius: 25px; 
    max-width: 70%; 
    font-size: 14.5px; 
    line-height: 1.6; 
    position: relative;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    animation: msgPop 0.3s ease-out;
}

@keyframes msgPop { from { opacity: 0; scale: 0.8; } to { opacity: 1; scale: 1; } }

.me { 
    background: linear-gradient(135deg, var(--primary-color), #00e676); 
    color: black; 
    align-self: flex-end; 
    border-bottom-right-radius: 4px; 
}

.other { 
    background: rgba(255,255,255,0.1); 
    color: white; 
    align-self: flex-start; 
    border-bottom-left-radius: 4px; 
}
body.light .other { background: #e0e0e0; color: #111; }

/* فوتر و ضبط ویس */
.footer { 
    display: flex; 
    gap: 12px; 
    padding: 25px; 
    background: rgba(0,0,0,0.2); 
    align-items: center; 
}

.input-wrapper {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
}

#msgInput { 
    width: 100%;
    padding: 15px 25px; 
    border-radius: 30px; 
    border: none; 
    background: rgba(255,255,255,0.08); 
    color: inherit; 
    outline: none; 
    font-family: inherit;
}

.btn-icon { 
    width: 50px; 
    height: 50px; 
    border-radius: 50%; 
    border: none; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    transition: 0.3s; 
    font-size: 20px; 
}

.btn-send { background: var(--primary-color); color: black; }
.btn-record { background: var(--secondary-color); color: white; }
.btn-record.recording { animation: pulseRec 1.2s infinite; background: #ff1744; }

@keyframes pulseRec { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 23, 68, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(255, 23, 68, 0); } 100% { transform: scale(1); } }

#recordingStatus {
    display: none;
    position: absolute;
    bottom: 100px;
    right: 30px;
    left: 30px;
    padding: 15px;
    background: var(--secondary-color);
    border-radius: 20px;
    color: white;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
}

/* پاپ‌آپ تماس */
#callBox {
    display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(40px);
    padding: 50px; border-radius: 60px; color: white; z-index: 5000; width: 320px;
    text-align: center; border: 1px solid var(--primary-color);
}

.call-anim { 
    width: 100px; height: 100px; background: var(--primary-color); border-radius: 50%; 
    margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; 
    font-size: 40px; animation: ring 1.5s infinite; 
}

@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 128, 0.5); } 100% { box-shadow: 0 0 0 40px rgba(0, 255, 128, 0); } }

/* Scrollbar */
#messages::-webkit-scrollbar { width: 6px; }
#messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

audio { height: 35px; width: 220px; filter: hue-rotate(90deg); }
</style>
</head>
<body class="dark">

<div class="app">
    <div id="loginBox">
        <div style="font-size:60px; font-weight:900; color:var(--primary-color); letter-spacing:10px;">ALLOO</div>
        <div class="login-container">
            <input id="userIDInput" placeholder="شناسه کاربری (ID)">
            <input id="passwordInput" type="password" placeholder="رمز عبور">
            <button onclick="loginUser()">ورود به حساب</button>
            <button onclick="registerUser()" style="background:transparent; color:var(--primary-color); border:2px solid var(--primary-color);">ساخت حساب جدید</button>
        </div>
    </div>

    <div id="chatBox">
        <div id="onlineList">
            <h2 style="color:var(--primary-color); margin-bottom:30px; text-align:center;">دوستان</h2>
            <div id="users"></div>
            
            <div style="margin-top:auto; padding:20px; background:rgba(255,255,255,0.05); border-radius:20px;">
                <div id="userID" style="font-size:14px; opacity:0.7; margin-bottom:10px;">ID: -</div>
                <button onclick="logout()" style="color:var(--secondary-color); background:none; border:none; cursor:pointer; font-weight:bold;">خروج ⬅</button>
            </div>
        </div>

        <div id="chatArea">
            <div id="chatHeader" style="padding:20px 30px; background:rgba(0,0,0,0.1); display:flex; justify-content:space-between; align-items:center;">
                <h3 id="activeChatName" style="margin:0;">انتخاب مخاطب...</h3>
                <div style="display:flex; gap:15px;">
                    <button class="btn-icon" style="background:var(--glass);" onclick="startCall()">📞</button>
                    <button class="btn-icon" style="background:var(--glass);" onclick="toggleTheme()">🌗</button>
                </div>
            </div>

            <div id="messages"></div>

            <div id="recordingStatus">
                <span>🎤 در حال ضبط...</span>
                <b id="recTimerDisplay">00:00</b>
            </div>

            <div class="footer">
                <div class="input-wrapper">
                    <input id="msgInput" placeholder="پیام خود را بنویسید..." onkeypress="if(event.key=='Enter') sendMessage()">
                </div>
                <button id="recordBtn" class="btn-icon btn-record" onclick="toggleRecording()">🎤</button>
                <button class="btn-icon btn-send" onclick="sendMessage()">✈</button>
            </div>
        </div>
    </div>

    <div id="callBox">
        <div class="call-anim">📞</div>
        <h2 id="callerName">User</h2>
        <p id="callStatus">در حال برقراری تماس...</p>
        
        <div id="incomingActions" style="display:none; gap:20px; justify-content:center; margin-top:30px;">
             <button class="btn-icon" style="background:#4caf50; width:70px; height:70px;" onclick="acceptCall()">✅</button>
             <button class="btn-icon" style="background:#f44336; width:70px; height:70px;" onclick="rejectCall()">❌</button>
        </div>
        <div id="inCallActions" style="display:none; gap:20px; justify-content:center; margin-top:30px;">
             <button id="muteBtn" class="btn-icon" style="background:#555;" onclick="toggleMute()">🎙️</button>
             <button class="btn-icon" style="background:#f44336; width:70px; height:70px;" onclick="endCall()">📞</button>
        </div>
    </div>
</div>

<audio id="ringTone" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_ringtones.ogg" loop></audio>

<script>
// --- فایربیس ---
const firebaseConfig = {
    apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
    authDomain: "alloo-web.firebaseapp.com",
    projectId: "alloo-web",
    storageBucket: "alloo-web.appspot.com",
    messagingSenderId: "132232824762",
    appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me="", activeUser="", recorder=null, recChunks=[], recInterval=null, recSeconds=0;
let localStream=null, peerConnection=null, currentCallDocId = null, isMuted = false;
const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

// چک کردن ورود قبلی
if(localStorage.getItem("allo_user")){ 
    me=localStorage.getItem("allo_user"); 
    startApp(); 
}

function startApp(){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("chatBox").style.display="flex";
    document.getElementById("userID").innerText="ID: " + me;
    loadUsers();
    listenForCalls();
}

// --- مدیریت ورود و خروج ---
function loginUser(){
    let id=document.getElementById("userIDInput").value.trim();
    let p=document.getElementById("passwordInput").value.trim();
    if(!id || !p) return alert("فیلدها را پر کنید");
    db.collection("users").doc(id).get().then(doc => {
        if(doc.exists && doc.data().password === p){
            me=id; localStorage.setItem("allo_user", me);
            db.collection("users").doc(me).update({online:true});
            startApp();
        } else alert("کاربر یافت نشد یا رمز اشتباه است");
    });
}

function registerUser(){
    let id=document.getElementById("userIDInput").value.trim();
    let p=document.getElementById("passwordInput").value.trim();
    if(!id || !p) return alert("اطلاعات را وارد کنید");
    db.collection("users").doc(id).set({username: id, password: p, online: true}).then(() => {
        me=id; localStorage.setItem("allo_user", me);
        startApp();
    });
}

function loadUsers(){
    db.collection("users").onSnapshot(snap => {
        const div = document.getElementById("users"); div.innerHTML = "";
        snap.forEach(doc => {
            if(doc.id === me) return;
            let userEl = document.createElement("div");
            userEl.className = `user-card ${activeUser === doc.id ? 'active' : ''}`;
            userEl.innerHTML = `
                <b>${doc.id}</b>
                <div class="status-indicator ${doc.data().online?'online-dot':'offline-dot'}"></div>
            `;
            userEl.onclick = () => { 
                activeUser = doc.id; 
                document.getElementById("activeChatName").innerText = activeUser;
                loadMessages(); 
                loadUsers(); // برای رفرش کردن کلاس active
            };
            div.appendChild(userEl);
        });
    });
}

function loadMessages(){
    if(!activeUser) return;
    db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
        const msgDiv = document.getElementById("messages");
        msgDiv.innerHTML = "";
        snap.forEach(doc => {
            let m = doc.data();
            if((m.from==me && m.to==activeUser) || (m.from==activeUser && m.to==me)){
                let div = document.createElement("div");
                div.className = "msg " + (m.from==me ? "me" : "other");
                
                if(m.audio){
                    let aud = document.createElement("audio");
                    aud.src = m.audio; aud.controls = true;
                    div.appendChild(aud);
                } else {
                    div.innerText = m.text;
                }
                msgDiv.appendChild(div);
            }
        });
        msgDiv.scrollTop = msgDiv.scrollHeight;
    });
}

function sendMessage(){
    let input = document.getElementById("msgInput");
    if(!input.value.trim() || !activeUser) return;
    db.collection("messages").add({
        from: me, to: activeUser, text: input.value, time: firebase.firestore.FieldValue.serverTimestamp()
    });
    input.value = "";
}

// ==================== بخش ویس (بدون باگ و بهینه‌سازی شده) ====================
async function toggleRecording(){
    if(recorder && recorder.state == "recording"){
        stopAndSendVoice();
    } else {
        startVoiceRecording();
    }
}

async function startVoiceRecording(){
    try {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        // استفاده از MIME مناسب برای اکثر مرورگرها
        recorder = new MediaRecorder(stream);
        recChunks = [];
        
        recorder.ondataavailable = e => { if(e.data.size > 0) recChunks.push(e.data); };
        
        recorder.onstop = async () => {
            const blob = new Blob(recChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
                const base64 = reader.result;
                // جلوگیری از ارسال ویس‌های خالی
                if(activeUser && base64.length > 100){
                    db.collection("messages").add({
                        from: me, to: activeUser, audio: base64, time: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            };
            stream.getTracks().forEach(t => t.stop());
        };

        recorder.start();
        startTimer();
        document.getElementById("recordBtn").classList.add("recording");
        document.getElementById("recordingStatus").style.display = "flex";
    } catch (err) {
        alert("دسترسی به میکروفون مسدود است یا دستگاه یافت نشد.");
    }
}

function stopAndSendVoice(){
    recorder.stop();
    stopTimer();
    document.getElementById("recordBtn").classList.remove("recording");
    document.getElementById("recordingStatus").style.display = "none";
}

function startTimer(){
    recSeconds = 0;
    recInterval = setInterval(() => {
        recSeconds++;
        let m = Math.floor(recSeconds/60).toString().padStart(2,'0');
        let s = (recSeconds%60).toString().padStart(2,'0');
        document.getElementById("recTimerDisplay").innerText = `${m}:${s}`;
    }, 1000);
}

function stopTimer(){ clearInterval(recInterval); }

// ==================== مدیریت تماس (WebRTC) ====================
async function startCall(){
    if(!activeUser) return alert("ابتدا مخاطبی انتخاب کنید");
    currentCallDocId = activeUser;
    localStream = await navigator.mediaDevices.getUserMedia({audio:true});
    peerConnection = new RTCPeerConnection(config);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.onicecandidate = e => {
        if(e.candidate) db.collection("calls").doc(currentCallDocId).collection("candidates").add(e.candidate.toJSON());
    };

    peerConnection.ontrack = e => {
        let aud = document.getElementById("remoteAudio") || document.createElement("audio");
        aud.id = "remoteAudio"; aud.srcObject = e.streams[0]; aud.autoplay = true; document.body.appendChild(aud);
    };

    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    await db.collection("calls").doc(currentCallDocId).set({ offer, from: me, status: "calling" });

    document.getElementById("callBox").style.display = "block";
    document.getElementById("callerName").innerText = activeUser;
    document.getElementById("inCallActions").style.display = "flex";
    document.getElementById("incomingActions").style.display = "none";
}

function listenForCalls(){
    db.collection("calls").doc(me).onSnapshot(async doc => {
        let data = doc.data();
        if(!data) { if(peerConnection) cleanupCall(); return; }
        if(data.offer && !peerConnection){
            currentCallDocId = me;
            window.incomingData = data;
            document.getElementById("callBox").style.display = "block";
            document.getElementById("callerName").innerText = data.from;
            document.getElementById("incomingActions").style.display = "flex";
            document.getElementById("inCallActions").style.display = "none";
            document.getElementById("ringTone").play();
        }
        if(data.answer && peerConnection) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        }
    });
}

async function acceptCall(){
    document.getElementById("ringTone").pause();
    localStream = await navigator.mediaDevices.getUserMedia({audio:true});
    peerConnection = new RTCPeerConnection(config);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = e => {
        let aud = document.getElementById("remoteAudio") || document.createElement("audio");
        aud.id = "remoteAudio"; aud.srcObject = e.streams[0]; aud.autoplay = true; document.body.appendChild(aud);
    };

    await peerConnection.setRemoteDescription(new RTCSessionDescription(window.incomingData.offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    await db.collection("calls").doc(me).update({ answer });

    document.getElementById("incomingActions").style.display = "none";
    document.getElementById("inCallActions").style.display = "flex";
}

function toggleMute(){
    isMuted = !isMuted;
    localStream.getAudioTracks()[0].enabled = !isMuted;
    document.getElementById("muteBtn").style.background = isMuted ? "#ff9800" : "#555";
}

async function endCall(){
    if(currentCallDocId) await db.collection("calls").doc(currentCallDocId).delete();
    cleanupCall();
}

function cleanupCall(){
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    if(peerConnection) peerConnection.close();
    peerConnection = null;
    document.getElementById("callBox").style.display = "none";
    document.getElementById("ringTone").pause();
    let ra = document.getElementById("remoteAudio"); if(ra) ra.remove();
}

function rejectCall(){ endCall(); }
function logout(){ db.collection("users").doc(me).update({online:false}); localStorage.clear(); location.reload(); }
function toggleTheme(){ document.body.className = document.body.className=='dark'?'light':'dark'; }
</script>
</body>
</html>
