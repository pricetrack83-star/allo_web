<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLO | Next-Gen Cyber Terminal</title> 

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;500;800;900&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root {
    --primary: #00ffcc;
    --primary-glow: rgba(0, 255, 204, 0.4);
    --secondary: #ff0055;
    --accent: #bc13fe;
    --dark-bg: #020202;
    --glass: rgba(255, 255, 255, 0.03);
    --border: rgba(255, 255, 255, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }

body { 
    font-family: 'Vazirmatn', sans-serif; background: var(--dark-bg); color: white;
    height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center;
}

/* --- پس‌زمینه متحرک کوانتومی --- */
.bg-canvas {
    position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(circle at 50% 50%, #0a0f1a 0%, #000 100%);
}
.particle {
    position: absolute; border-radius: 50%; background: var(--primary);
    filter: blur(80px); opacity: 0.1; animation: float 20s infinite alternate;
}

@keyframes float {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(100px, 100px) scale(1.5); }
}

/* --- استایل صفحه لاگین --- */
#loginScreen {
    position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    backdrop-filter: blur(25px);
}

.login-card {
    width: 420px; padding: 60px 40px; border-radius: 50px;
    background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
    border: 1px solid var(--border); box-shadow: 0 50px 100px rgba(0,0,0,0.8);
    text-align: center; position: relative;
}

.login-card::before {
    content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: linear-gradient(45deg, transparent, var(--primary), transparent);
    z-index: -1; border-radius: 52px; opacity: 0.2;
}

.brand-title {
    font-family: 'Orbitron', sans-serif; font-size: 90px; font-weight: 900;
    color: var(--primary); letter-spacing: 12px; margin-bottom: 40px;
    text-shadow: 0 0 30px var(--primary-glow);
}

.auth-mode-switch {
    display: flex; background: rgba(0,0,0,0.5); border-radius: 20px;
    margin-bottom: 30px; padding: 6px; border: 1px solid var(--border);
}
.mode-btn {
    flex: 1; padding: 12px; border-radius: 15px; cursor: pointer;
    font-weight: 800; font-size: 14px; color: #666; border: none; background: none;
}
.mode-btn.active { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary-glow); }

.input-container { margin-bottom: 20px; position: relative; }
.input-container input {
    width: 100%; padding: 20px 25px; border-radius: 20px;
    background: rgba(0,0,0,0.6); border: 1px solid var(--border);
    color: #fff; font-size: 16px; outline: none; text-align: center;
}
.input-container input:focus {
    border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
    background: rgba(0, 255, 204, 0.02);
}

.action-btn {
    width: 100%; padding: 20px; border-radius: 20px; border: none;
    background: linear-gradient(90deg, var(--primary), #00ccff);
    color: #000; font-weight: 900; font-size: 18px; cursor: pointer;
    box-shadow: 0 10px 30px var(--primary-glow);
}

/* --- بدنه اصلی اپلیکیشن --- */
.app-frame {
    width: 96vw; height: 94vh; display: flex;
    background: rgba(10, 10, 10, 0.4); border: 1px solid var(--border);
    border-radius: 60px; backdrop-filter: blur(60px); overflow: hidden;
}

.sidebar { width: 380px; border-left: 1px solid var(--border); display: flex; flex-direction: column; }

.user-item {
    padding: 22px 30px; margin: 8px 20px; border-radius: 25px;
    display: flex; align-items: center; gap: 18px; cursor: pointer;
}
.user-item:hover { background: rgba(255,255,255,0.05); }
.user-item.active { background: rgba(0, 255, 204, 0.08); border: 1px solid rgba(0, 255, 204, 0.2); }

.avatar-hex {
    width: 55px; height: 55px; background: #111; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron'; font-weight: 900; color: var(--primary);
    border: 1px solid var(--border); position: relative;
}

.online-glow {
    position: absolute; -1px; -1px; width: 14px; height: 14px;
    background: var(--primary); border-radius: 50%; border: 3px solid #0a0a0a;
    display: none; box-shadow: 0 0 15px var(--primary);
}
.is-online .online-glow { display: block; animation: pulse 1.5s infinite; }

@keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }

/* --- فضای چت --- */
.chat-window { flex: 1; display: flex; flex-direction: column; }
.chat-header { padding: 30px 50px; background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; }

#messages { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
.bubble {
    padding: 18px 28px; border-radius: 30px; max-width: 65%; font-size: 15px; line-height: 1.7;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}
.bubble.me { align-self: flex-end; background: var(--primary); color: #000; font-weight: 700; border-bottom-right-radius: 4px; }
.bubble.other { align-self: flex-start; background: #1a1a1a; border: 1px solid var(--border); border-bottom-left-radius: 4px; }

/* --- سیستم تماس --- */
#callUI {
    position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 20000;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    backdrop-filter: blur(80px);
}
.call-avatar-large {
    width: 180px; height: 180px; border-radius: 60px; background: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 80px; color: #000;
    margin-bottom: 40px; box-shadow: 0 0 50px var(--primary-glow);
}

</style>
</head>
<body>

<div class="bg-canvas">
    <div class="particle" style="width:400px; height:400px; top:10%; left:10%;"></div>
    <div class="particle" style="width:500px; height:500px; bottom:10%; right:10%; background:var(--accent);"></div>
</div>

<div id="loginScreen">
    <div class="brand-title">ALLO</div>
    <div class="login-card">
        <div class="auth-mode-switch">
            <button id="btnL" class="mode-btn active" onclick="setAuthMode('login')">ورود</button>
            <button id="btnR" class="mode-btn" onclick="setAuthMode('register')">ثبت‌نام</button>
        </div>
        <div class="input-container">
            <input id="uID" placeholder="USERNAME ID" autocomplete="off">
        </div>
        <div class="input-container">
            <input id="uPass" type="password" placeholder="ACCESS KEY">
        </div>
        <button class="action-btn" onclick="handleAuth()">INITIALIZE SESSION</button>
        <p style="margin-top:30px; font-size:10px; opacity:0.4; letter-spacing:3px;">SECURED BY ALLO END-TO-END</p>
    </div>
</div>

<div class="app-frame">
    <div class="sidebar">
        <div style="padding:45px 40px; border-bottom:1px solid var(--border);">
            <h1 style="font-family:'Orbitron'; color:var(--primary); font-size:28px; letter-spacing:5px;">ALLO</h1>
        </div>
        <div id="userList" style="flex:1; overflow-y:auto; padding-top:20px;"></div>
        <div style="padding:30px; background:rgba(0,0,0,0.3); border-top:1px solid var(--border);">
            <div id="myIDDisplay" style="font-family:monospace; font-size:12px; color:var(--primary); margin-bottom:10px;">NODE: DISCONNECTED</div>
            <button onclick="logout()" style="color:var(--secondary); background:none; border:none; cursor:pointer; font-weight:bold; font-size:12px;">TERMINATE CONNECTION ✕</button>
        </div>
    </div>

    <div class="chat-window">
        <div class="chat-header">
            <div style="display:flex; align-items:center; gap:20px;">
                <div id="hAvatar" style="width:50px; height:50px; background:var(--glass); border-radius:15px; display:flex; align-items:center; justify-content:center; font-family:'Orbitron'; font-weight:900;">?</div>
                <h3 id="targetName" style="font-weight:300; letter-spacing:1px;">Terminal Ready</h3>
            </div>
            <button onclick="startCall()" style="background:var(--primary); color:#000; border:none; padding:12px 25px; border-radius:15px; font-weight:900; cursor:pointer; box-shadow: 0 5px 15px var(--primary-glow);">CALL</button>
        </div>

        <div id="messages"></div>

        <div style="padding:30px 45px; display:flex; gap:20px; background:rgba(0,0,0,0.1);">
            <input id="msgInput" style="flex:1; padding:22px 35px; border-radius:25px; border:1px solid var(--border); background:rgba(0,0,0,0.5); color:#fff; outline:none;" placeholder="Enter encrypted data..." onkeypress="if(event.key=='Enter') sendMsg()">
            <button id="vBtn" onclick="toggleVoice()" style="width:65px; height:65px; border-radius:22px; border:1px solid var(--secondary); color:var(--secondary); background:none; font-size:24px; cursor:pointer;">🎤</button>
            <button onclick="sendMsg()" style="width:65px; height:65px; border-radius:22px; background:var(--primary); color:#000; border:none; font-size:24px; cursor:pointer;">✈</button>
        </div>
    </div>
</div>

<div id="callUI">
    <div class="call-avatar-large" id="cAvatar">👤</div>
    <h2 id="cName" style="font-family:'Orbitron'; font-size:40px; margin-bottom:10px;">USER</h2>
    <p id="cStatus" style="color:var(--primary); letter-spacing:5px; font-weight:100;">ESTABLISHING QUANTUM LINK...</p>
    <div style="display:flex; gap:40px; margin-top:60px;">
        <button id="acceptBtn" onclick="answerCall()" style="width:90px; height:90px; border-radius:30px; background:#2ecc71; border:none; font-size:35px; cursor:pointer; box-shadow: 0 0 30px rgba(46, 204, 113, 0.4);">✅</button>
        <button id="muteBtn" onclick="toggleMute()" style="width:90px; height:90px; border-radius:30px; background:rgba(255,255,255,0.1); border:1px solid var(--border); font-size:35px; cursor:pointer; display:none;">🎙️</button>
        <button onclick="hangup()" style="width:90px; height:90px; border-radius:30px; background:var(--secondary); border:none; font-size:35px; cursor:pointer; box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);">❌</button>
    </div>
</div>

<audio id="ring" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_ringtones.ogg" loop></audio>
<audio id="remoteAudio" autoplay></audio>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
    authDomain: "alloo-web.firebaseapp.com",
    projectId: "alloo-web",
    storageBucket: "alloo-web.appspot.com",
    messagingSenderId: "132232824762",
    appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me = localStorage.getItem("alloo_uid");
let activeTarget = "";
let authMode = 'login';
let pc; 
let localStream;
let isMuted = false;

if(me) { document.getElementById("loginScreen").style.display = "none"; initApp(); }

function setAuthMode(m) {
    authMode = m;
    document.getElementById('btnL').className = `mode-btn ${m==='login'?'active':''}`;
    document.getElementById('btnR').className = `mode-btn ${m==='register'?'active':''}`;
}

async function handleAuth() {
    const id = document.getElementById("uID").value.trim().toLowerCase();
    const ps = document.getElementById("uPass").value.trim();
    if(!id || !ps) return;
    const userRef = db.collection("users").doc(id);
    const doc = await userRef.get();
    if(authMode === 'register') {
        if(doc.exists) return alert("آی‌دی رزرو شده است.");
        await userRef.set({ pass: ps, online: true, lastSeen: Date.now() });
    } else {
        if(!doc.exists || doc.data().pass !== ps) return alert("اطلاعات ورود نادرست است.");
        await userRef.update({ online: true, lastSeen: Date.now() });
    }
    localStorage.setItem("alloo_uid", id);
    location.reload();
}

function initApp() {
    document.getElementById("myIDDisplay").innerText = "NODE: " + me.toUpperCase();
    db.collection("users").doc(me).update({ online: true, lastSeen: Date.now() });
    setInterval(() => db.collection("users").doc(me).update({ lastSeen: Date.now(), online: true }), 20000);

    db.collection("users").onSnapshot(snap => {
        const list = document.getElementById("userList");
        list.innerHTML = "";
        snap.forEach(doc => {
            if(doc.id === me) return;
            const d = doc.data();
            const isOnline = d.online && (Date.now() - d.lastSeen < 60000);
            const item = document.createElement("div");
            item.className = `user-item ${activeTarget === doc.id ? 'active' : ''} ${isOnline ? 'is-online' : ''}`;
            item.innerHTML = `
                <div class="avatar-hex">${doc.id[0].toUpperCase()}<div class="online-glow"></div></div>
                <div style="flex:1">
                    <div style="font-weight:900; font-size:16px;">${doc.id}</div>
                    <div style="font-size:10px; opacity:0.4;">${isOnline ? 'ENCRYPTED CHANNEL OPEN' : 'STATION OFFLINE'}</div>
                </div>`;
            item.onclick = () => { activeTarget = doc.id; selectUser(); };
            list.appendChild(item);
        });
    });
    listenForCalls();
}

function selectUser() {
    document.getElementById("targetName").innerText = activeTarget.toUpperCase();
    document.getElementById("hAvatar").innerText = activeTarget[0].toUpperCase();
    loadMessages();
}

function loadMessages() {
    db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
        const box = document.getElementById("messages");
        box.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            if((d.f==me && d.t==activeTarget) || (d.f==activeTarget && d.t==me)) {
                const m = document.createElement("div");
                m.className = `bubble ${d.f==me ? 'me' : 'other'}`;
                if(d.audio) m.innerHTML = `<audio src="${d.audio}" controls style="filter:invert(1)"></audio>`;
                else m.innerText = d.txt;
                box.appendChild(m);
            }
        });
        box.scrollTop = box.scrollHeight;
    });
}

function sendMsg() {
    const i = document.getElementById("msgInput");
    if(!i.value || !activeTarget) return;
    db.collection("messages").add({ f: me, t: activeTarget, txt: i.value, time: Date.now() });
    i.value = "";
}

// --- سیستم تبادل سیگنال صوتی ---
const rtcConfig = { iceServers: [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }] };

async function startCall() {
    if(!activeTarget) return;
    document.getElementById("callUI").style.display = "flex";
    document.getElementById("cName").innerText = activeTarget.toUpperCase();
    document.getElementById("acceptBtn").style.display = "none";
    document.getElementById("muteBtn").style.display = "block";
    
    pc = new RTCPeerConnection(rtcConfig);
    
    pc.onicecandidate = e => {
        if(e.candidate) {
            db.collection("calls").doc(activeTarget).collection("callerCandidates").add(e.candidate.toJSON());
        }
    };

    pc.ontrack = e => {
        document.getElementById("remoteAudio").srcObject = e.streams[0];
        document.getElementById("cStatus").innerText = "CONNECTED";
    };

    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await db.collection("calls").doc(activeTarget).delete(); 
    await db.collection("calls").doc(activeTarget).set({ offer, from: me });

    db.collection("calls").doc(activeTarget).onSnapshot(async snap => {
        const d = snap.data();
        if(d?.answer && !pc.currentRemoteDescription) {
            await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
        }
    });

    db.collection("calls").doc(activeTarget).collection("receiverCandidates").onSnapshot(s => {
        s.docChanges().forEach(c => { if(c.type==='added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
    });
}

function listenForCalls() {
    db.collection("calls").doc(me).onSnapshot(async snap => {
        const d = snap.data();
        if(d?.offer && !pc) {
            window.incoming = d;
            document.getElementById("callUI").style.display = "flex";
            document.getElementById("cName").innerText = d.from.toUpperCase();
            document.getElementById("acceptBtn").style.display = "block";
            document.getElementById("muteBtn").style.display = "none";
            document.getElementById("ring").play();
        } else if(!d && pc) hangup();
    });
}

async function answerCall() {
    document.getElementById("ring").pause();
    document.getElementById("acceptBtn").style.display = "none";
    document.getElementById("muteBtn").style.display = "block";
    document.getElementById("cStatus").innerText = "ESTABLISHING...";

    pc = new RTCPeerConnection(rtcConfig);
    
    pc.onicecandidate = e => {
        if(e.candidate) {
            db.collection("calls").doc(me).collection("receiverCandidates").add(e.candidate.toJSON());
        }
    };

    pc.ontrack = e => {
        document.getElementById("remoteAudio").srcObject = e.streams[0];
        document.getElementById("cStatus").innerText = "CONNECTED";
    };

    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    await pc.setRemoteDescription(new RTCSessionDescription(window.incoming.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    
    await db.collection("calls").doc(me).update({ answer });

    db.collection("calls").doc(me).collection("callerCandidates").onSnapshot(s => {
        s.docChanges().forEach(c => { if(c.type==='added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
    });
}

function toggleMute() {
    if (!localStream) return;
    isMuted = !isMuted;
    localStream.getAudioTracks()[0].enabled = !isMuted;
    const btn = document.getElementById("muteBtn");
    btn.innerText = isMuted ? "🚫" : "🎙️";
    btn.style.background = isMuted ? "var(--secondary)" : "rgba(255,255,255,0.1)";
}

function hangup() {
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    if(pc) { pc.close(); pc = null; }
    db.collection("calls").doc(me).delete();
    if(activeTarget) db.collection("calls").doc(activeTarget).delete();
    document.getElementById("callUI").style.display = "none";
    document.getElementById("ring").pause();
    document.getElementById("cStatus").innerText = "ESTABLISHING QUANTUM LINK...";
    isMuted = false;
    document.getElementById("muteBtn").innerText = "🎙️";
    document.getElementById("muteBtn").style.background = "rgba(255,255,255,0.1)";
}

let rec; let chunks = [];
async function toggleVoice() {
    const v = document.getElementById("vBtn");
    if(!rec || rec.state === 'inactive') {
        const s = await navigator.mediaDevices.getUserMedia({ audio: true });
        rec = new MediaRecorder(s); chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
            const b = new Blob(chunks, { type: 'audio/webm' });
            const r = new FileReader(); r.readAsDataURL(b);
            r.onloadend = () => db.collection("messages").add({ f: me, t: activeTarget, audio: r.result, time: Date.now() });
        };
        rec.start(); v.style.background = "var(--secondary)";
    } else { rec.stop(); v.style.background = "none"; }
}

function logout() { db.collection("users").doc(me).update({ online: false }); localStorage.clear(); location.reload(); }
</script>
</body>
</html>
