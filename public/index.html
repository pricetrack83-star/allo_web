<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLO</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{margin:0;font-family:'Vazirmatn',sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;transition:0.5s;background:linear-gradient(135deg,#0f0f0f,#1a1a1a);color:white;}
body.light{background:linear-gradient(135deg,#f5f5f5,#ddd);color:#111;}

.app{width:800px;height:600px;border-radius:20px;backdrop-filter:blur(20px);display:flex;flex-direction:column;overflow:hidden;transition:0.5s;box-shadow:0 0 50px rgba(0,255,118,0.5);}
body.light .app{box-shadow:0 0 60px rgba(0,170,255,0.5);backdrop-filter:blur(25px);border:2px solid rgba(0,170,255,0.3);}

#loginBox,#chatBox{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px;}
#loginBox input,#chatBox input{width:300px;padding:12px;border-radius:25px;border:none;background:#222;color:white;outline:none;transition:0.3s;}
body.light #loginBox input, body.light #chatBox input{background:linear-gradient(145deg,#fff,#e0f7ff);color:#111;box-shadow:0 4px 15px rgba(0,170,255,0.3);border:1px solid rgba(0,170,255,0.2);}
#loginBox button,#chatBox button{width:150px;padding:12px;border-radius:25px;border:none;background:linear-gradient(135deg,#00ff80,#00e676);color:black;cursor:pointer;font-weight:bold;transition:0.3s;}
body.light #loginBox button,body.light #chatBox button{background:linear-gradient(135deg,#00cfff,#00aaff);color:white;box-shadow:0 6px 25px rgba(0,170,255,0.5);}
#messages{flex:1;width:95%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:10px;}
.msg{padding:10px 16px;border-radius:25px;max-width:70%;word-break:break-word;}
.msg.me{background:linear-gradient(135deg,#00ff80,#00e676);color:black;align-self:flex-end;}
body.light .msg.me{background:linear-gradient(135deg,#00cfff,#00aaff);color:#111;}
.msg.other{background:linear-gradient(135deg,#333,#111);color:white;align-self:flex-start;}
body.light .msg.other{background:linear-gradient(135deg,#d0f0ff,#a0e0ff);color:#111;}
</style>
</head>
<body class="dark">
<div class="app">

<div id="loginBox">
  <input id="usernameInput" placeholder="نام کاربری">
  <input id="passwordInput" type="password" placeholder="رمز عبور">
  <button onclick="registerUser()">ثبت نام</button>
  <button onclick="loginUser()">ورود</button>
  <button onclick="toggleTheme()">تغییر تم 🌗</button>
</div>

<div id="chatBox" style="display:none;">
  <input id="targetUser" placeholder="نام کاربری گیرنده">
  <div id="messages"></div>
  <div style="display:flex;gap:10px;width:95%;">
    <input id="msgInput" placeholder="پیام...">
    <button onclick="sendMessage()">💬 ارسال</button>
  </div>
  <button onclick="logout()" style="margin-top:10px;background:#ff5252;color:white;">خروج</button>
</div>

<script>
// Firebase
const firebaseConfig = {
  apiKey:"AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
  authDomain:"alloo-web.firebaseapp.com",
  projectId:"alloo-web",
  storageBucket:"alloo-web.firebasestorage.app",
  messagingSenderId:"132232824762",
  appId:"1:132232824762:web:4e3c25557c072f0feabf83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me="";

// Theme
function toggleTheme(){document.body.classList.toggle('light');document.body.classList.toggle('dark');}

// Register & Login
function registerUser(){
  let u=document.getElementById("usernameInput").value.trim();
  let p=document.getElementById("passwordInput").value.trim();
  if(!u||!p) return alert("هر دو فیلد لازم است");
  db.collection("users").doc(u).get().then(doc=>{
    if(doc.exists) return alert("این کاربر قبلاً ساخته شده است");
    db.collection("users").doc(u).set({password:p});
    me=u; localStorage.setItem("allo_user",me); startApp();
  });
}

function loginUser(){
  let u=document.getElementById("usernameInput").value.trim();
  let p=document.getElementById("passwordInput").value.trim();
  if(!u||!p) return alert("هر دو فیلد لازم است");
  db.collection("users").doc(u).get().then(doc=>{
    if(!doc.exists) return alert("کاربر وجود ندارد");
    if(doc.data().password!==p) return alert("رمز اشتباه است");
    me=u; localStorage.setItem("allo_user",me); startApp();
  });
}

// Keep login
window.onload = function(){
  let saved = localStorage.getItem("allo_user");
  if(saved){ me = saved; startApp(); }
}

// Start Chat
function startApp(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("chatBox").style.display="flex";
  loadMessages();
}

// Load messages
function loadMessages(){
  db.collection("messages")
    .orderBy("timestamp")
    .onSnapshot(snap=>{
      const msgs=document.getElementById("messages");
      msgs.innerHTML="";
      snap.forEach(doc=>{
        const data=doc.data();
        if(data.from===me || data.to===me){
          let div=document.createElement("div");
          div.className="msg "+(data.from===me?"me":"other");
          div.innerText=data.msg;
          msgs.appendChild(div);
        }
      });
      msgs.scrollTop = msgs.scrollHeight;
    });
}

// Send message
function sendMessage(){
  let input=document.getElementById("msgInput");
  let target=document.getElementById("targetUser").value.trim();
  if(!input.value||!target) return alert("پیام و نام کاربری گیرنده لازم است");
  db.collection("messages").add({
    from: me, to: target, msg: input.value,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });
  input.value="";
}

// Logout
function logout(){ localStorage.removeItem("allo_user"); location.reload(); }
</script>

</div>
</body>
</html>
