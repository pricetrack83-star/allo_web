<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLOO ULTRA</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/wavesurfer.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.container{
  width:390px;
  height:660px;
  border-radius:30px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(25px);
  box-shadow:0 25px 70px rgba(0,0,0,0.7);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header{
  padding:15px;
  text-align:center;
  font-weight:bold;
  background:linear-gradient(90deg,#00e676,#00c853);
  color:black;
}

#login,#chat{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:15px;
}

#chat{display:none;}

input{
  padding:12px;
  border-radius:15px;
  border:none;
  background:rgba(255,255,255,0.1);
  color:white;
}

button{
  padding:10px;
  border:none;
  border-radius:15px;
  background:#00e676;
  cursor:pointer;
}

#users{
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.user{
  padding:6px 12px;
  border-radius:20px;
  background:rgba(255,255,255,0.1);
}

.online{border:1px solid #00e676;}

#messages{
  flex:1;
  overflow:auto;
}

.msg{
  margin:8px 0;
  padding:12px;
  border-radius:20px;
  max-width:75%;
}

.me{background:#00e676;color:black;align-self:flex-end;}
.other{background:#333;}

img{
  max-width:100%;
  border-radius:10px;
  margin-top:5px;
}

.footer{
  display:flex;
  gap:5px;
}

.footer input{flex:1;}

.typing{
  font-size:12px;
  opacity:0.7;
}

.voice-btn{background:#ff5252;}
</style>
</head>

<body>

<div class="container">

<div class="header">ALLOO ULTRA 🚀</div>

<div id="login">
<input id="name" placeholder="اسم">
<button onclick="login()">ورود</button>
</div>

<div id="chat">

<div id="users"></div>

<div id="messages"></div>

<div id="typing" class="typing"></div>

<div class="footer">
<input id="msg" placeholder="پیام..." oninput="typing()">
<button onclick="send()">➤</button>
<input type="file" id="img" hidden>
<button onclick="document.getElementById('img').click()">📸</button>
<button onclick="record()" class="voice-btn">🎤</button>
</div>

<button onclick="logout()">خروج</button>

</div>

</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
authDomain:"alloo-web.firebaseapp.com",
projectId:"alloo-web"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let me="",activeUser="",mediaRecorder,chunks=[];

// 🔔 notification
if(Notification.permission!=="granted"){
  Notification.requestPermission();
}

// login
function login(){
  me=name.value.trim();
  if(!me)return alert("اسم بزن");

  localStorage.setItem("allo_user",me);

  db.collection("users").doc(me).set({online:true});
  start();
}

function start(){
  loginDiv.style.display="none";
  chat.style.display="flex";
  loadUsers();
  loadMessages();
}

// users
function loadUsers(){
  db.collection("users").onSnapshot(s=>{
    users.innerHTML="";
    s.forEach(d=>{
      if(d.id===me)return;
      let div=document.createElement("div");
      div.className="user "+(d.data().online?"online":"");
      div.innerText=d.id;
      div.onclick=()=>activeUser=d.id;
      users.appendChild(div);
    });
  });
}

// messages
function loadMessages(){
  db.collection("messages").orderBy("time")
  .onSnapshot(s=>{
    messages.innerHTML="";
    s.forEach(d=>{
      let m=d.data();

      if(!(m.from===me && m.to===activeUser) &&
         !(m.from===activeUser && m.to===me)) return;

      let div=document.createElement("div");
      div.className="msg "+(m.from===me?"me":"other");

      if(m.text) div.innerHTML=`${m.text}`;

      if(m.img){
        let im=document.createElement("img");
        im.src=m.img;
        div.appendChild(im);
      }

      if(m.audio){
        let a=document.createElement("audio");
        a.src=m.audio;
        a.controls=true;
        div.appendChild(a);
      }

      if(m.seen && m.from===me){
        div.innerHTML+=" ✔✔";
      }

      messages.appendChild(div);

      // 🔔 notification
      if(m.from!==me && document.hidden){
        new Notification(m.from+" : "+(m.text||"📩"));
      }

      // ✔ seen
      if(m.to===me && !m.seen){
        db.collection("messages").doc(d.id).update({seen:true});
      }
    });

    messages.scrollTop=99999;
  });
}

// send
function send(){
  let t=msg.value.trim();
  if(!t||!activeUser)return;

  db.collection("messages").add({
    from:me,to:activeUser,text:t,time:Date.now()
  });

  msg.value="";
}

// 📸 image
img.onchange=()=>{
  let file=img.files[0];
  let r=new FileReader();
  r.onload=()=>{
    db.collection("messages").add({
      from:me,to:activeUser,img:r.result,time:Date.now()
    });
  };
  r.readAsDataURL(file);
};

// 🎤 voice
async function record(){
  if(!activeUser)return alert("یوزر انتخاب کن");

  if(!mediaRecorder){
    let s=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(s);

    mediaRecorder.ondataavailable=e=>chunks.push(e.data);

    mediaRecorder.onstop=()=>{
      let b=new Blob(chunks);
      chunks=[];
      let r=new FileReader();
      r.onload=()=>{
        db.collection("messages").add({
          from:me,to:activeUser,audio:r.result,time:Date.now()
        });
      };
      r.readAsDataURL(b);
    };

    mediaRecorder.start();
  }else{
    mediaRecorder.stop();
    mediaRecorder=null;
  }
}

// typing
function typing(){
  db.collection("typing").doc(activeUser).set({from:me});
}

// logout
function logout(){
  db.collection("users").doc(me).update({online:false});
  localStorage.removeItem("allo_user");
  location.reload();
}

// auto login
window.onload=()=>{
  let u=localStorage.getItem("allo_user");
  if(u){
    me=u;
    db.collection("users").doc(me).set({online:true});
    start();
  }
};
</script>

</body>
</html>
