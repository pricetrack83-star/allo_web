<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLOO - Cyber Pro v3</title> 

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/wavesurfer.js"></script>

<style>
:root {
    --primary: #00ffcc;
    --secondary: #ff0055;
    --bg-dark: #020202;
    --glass: rgba(255, 255, 255, 0.03);
    --neon-box: 0 0 20px rgba(0, 255, 204, 0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }

body { 
    font-family: 'Vazirmatn', sans-serif; background: var(--bg-dark); color: white;
    height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
}

/* پس‌زمینه متحرک سایبرپانک */
.cyber-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    background: linear-gradient(45deg, #050505 0%, #000 100%);
}
.cyber-orb {
    position: absolute; border-radius: 50%; filter: blur(120px);
    animation: rotate 20s infinite linear;
}
.orb-1 { width: 400px; height: 400px; background: var(--primary); top: -10%; left: -10%; opacity: 0.1; }
.orb-2 { width: 500px; height: 500px; background: var(--secondary); bottom: -15%; right: -10%; opacity: 0.1; }

@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ساختار اپلیکیشن */
.app {
    width: 95vw; height: 92vh; max-width: 1300px;
    background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(50px);
    border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; box-shadow: 0 50px 100px rgba(0,0,0,0.9); position: relative;
}

/* سایدبار */
.sidebar { width: 340px; border-left: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }
.sidebar-header { padding: 40px; border-bottom: 1px solid rgba(255,255,255,0.05); }

.user-card {
    margin: 10px 20px; padding: 18px; border-radius: 25px; background: var(--glass);
    cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    border: 1px solid transparent;
}
.user-card:hover { transform: scale(1.03); background: rgba(255,255,255,0.07); }
.user-card.active { border-color: var(--primary); background: rgba(0, 255, 204, 0.05); box-shadow: var(--neon-box); }

/* چت باکس */
.chat-main { flex: 1; display: flex; flex-direction: column; position: relative; }
.chat-header { padding: 25px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }

#messages { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
.msg { 
    padding: 18px 25px; border-radius: 30px; max-width: 70%; font-size: 15px; line-height: 1.7;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn { from { opacity: 0; transform: scale(0.8) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

.me { align-self: flex-end; background: linear-gradient(135deg, var(--primary), #00ccff); color: #000; font-weight: bold; border-bottom-right-radius: 5px; }
.other { align-self: flex-start; background: #1a1a1a; color: #fff; border-bottom-left-radius: 5px; border: 1px solid rgba(255,255,255,0.1); }

/* فوتر ورودی */
.footer { padding: 30px 45px; display: flex; gap: 20px; align-items: center; }
.input-wrap { flex: 1; position: relative; }
#msgInput { 
    width: 100%; padding: 20px 35px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.1);
    background: #000; color: #fff; outline: none; font-family: inherit; font-size: 16px;
}

.btn-icon { width: 60px; height: 60px; border-radius: 22px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 25px; }
.btn-send { background: var(--primary); color: #000; box-shadow: 0 10px 30px rgba(0, 255, 204, 0.4); }
.btn-voice { background: transparent; border: 1px solid var(--secondary); color: var(--secondary); }
.btn-voice.recording { background: var(--secondary); color: #fff; animation: pulse 1s infinite; }

@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.5); } 100% { box-shadow: 0 0 0 25px rgba(255, 0, 85, 0); } }

/* تماس تصویری/صوتی خفن */
#callBox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
    z-index: 10000; flex-direction: column; align-items: center; justify-content: center;
    backdrop-filter: blur(40px);
}
.call-card {
    text-align: center; padding: 80px; border-radius: 70px; background: var(--glass);
    border: 1px solid var(--primary); box-shadow: 0 0 100px rgba(0, 255, 204, 0.1);
    position: relative; overflow: hidden;
}
.call-avatar { width: 150px; height: 150px; border-radius: 50%; background: var(--primary); margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; font-size: 70px; color: #000; animation: ring 1.5s infinite; }

@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.6); } 100% { box-shadow: 0 0 0 60px rgba(0, 255, 204, 0); } }

/* لاگین */
#loginScreen { position: fixed; inset: 0; background: #000; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.login-inner { background: var(--glass); padding: 60px; border-radius: 45px; width: 420px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
.login-inner input { width: 100%; padding: 20px; margin-bottom: 20px; border-radius: 20px; border: none; background: #080808; color: #fff; text-align: center; font-size: 18px; }

audio { height: 40px; filter: invert(1); margin-top: 10px; }
</style>
</head>
<body>

<div class="cyber-bg">
    <div class="cyber-orb orb-1"></div>
    <div class="cyber-orb orb-2"></div>
</div>

<div id="loginScreen">
    <div style="font-size:80px; font-weight:900; color:var(--primary); letter-spacing:20px; margin-bottom:50px; text-shadow: var(--neon-box);">ALLOO</div>
    <div class="login-inner">
        <input id="uID" placeholder="ID کاربری">
        <input id="uPass" type="password" placeholder="رمز عبور">
        <button class="btn-icon" style="width:100%; background:var(--primary); color:#000; font-weight:900;" onclick="handleAuth()">ورود به شبکه</button>
    </div>
</div>

<div class="app">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2 style="color:var(--primary); letter-spacing:2px;">CONTACTS</h2>
        </div>
        <div id="userList" style="flex:1; overflow-y:auto; padding-top:20px;"></div>
        <div style="padding:30px; border-top:1px solid rgba(255,255,255,0.05);">
            <div id="myIDDisplay" style="font-size:12px; opacity:0.5; margin-bottom:10px;">ID: -</div>
            <button onclick="logout()" style="background:none; border:none; color:var(--secondary); font-weight:bold; cursor:pointer;">خروج امن ⬅</button>
        </div>
    </div>

    <div class="chat-main">
        <div class="chat-header">
            <div style="display:flex; align-items:center; gap:20px;">
                <div id="hAvatar" style="width:55px; height:55px; border-radius:20px; background:var(--primary); color:#000; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:22px;">?</div>
                <h3 id="hName">انتخاب مخاطب...</h3>
            </div>
            <div style="display:flex; gap:15px;">
                <button class="btn-icon" style="background:var(--glass); color:var(--primary);" onclick="startCall()">📞</button>
                <button class="btn-icon" style="background:var(--glass);" onclick="toggleTheme()">🌗</button>
            </div>
        </div>

        <div id="messages"></div>

        <div class="footer">
            <div class="input-wrap">
                <input id="msgInput" placeholder="پیام خود را تایپ کنید..." onkeypress="if(event.key=='Enter') sendMsg()">
            </div>
            <button id="vBtn" class="btn-icon btn-voice" onclick="toggleVoice()">🎤</button>
            <button class="btn-icon btn-send" onclick="sendMsg()">✈</button>
        </div>
    </div>
</div>

<div id="callBox">
    <div class="call-card">
        <div class="call-avatar" id="cAvatar">👤</div>
        <h2 id="cName" style="font-size:32px; margin-bottom:10px;">User</h2>
        <p id="cStatus" style="color:var(--primary); letter-spacing:1px;">در حال اتصال نئونی...</p>
        
        <div style="display:flex; gap:40px; justify-content:center; margin-top:50px;">
            <button id="acceptBtn" class="btn-icon" style="background:#2ecc71; width:90px; height:90px; display:none;" onclick="answerCall()">✅</button>
            <button class="btn-icon" style="background:var(--secondary); width:90px; height:90px;" onclick="hangup()">❌</button>
        </div>
    </div>
</div>

<audio id="ring" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_ringtones.ogg" loop></audio>

<script>
// --- پیکربندی فایربیس ---
const firebaseConfig = {
    apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
    authDomain: "alloo-web.firebaseapp.com",
    projectId: "alloo-web",
    storageBucket: "alloo-web.appspot.com",
    messagingSenderId: "132232824762",
    appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me = localStorage.getItem("alloo_uid");
let activeTarget = "";
let pc = null;
let localStream = null;
const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] };

if(me) { 
    document.getElementById("loginScreen").style.display = "none";
    initApp(); 
}

function handleAuth() {
    const id = document.getElementById("uID").value.trim();
    const ps = document.getElementById("uPass").value.trim();
    if(!id || !ps) return;
    db.collection("users").doc(id).set({ online: true, pass: ps }, {merge:true});
    localStorage.setItem("alloo_uid", id);
    location.reload();
}

function initApp() {
    document.getElementById("myIDDisplay").innerText = "MY ID: " + me;
    db.collection("users").doc(me).update({ online: true });
    
    // لود کاربران
    db.collection("users").onSnapshot(snap => {
        const list = document.getElementById("userList");
        list.innerHTML = "";
        snap.forEach(doc => {
            if(doc.id === me) return;
            const card = document.createElement("div");
            card.className = `user-card ${activeTarget === doc.id ? 'active' : ''}`;
            card.innerHTML = `
                <div style="display:flex; align-items:center; gap:15px;">
                    <div style="width:45px; height:45px; border-radius:14px; background:#111; display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--primary);">${doc.id[0].toUpperCase()}</div>
                    <b>${doc.id}</b>
                </div>
                <div style="width:10px; height:10px; border-radius:50%; background:${doc.data().online ? 'var(--primary)' : '#333'}"></div>
            `;
            card.onclick = () => { activeTarget = doc.id; selectUser(); };
            list.appendChild(card);
        });
    });

    listenForInboundCalls();
}

function selectUser() {
    document.getElementById("hName").innerText = activeTarget;
    document.getElementById("hAvatar").innerText = activeTarget[0].toUpperCase();
    loadMessages();
    initApp(); // رفرش استایل کارت‌ها
}

function loadMessages() {
    db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
        const box = document.getElementById("messages");
        box.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            if((d.f==me && d.t==activeTarget) || (d.f==activeTarget && d.t==me)) {
                const m = document.createElement("div");
                m.className = `msg ${d.f==me ? 'me' : 'other'}`;
                if(d.audio) m.innerHTML = `<audio src="${d.audio}" controls></audio>`;
                else m.innerText = d.txt;
                box.appendChild(m);
            }
        });
        box.scrollTop = box.scrollHeight;
    });
}

function sendMsg() {
    const inp = document.getElementById("msgInput");
    if(!inp.value || !activeTarget) return;
    db.collection("messages").add({ f: me, t: activeTarget, txt: inp.value, time: Date.now() });
    inp.value = "";
}

// ==================== سیستم تماس فوق پیشرفته (FIXED AUDIO) ====================

async function startCall() {
    if(!activeTarget) return;
    showCallUI(activeTarget, false);
    
    pc = new RTCPeerConnection(rtcConfig);
    
    // گرفتن میکروفون با کیفیت بالا
    localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    // دریافت صدای طرف مقابل
    pc.ontrack = e => {
        console.log("صدا دریافت شد!");
        const remoteAudio = new Audio();
        remoteAudio.srcObject = e.streams[0];
        remoteAudio.autoplay = true;
        remoteAudio.play(); // برای اطمینان در برخی مرورگرها
    };

    // تبادل کاندیداهای شبکه (بسیار مهم)
    pc.onicecandidate = e => {
        if(e.candidate) {
            db.collection("calls").doc(activeTarget).collection("callerCandidates").add(e.candidate.toJSON());
        }
    };

    // ایجاد پیشنهاد تماس
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await db.collection("calls").doc(activeTarget).set({
        offer: { sdp: offer.sdp, type: offer.type },
        from: me,
        status: "ringing"
    });

    // گوش دادن به Answer
    db.collection("calls").doc(activeTarget).onSnapshot(async snap => {
        const data = snap.data();
        if(data && data.answer && !pc.currentRemoteDescription) {
            await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            document.getElementById("cStatus").innerText = "متصل شد (امن)";
        }
    });

    // دریافت کاندیداهای طرف مقابل
    db.collection("calls").doc(activeTarget).collection("receiverCandidates").onSnapshot(snap => {
        snap.docChanges().forEach(change => {
            if(change.type === "added") pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        });
    });
}

function listenForInboundCalls() {
    db.collection("calls").doc(me).onSnapshot(async snap => {
        const data = snap.data();
        if(data && data.offer && !pc) {
            window.incomingCall = data;
            showCallUI(data.from, true);
            document.getElementById("ring").play();
        } else if(!data && pc) {
            hangup();
        }
    });
}

async function answerCall() {
    document.getElementById("ring").pause();
    document.getElementById("acceptBtn").style.display = "none";
    document.getElementById("cStatus").innerText = "در حال تبادل کلیدهای صوتی...";
    
    pc = new RTCPeerConnection(rtcConfig);
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.ontrack = e => {
        const remoteAudio = new Audio();
        remoteAudio.srcObject = e.streams[0];
        remoteAudio.autoplay = true;
        remoteAudio.play();
    };

    pc.onicecandidate = e => {
        if(e.candidate) {
            db.collection("calls").doc(me).collection("receiverCandidates").add(e.candidate.toJSON());
        }
    };

    await pc.setRemoteDescription(new RTCSessionDescription(window.incomingCall.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    
    await db.collection("calls").doc(me).update({ answer: { sdp: answer.sdp, type: answer.type } });

    // دریافت کاندیداهای Caller
    db.collection("calls").doc(me).collection("callerCandidates").onSnapshot(snap => {
        snap.docChanges().forEach(change => {
            if(change.type === "added") pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        });
    });
}

function showCallUI(name, incoming) {
    document.getElementById("callBox").style.display = "flex";
    document.getElementById("cName").innerText = name;
    document.getElementById("acceptBtn").style.display = incoming ? "block" : "none";
}

function hangup() {
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    if(pc) { pc.close(); pc = null; }
    db.collection("calls").doc(me).delete();
    if(activeTarget) db.collection("calls").doc(activeTarget).delete();
    document.getElementById("callBox").style.display = "none";
    document.getElementById("ring").pause();
}

// ==================== ویس مسیج نئونی ====================
let rec;
let chunks = [];
async function toggleVoice() {
    const btn = document.getElementById("vBtn");
    if(!rec || rec.state === "inactive") {
        const s = await navigator.mediaDevices.getUserMedia({ audio: true });
        rec = new MediaRecorder(s);
        chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
            const b = new Blob(chunks, { type: 'audio/webm' });
            const r = new FileReader();
            r.readAsDataURL(b);
            r.onloadend = () => db.collection("messages").add({ f: me, t: activeTarget, audio: r.result, time: Date.now() });
        };
        rec.start();
        btn.classList.add("recording");
    } else {
        rec.stop();
        btn.classList.remove("recording");
    }
}

function logout() { db.collection("users").doc(me).update({ online: false }); localStorage.clear(); location.reload(); }
function toggleTheme() { document.body.classList.toggle("light"); }
</script>
</body>
</html>
