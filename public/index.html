<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLOO Ultra Pro v4</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
<script src="https://unpkg.com/wavesurfer.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/10.20.0/firebase-app.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/10.20.0/firebase-firestore.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/10.20.0/firebase-storage.js"></script>
<style>
/* --- همه CSS قبلی شما --- */
body { margin:0; font-family:'Vazirmatn',sans-serif; background:linear-gradient(135deg,#0f0f0f,#1a1a1a); color:white; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; transition:0.5s; }
body.light { background: linear-gradient(135deg,#fff,#eee); color:#111; }
/* ... بقیه CSS مثل قبل بدون تغییر ... */
</style>
</head>
<body>

<div id="login-page">
<h1>ALLOO</h1>
<input type="text" id="u-in" placeholder="نام شما...">
<button onclick="enter()">ورود</button>
</div>

<div id="chat-page">
<div id="sidebar">
<h4>آنلاین</h4>
<button id="signout-btn">خروج</button>
<div id="u-list"></div>
<select id="u-to"><option value="">عمومی</option></select>
<button id="theme-toggle">تغییر تم</button>
</div>
<div id="chat-area">
<div id="messages"></div>
<div class="input-box">
<button id="v-btn">🎤</button>
<input type="text" id="m-in" placeholder="پیام...">
<button onclick="send()">ارسال</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.20.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.20.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.20.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
  authDomain: "alloo-web.firebaseapp.com",
  projectId: "alloo-web",
  storageBucket: "alloo-web.appspot.com",
  messagingSenderId: "132232824762",
  appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};

// Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// Socket.IO
const socket = io("https://allo-web-nu.vercel.app");

let me="", unread={}, activeChat="";

// ورود
socket.on("connect", () => {
    const storedUser = localStorage.getItem("alloouser");
    if (storedUser) { me = storedUser; socket.emit("login", me); }
});
function enter() {
    me = document.getElementById("u-in").value.trim();
    if (!me || me.length<3) return alert("نام معتبر وارد کنید!");
    localStorage.setItem("alloouser", me);
    socket.emit("login", me);
}
socket.on("login-success", () => {
    document.getElementById("login-page").style.display="none";
    document.getElementById("chat-page").style.display="flex";
});

// ارسال پیام متنی
function send() {
    const txt = document.getElementById("m-in").value.trim();
    const to = document.getElementById("u-to").value;
    if(txt){
        const msg = { from: me, to: to, text: txt, timestamp: new Date() };
        addDoc(collection(db,"messages"), msg);
        document.getElementById("m-in").value="";
        if(to) activeChat = to;
    }
}

// نمایش پیام
function showMessage(data){
    if(data.to && data.to!==me && data.from!==me) return;
    const div = document.createElement("div");
    div.className = `msg ${data.from===me?'my':'at'}`;
    const toInfo = data.to?`<small>به ${data.to}</small>`:'';
    div.innerHTML=`<strong>${data.from}</strong>${toInfo}<br>${data.text||''}`;
    if(data.audio){
        const container = document.createElement("div");
        container.className='waveform-container';
        const ws = WaveSurfer.create({container:container,waveColor:data.from===me?'#00e676':'#ff5252',progressColor:'#fff',cursorColor:'#fff',barWidth:2,height:50,responsive:true});
        ws.load(data.audio);
        container.onclick=()=>{ ws.isPlaying()?ws.pause():ws.play(); };
        div.appendChild(container);
    }
    document.getElementById("messages").appendChild(div);
    document.getElementById("messages").scrollTop = 99999;
}

// دریافت پیام realtime از Firestore
const q = query(collection(db,"messages"), orderBy("timestamp"));
onSnapshot(q, snapshot => {
    snapshot.docChanges().forEach(change=>{ if(change.type==="added") showMessage(change.doc.data()); });
});

// کاربران آنلاین (simulated via Socket.IO)
socket.on("users", us => {
    const ul = document.getElementById("u-list");
    ul.innerHTML='';
    us.forEach((u,i)=>{
        const div = document.createElement("div");
        div.textContent=u + (unread[u]?` (${unread[u]})`:'' );
        setTimeout(()=>div.classList.add("show"), i*100);
        ul.appendChild(div);
    });
    const sel = document.getElementById("u-to");
    const prev = sel.value;
    sel.innerHTML='<option value="">عمومی</option>'+us.map(u=>`<option value="${u}">${u}</option>`).join('');
    if(us.find(u=>u===prev)) sel.value=prev;
});

// ضبط و ارسال ویس
let r;
document.getElementById("v-btn").onclick = async function() {
    if(r && r.state==="recording"){ r.stop(); this.textContent="🎤"; }
    else{
        const s = await navigator.mediaDevices.getUserMedia({audio:true});
        r = new MediaRecorder(s);
        let ch=[];
        r.ondataavailable = e => ch.push(e.data);
        r.onstop = async ()=>{
            const b = new Blob(ch,{type:'audio/webm'});
            const fr = new FileReader();
            fr.onloadend = async ()=>{
                const fileRef = ref(storage, `voices/${Date.now()}.webm`);
                await uploadBytes(fileRef, b);
                const url = await getDownloadURL(fileRef);
                addDoc(collection(db,"messages"), {from:me, to:document.getElementById("u-to").value, audio:url, timestamp:new Date()});
            };
            fr.readAsDataURL(b);
        };
        r.start(); this.textContent="⏹";
    }
};

// تم
document.getElementById("theme-toggle").onclick=()=>{ document.body.classList.toggle('light'); };

// Sign Out
document.getElementById("signout-btn").onclick=()=>{ localStorage.removeItem("alloouser"); location.reload(); };

// نوتیفیکیشن
if(Notification.permission!=="granted") Notification.requestPermission();
window.addEventListener("focus",()=>{ unread={}; document.title='ALLOO'; });
</script>
</body>
</html>
