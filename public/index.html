<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLO</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#1d2671,#c33764);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.app{
  width:400px;
  height:680px;
  border-radius:25px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header{
  padding:15px;
  text-align:center;
  background:#00e676;
  color:black;
  font-weight:bold;
}

#login,#chat{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:10px;
}

#chat{display:none;}

input{
  padding:10px;
  border:none;
  border-radius:10px;
  margin-top:10px;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  margin-top:5px;
  cursor:pointer;
}

#users{
  display:flex;
  gap:5px;
  overflow-x:auto;
}

.user{
  padding:5px 10px;
  background:#333;
  border-radius:15px;
  cursor:pointer;
}

.active{
  background:#00e676;
  color:black;
}

#messages{
  flex:1;
  overflow:auto;
}

.msg{
  padding:10px;
  margin:5px;
  border-radius:15px;
  max-width:70%;
}

.me{background:#00e676;color:black;align-self:flex-end;}
.other{background:#333;}

img{max-width:100%;border-radius:10px;margin-top:5px;}

.footer{
  display:flex;
  gap:5px;
}

.footer input{flex:1;}

.typing{font-size:12px;opacity:0.7;}
.voice-btn{background:#ff5252;color:white;}
</style>
</head>

<body>

<div class="app">

<div class="header">ALLO 🚀</div>

<div id="login">
<input id="name" placeholder="اسم">
<button onclick="login()">ورود</button>
</div>

<div id="chat">

<div id="users"></div>

<div id="messages"></div>

<div id="typing" class="typing"></div>

<div class="footer">
<input id="msg" placeholder="پیام..." oninput="sendTyping()">
<button onclick="send()">➤</button>
<input type="file" id="img" hidden>
<button onclick="img.click()">📸</button>
<button onclick="record()" class="voice-btn">🎤</button>
</div>

<button onclick="logout()">خروج</button>

</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCEVfe1DpEB4sVjng3Q5qaZ-190QjmXyY0",
  authDomain: "alloo-web.firebaseapp.com",
  projectId: "alloo-web",
  storageBucket: "alloo-web.firebasestorage.app",
  messagingSenderId: "132232824762",
  appId: "1:132232824762:web:4e3c25557c072f0feabf83"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me="",activeUser="",mediaRecorder,chunks=[];

// 🔔 notification
if(Notification.permission!=="granted"){
  Notification.requestPermission();
}

// login
function login(){
  me=name.value.trim();
  if(!me) return alert("اسم بزن");

  localStorage.setItem("allo_user",me);
  db.collection("users").doc(me).set({online:true});
  start();
}

function start(){
  login.style.display="none";
  chat.style.display="flex";
  loadUsers();
}

// users
function loadUsers(){
  db.collection("users").onSnapshot(s=>{
    users.innerHTML="";
    s.forEach(d=>{
      if(d.id===me) return;

      let div=document.createElement("div");
      div.className="user";
      div.innerText=d.id;

      div.onclick=()=>{
        activeUser=d.id;
        loadMessages();
      };

      users.appendChild(div);
    });
  });
}

// messages
function loadMessages(){
  db.collection("messages").orderBy("time")
  .onSnapshot(s=>{
    messages.innerHTML="";

    s.forEach(doc=>{
      let m=doc.data();

      if(!(m.from===me&&m.to===activeUser) &&
         !(m.from===activeUser&&m.to===me)) return;

      let div=document.createElement("div");
      div.className="msg "+(m.from===me?"me":"other");

      if(m.text) div.innerHTML=m.text;

      if(m.img){
        let im=document.createElement("img");
        im.src=m.img;
        div.appendChild(im);
      }

      if(m.audio){
        let a=document.createElement("audio");
        a.src=m.audio;
        a.controls=true;
        div.appendChild(a);
      }

      if(m.seen && m.from===me){
        div.innerHTML+=" ✔✔";
      }

      messages.appendChild(div);

      // seen
      if(m.to===me && !m.seen){
        db.collection("messages").doc(doc.id).update({seen:true});
      }

      // notification
      if(m.from!==me && document.hidden){
        new Notification(m.from+" : "+(m.text||"📩"));
      }
    });

    messages.scrollTop=99999;
  });
}

// send text
function send(){
  if(!msg.value || !activeUser) return;

  db.collection("messages").add({
    from:me,
    to:activeUser,
    text:msg.value,
    time:Date.now()
  });

  msg.value="";
}

// 📸 image (Base64)
img.onchange=()=>{
  let file=img.files[0];
  let r=new FileReader();

  r.onload=()=>{
    db.collection("messages").add({
      from:me,
      to:activeUser,
      img:r.result,
      time:Date.now()
    });
  };

  r.readAsDataURL(file);
};

// 🎤 voice (Base64)
async function record(){
  if(!activeUser) return alert("یوزر انتخاب کن");

  if(!mediaRecorder){
    let stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream);

    mediaRecorder.ondataavailable=e=>chunks.push(e.data);

    mediaRecorder.onstop=()=>{
      let blob=new Blob(chunks);
      chunks=[];
      let r=new FileReader();

      r.onload=()=>{
        db.collection("messages").add({
          from:me,
          to:activeUser,
          audio:r.result,
          time:Date.now()
        });
      };

      r.readAsDataURL(blob);
    };

    mediaRecorder.start();
  }else{
    mediaRecorder.stop();
    mediaRecorder=null;
  }
}

// typing
function sendTyping(){
  if(!activeUser) return;

  db.collection("typing").doc(activeUser).set({
    from:me
  });
}

// logout
function logout(){
  db.collection("users").doc(me).update({online:false});
  localStorage.removeItem("allo_user");
  location.reload();
}

// auto login
window.onload=()=>{
  let u=localStorage.getItem("allo_user");
  if(u){
    me=u;
    db.collection("users").doc(me).set({online:true});
    start();
  }
};
</script>

</body>
</html>
