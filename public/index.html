<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALLO</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/wavesurfer.js"></script>
<style>
body{margin:0;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;transition:0.5s;background:#111;color:white;}
body.light{background:#eee;color:#111;}
.app{width:1000px;height:720px;border-radius:20px;display:flex;overflow:hidden;background:rgba(0,0,0,0.7);}
#loginBox, #chatBox{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px;}
input{padding:12px;border-radius:25px;border:none;outline:none;width:250px;}
button{padding:12px 20px;border-radius:25px;border:none;cursor:pointer;background:#0f0;color:#000;}
#chatBox{display:none;flex-direction:row;}
#onlineList{width:220px;padding:15px;border-right:2px solid #0f0;}
#messages{flex:1;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:10px;}
.msg{padding:10px 15px;border-radius:20px;max-width:70%;word-break:break-word;}
.msg.me{align-self:flex-end;background:#0f0;color:#000;}
.msg.other{align-self:flex-start;background:#222;color:#fff;}
.footer{display:flex;gap:5px;padding:10px;border-top:2px solid #0f0;width:100%;}
#settingsModal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#222;color:white;padding:15px;border-radius:15px;display:none;flex-direction:column;gap:10px;}
</style>
</head>
<body>
<div class="app">

<!-- Login -->
<div id="loginBox">
  <h2>ALLO</h2>
  <input id="usernameInput" placeholder="نام کاربری">
  <input id="userIDInput" placeholder="شناسه یکتا">
  <input id="passwordInput" type="password" placeholder="رمز عبور">
  <button onclick="registerUser()">ثبت نام</button>
  <button onclick="loginUser()">ورود</button>
  <button onclick="toggleTheme()">تغییر تم</button>
</div>

<!-- Chat -->
<div id="chatBox">
  <div id="onlineList">
    <h3>آنلاین‌ها</h3>
    <div id="users"></div>
    <button onclick="openSettings()">تنظیمات</button>
  </div>
  <div id="chatArea">
    <div id="messages"></div>
    <div class="footer">
      <input id="msgInput" placeholder="پیام...">
      <button onclick="sendMessage()">💬</button>
      <input type="file" id="imgInput" style="display:none;">
      <button onclick="document.getElementById('imgInput').click()">📸</button>
      <button onclick="logout()">خروج</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal">
  <h3>تنظیمات کاربر</h3>
  <div>کد کوتاه شما: <span id="userCode"></span></div>
  <div>
    شناسه یکتا: <input id="editID">
    <button onclick="updateID()">تغییر</button>
  </div>
  <button onclick="closeSettings()">بستن</button>
</div>

<script>
// Firebase
const firebaseConfig = {
    apiKey:"YOUR_API_KEY",
    authDomain:"YOUR_PROJECT.firebaseapp.com",
    projectId:"YOUR_PROJECT",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me="", meCode="", meID="", activeUser="";

// Theme
function toggleTheme(){document.body.classList.toggle('light');}

// Generate unique code
async function generateUniqueCode(){
    let code, exists=true;
    while(exists){
        code='ALLO-'+Math.floor(1000+Math.random()*9000);
        const snap=await db.collection("users").where("code","==",code).get();
        exists=!snap.empty;
    }
    return code;
}

// Register
async function registerUser(){
    const u=document.getElementById("usernameInput").value.trim();
    const p=document.getElementById("passwordInput").value.trim();
    const id=document.getElementById("userIDInput").value.trim();
    if(!u||!p||!id)return alert("همه فیلدها لازم است");

    const doc = await db.collection("users").doc(u).get();
    if(doc.exists) return alert("کاربر قبلاً وجود دارد");

    const idSnap = await db.collection("users").where("id","==",id).get();
    if(!idSnap.empty) return alert("این شناسه قبلاً استفاده شده");

    const code=await generateUniqueCode();
    await db.collection("users").doc(u).set({password:p, online:true, code:code, id:id});

    me=u; meCode=code; meID=id;
    localStorage.setItem("allo_user",me);
    startApp();
}

// Login
async function loginUser(){
    const u=document.getElementById("usernameInput").value.trim();
    const p=document.getElementById("passwordInput").value.trim();
    if(!u||!p)return alert("همه فیلدها لازم است");

    const doc = await db.collection("users").doc(u).get();
    if(!doc.exists)return alert("کاربر وجود ندارد");
    if(doc.data().password!==p)return alert("رمز اشتباه است");

    me=u; meCode=doc.data().code; meID=doc.data().id;
    localStorage.setItem("allo_user",me);
    db.collection("users").doc(me).update({online:true});
    startApp();
}

// Start
function startApp(){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("chatBox").style.display="flex";
    document.getElementById("userCode").innerText=meCode;
    document.getElementById("editID").value=meID;
    loadUsers(); loadMessages();
}

// Load users
function loadUsers(){
    db.collection("users").onSnapshot(snap=>{
        const usersDiv=document.getElementById("users"); usersDiv.innerHTML="";
        snap.forEach(doc=>{
            if(doc.id===me)return;
            let div=document.createElement("div");
            div.textContent=doc.data().id+" ("+doc.data().code+") ["+(doc.data().online?"✅":"❌")+"]";
            div.onclick=()=>{ activeUser=doc.id; loadMessages(); };
            usersDiv.appendChild(div);
        });
    });
}

// Messages
function loadMessages(){
    if(!activeUser)return;
    const msgDiv=document.getElementById("messages"); msgDiv.innerHTML="";
    db.collection("messages").where("users","array-contains",me).orderBy("timestamp","asc").onSnapshot(snap=>{
        msgDiv.innerHTML="";
        snap.forEach(doc=>{
            const data=doc.data();
            if(!data.users.includes(activeUser))return;
            let div=document.createElement("div");
            div.className="msg "+(data.from===me?"me":"other");
            if(data.type==="text")div.innerText=data.msg;
            msgDiv.appendChild(div);
        });
    });
}

// Send
function sendMessage(){
    const input=document.getElementById("msgInput");
    if(!input.value.trim()||!activeUser)return;
    db.collection("messages").add({from:me,to:activeUser,msg:input.value,type:"text",users:[me,activeUser],timestamp:firebase.firestore.FieldValue.serverTimestamp()});
    input.value="";
}

// Logout
function logout(){db.collection("users").doc(me).update({online:false}); localStorage.removeItem("allo_user"); location.reload();}

// Settings
function openSettings(){document.getElementById("settingsModal").style.display="flex";}
function closeSettings(){document.getElementById("settingsModal").style.display="none";}

// Update ID
async function updateID(){
    const newID=document.getElementById("editID").value.trim();
    if(!newID)return alert("شناسه نمی‌تواند خالی باشد");
    const idSnap = await db.collection("users").where("id","==",newID).get();
    if(!idSnap.empty && idSnap.docs[0].id!==me)return alert("این شناسه قبلاً استفاده شده");
    await db.collection("users").doc(me).update({id:newID});
    meID=newID;
    alert("شناسه با موفقیت تغییر کرد");
}

// Auto login
window.onload=function(){
    const u=localStorage.getItem("allo_user");
    if(u){me=u; db.collection("users").doc(me).get().then(doc=>{
        meCode=doc.data().code; meID=doc.data().id;
        db.collection("users").doc(me).update({online:true}); startApp();
    });}
}
</script>
</div>
</body>
</html>
